<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920,height=1080" />
<title>just_chatting_preset.html</title>
<link rel="stylesheet" href="../../assets_shared.css" />

</head>
<body>
<div class="module-root">

<div class="top-hud">
  <div class="top-left">
    <div class="live"><div class="live-dot"></div><div class="live-text" id="live-label">LIVE</div></div>
  </div>
  <div class="top-center">
    <div class="brand">
      <div class="brand-badge"></div>
      <div class="brand-text"><span id="brand-main">Aurora</span> <span id="brand-accent">Grid</span></div>
    </div>
  </div>
  <div class="top-right"></div>
</div>

<div class="jc-title-box">
  <div class="brand-badge"></div>
  <div class="brand-text"><span id="brand-main">Aurora</span> <span id="brand-accent">Grid</span></div>
</div>
<div class="jc-camera-wrap">
  <div class="jc-camera-frame"></div>
</div>
<div class="jc-topic">
  <span class="label">current topic</span>
  <span class="value" id="current-topic">Charlando con el chat</span>
  <span class="subvalue" id="current-topic-sub">Escriban algo en el chat y cambiamos el rumbo.</span>
</div>

<div class="ticker">
  <div class="ticker-bar">
    <div class="ticker-tag" id="ticker-tag">sys.log</div>
    <div class="ticker-window"><div class="ticker-flow" id="ticker-flow"></div></div>
  </div>
</div>

</div>
<script src="../../config/manual/config.js"></script>
<script src="../../config/manual/manual.js"></script>
</body>
</html>
