<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920,height=1080" />
<title>event_panel.html</title>
<link rel="stylesheet" href="../../assets_shared.css" />

</head>
<body>
<div class="module-root">

<div class="left-stack">
  <div class="panel panel-cut">
    <div class="panel-grid"></div>
    <div class="panel-head">
      <div class="tag" id="event-feed-title">Event Feed</div>
      <div class="small" id="event-feed-code">core.sys</div>
    </div>
    <div class="event-list">
      <div class="event"><span class="event-label">latest follow</span><span class="event-value"><span class="hl" id="latest-follow">NeonWolf</span></span></div>
      <div class="event"><span class="event-label">latest sub</span><span class="event-value"><span class="hl" id="latest-sub">StarCipher</span></span></div>
      <div class="event"><span class="event-label">latest donation</span><span class="event-value"><span class="hl" id="latest-donation">$500</span></span></div>
    </div>
  </div>
</div>

</div>
<script src="../../config/streamelements/se.js"></script>
</body>
</html>
