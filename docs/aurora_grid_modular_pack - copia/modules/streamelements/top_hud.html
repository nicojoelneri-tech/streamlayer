<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920,height=1080" />
<title>top_hud.html</title>
<link rel="stylesheet" href="../../assets_shared.css" />

</head>
<body>
<div class="module-root">

<div class="top-hud">
  <div class="top-left">
    <div class="live"><div class="live-dot"></div><div class="live-text" id="live-label">LIVE</div></div>
    <div class="metric"><span class="metric-label">viewers</span><span class="metric-value" id="metric-viewers">247</span></div>
    <div class="metric"><span class="metric-label">uptime</span><span class="metric-value" id="metric-uptime">02:14</span></div>
  </div>
  <div class="top-center">
    <div class="brand">
      <div class="brand-badge"></div>
      <div class="brand-text"><span id="brand-main">Aurora</span> <span id="brand-accent">Grid</span></div>
    </div>
  </div>
  <div class="top-right">
    <div class="metric"><span class="metric-label">subs</span><span class="metric-value" id="metric-subs">89</span></div>
    <div class="metric"><span class="metric-label">support</span><span class="metric-value" id="metric-support">$42</span></div>
  </div>
</div>

</div>
<script src="../../config/streamelements/se.js"></script>
</body>
</html>
