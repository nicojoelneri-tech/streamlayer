<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320, height=480">
<title>Rocket Boost - Camera Frame (Vertical)</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 320px;
    height: 480px;
    overflow: hidden;
    background: transparent;
    font-family: 'Russo One', sans-serif;
  }
  canvas#particles {
    position: absolute;
    top: 0; left: 0;
    width: 320px; height: 480px;
    pointer-events: none;
    z-index: 5;
  }

  /* ---------- FRAME CONTAINER ---------- */
  .frame-wrap {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 264px; height: 400px;
  }

  /* ---------- ANGULAR BORDER WITH SPEED CUTS ---------- */
  .border-main {
    position: absolute;
    inset: 0;
    z-index: 2;
  }
  .border-main svg { width: 100%; height: 100%; }

  /* ---------- CENTER DIVIDER (top border) ---------- */
  .center-divider {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 2px; height: 16px;
    z-index: 4;
    overflow: hidden;
  }
  .center-divider::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 1px; height: 100%;
    background: #ff7b00;
  }
  .center-divider::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 1px; height: 100%;
    background: #0066ff;
  }

  /* ---------- BOOST METER ---------- */
  .boost-bar-wrap {
    position: absolute;
    bottom: -1px; left: 50%;
    transform: translateX(-50%);
    width: 130px; height: 10px;
    z-index: 4;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  }
  .boost-bar-bg {
    position: absolute;
    inset: 0;
    background: #1a1a2e;
    border: 1px solid #ff7b0060;
  }
  .boost-bar-fill {
    position: absolute;
    top: 1px; left: 1px; bottom: 1px;
    width: 60%;
    background: linear-gradient(90deg, #ff7b00, #ffdd00);
    box-shadow: 0 0 6px #ff7b0080;
  }
  .boost-bar-segments {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 11px,
      #1a1a2e 11px,
      #1a1a2e 13px
    );
  }

  /* ---------- BOOST 100 INDICATOR ---------- */
  .boost-indicator {
    position: absolute;
    bottom: 10px; left: 50%;
    transform: translateX(48px);
    font-size: 9px;
    color: #ffdd00;
    letter-spacing: 1px;
    z-index: 4;
    text-shadow: 0 0 4px #ffdd0080;
  }

  /* ---------- SPEED LINES (CSS) ---------- */
  .speed-lines-left, .speed-lines-right {
    position: absolute;
    top: 0;
    width: 30px;
    height: 100%;
    z-index: 3;
    overflow: hidden;
    pointer-events: none;
  }
  .speed-lines-left { left: -2px; }
  .speed-lines-right { right: -2px; }

  .speed-line {
    position: absolute;
    height: 2px;
    border-radius: 1px;
    animation: speed-slide 1.2s linear infinite;
    opacity: 0;
  }
  .speed-lines-left .speed-line {
    right: 0;
    background: #ff7b00;
  }
  .speed-lines-right .speed-line {
    left: 0;
    background: #0066ff;
  }

  .speed-line:nth-child(1) { top: 12%; width: 16px; animation-delay: 0s; }
  .speed-line:nth-child(2) { top: 25%; width: 12px; animation-delay: 0.3s; }
  .speed-line:nth-child(3) { top: 40%; width: 20px; animation-delay: 0.6s; }
  .speed-line:nth-child(4) { top: 55%; width: 14px; animation-delay: 0.15s; }
  .speed-line:nth-child(5) { top: 68%; width: 10px; animation-delay: 0.8s; }
  .speed-line:nth-child(6) { top: 80%; width: 18px; animation-delay: 0.45s; }
  .speed-line:nth-child(7) { top: 90%; width: 11px; animation-delay: 0.9s; }

  @keyframes speed-slide {
    0%   { opacity: 0; transform: translateX(0); }
    10%  { opacity: 0.8; }
    80%  { opacity: 0.6; }
    100% { opacity: 0; transform: translateX(-10px); }
  }
  .speed-lines-right .speed-line {
    animation-name: speed-slide-right;
  }
  @keyframes speed-slide-right {
    0%   { opacity: 0; transform: translateX(0); }
    10%  { opacity: 0.8; }
    80%  { opacity: 0.6; }
    100% { opacity: 0; transform: translateX(10px); }
  }

  /* ---------- IMPACT FLASH ---------- */
  .impact-flash {
    position: absolute;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #ffffff80 30%, transparent 70%);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: none;
  }
  .impact-flash.active {
    animation: flash-pop 0.35s ease-out forwards;
  }
  @keyframes flash-pop {
    0%   { opacity: 1; transform: scale(0.3); }
    50%  { opacity: 0.8; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.3); }
  }

  /* ---------- LABEL ---------- */
  #label {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 4;
    background: linear-gradient(90deg, #ff7b00, #ffdd00, #0066ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="particles" width="320" height="480"></canvas>

<div class="frame-wrap">
  <!-- Angular border with speed-cut corners (top-right, bottom-left) -->
  <div class="border-main">
    <svg viewBox="0 0 264 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Orange left half -->
      <polyline points="132,0 0,0 0,370 30,400 132,400"
        stroke="#ff7b00" stroke-width="2.5" fill="none" stroke-linejoin="miter"/>
      <!-- Blue right half -->
      <polyline points="132,0 234,0 264,30 264,400 132,400"
        stroke="#0066ff" stroke-width="2.5" fill="none" stroke-linejoin="miter"/>
      <!-- Inner glow lines -->
      <polyline points="132,3 3,3 3,368 31,397 132,397"
        stroke="#ff7b0025" stroke-width="1" fill="none" stroke-linejoin="miter"/>
      <polyline points="132,3 232,3 262,33 262,397 132,397"
        stroke="#0066ff25" stroke-width="1" fill="none" stroke-linejoin="miter"/>
    </svg>
  </div>

  <!-- Center divider at top -->
  <div class="center-divider"></div>

  <!-- Speed lines left (orange) -->
  <div class="speed-lines-left">
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
  </div>

  <!-- Speed lines right (blue) -->
  <div class="speed-lines-right">
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
  </div>

  <!-- Boost meter bar -->
  <div class="boost-bar-wrap">
    <div class="boost-bar-bg"></div>
    <div class="boost-bar-fill"></div>
    <div class="boost-bar-segments"></div>
  </div>

  <!-- Boost 100 indicator -->
  <div class="boost-indicator">100</div>

  <!-- Impact flash element -->
  <div class="impact-flash" id="impactFlash"></div>
</div>

<!-- Label below frame -->
<div id="label"></div>

<script>
const LABEL_TEXT = 'ROCKET BOOST';

/* ---- Label ---- */
document.getElementById('label').textContent = LABEL_TEXT;

/* ---- Canvas particles: boost sparks from bottom corners ---- */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
const W = 320, H = 480;
const frameL = (W - 264) / 2;
const frameR = frameL + 264;
const frameT = (H - 400) / 2;
const frameB = frameT + 400;
const centerL = frameL + 45;
const centerR = frameR - 45;
const centerT = frameT + 45;
const centerB = frameB - 45;

const sparks = [];
const MAX_SPARKS = 45;

function spawnSpark() {
  const side = Math.random() < 0.5 ? 'left' : 'right';
  const baseX = side === 'left' ? frameL + Math.random() * 25 : frameR - Math.random() * 25;
  const baseY = frameB - Math.random() * 10;
  const color = side === 'left'
    ? (Math.random() < 0.7 ? '#ff7b00' : '#ffdd00')
    : (Math.random() < 0.7 ? '#0066ff' : '#ffffff');
  sparks.push({
    x: baseX, y: baseY,
    vx: (side === 'left' ? 1 : -1) * (Math.random() * 0.3 + 0.1),
    vy: -(Math.random() * 1.8 + 1.0),
    life: 1,
    decay: Math.random() * 0.01 + 0.006,
    size: Math.random() * 2.5 + 1,
    color: color
  });
}

function animate() {
  ctx.clearRect(0, 0, W, H);

  if (sparks.length < MAX_SPARKS && Math.random() < 0.4) {
    spawnSpark();
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy *= 0.99;
    s.life -= s.decay;

    if (s.life <= 0) {
      sparks.splice(i, 1);
      continue;
    }

    /* Keep particles out of center webcam area */
    if (s.x > centerL && s.x < centerR && s.y > centerT && s.y < centerB) {
      sparks.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = s.life;
    ctx.fillStyle = s.color;
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  requestAnimationFrame(animate);
}
animate();

/* ---- Impact Flash ---- */
const flash = document.getElementById('impactFlash');
const corners = [
  { top: '-10px', left: '-10px' },
  { top: '-10px', right: '-10px' },
  { bottom: '-10px', left: '-10px' },
  { bottom: '-10px', right: '-10px' }
];

function triggerFlash() {
  const c = corners[Math.floor(Math.random() * corners.length)];
  flash.style.top = ''; flash.style.bottom = ''; flash.style.left = ''; flash.style.right = '';
  Object.assign(flash.style, c);
  flash.classList.remove('active');
  void flash.offsetWidth;
  flash.classList.add('active');
  setTimeout(() => {
    flash.classList.remove('active');
  }, 400);
  setTimeout(triggerFlash, 7000 + Math.random() * 2000);
}
setTimeout(triggerFlash, 4000);
</script>
</body>
</html>
