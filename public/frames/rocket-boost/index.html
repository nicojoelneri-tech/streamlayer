<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=420, height=320">
<title>Rocket Boost - Camera Frame</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 420px;
    height: 320px;
    overflow: hidden;
    background: transparent;
    font-family: 'Russo One', sans-serif;
  }
  canvas#particles {
    position: absolute;
    top: 0; left: 0;
    width: 420px; height: 320px;
    pointer-events: none;
    z-index: 5;
  }

  /* ---------- FRAME CONTAINER ---------- */
  .frame-wrap {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 384px; height: 260px;
  }

  /* ---------- ANGULAR BORDER WITH SPEED CUTS ---------- */
  .border-main {
    position: absolute;
    inset: 0;
    z-index: 2;
  }
  .border-main svg { width: 100%; height: 100%; }

  /* ---------- CENTER DIVIDER (top border) ---------- */
  .center-divider {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 2px; height: 14px;
    z-index: 4;
    overflow: hidden;
  }
  .center-divider::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 1px; height: 100%;
    background: #ff7b00;
  }
  .center-divider::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 1px; height: 100%;
    background: #0066ff;
  }

  /* ---------- BOOST METER ---------- */
  .boost-bar-wrap {
    position: absolute;
    bottom: -1px; left: 50%;
    transform: translateX(-50%);
    width: 160px; height: 10px;
    z-index: 4;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  }
  .boost-bar-bg {
    position: absolute;
    inset: 0;
    background: #1a1a2e;
    border: 1px solid #ff7b0060;
  }
  .boost-bar-fill {
    position: absolute;
    top: 1px; left: 1px; bottom: 1px;
    width: 60%;
    background: linear-gradient(90deg, #ff7b00, #ffdd00);
    box-shadow: 0 0 6px #ff7b0080;
  }
  /* segments */
  .boost-bar-segments {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 14px,
      #1a1a2e 14px,
      #1a1a2e 16px
    );
  }

  /* ---------- BOOST 100 INDICATOR ---------- */
  .boost-indicator {
    position: absolute;
    bottom: 10px; left: 50%;
    transform: translateX(60px);
    font-size: 9px;
    color: #ffdd00;
    letter-spacing: 1px;
    z-index: 4;
    text-shadow: 0 0 4px #ffdd0080;
  }

  /* ---------- SPEED LINES (CSS) ---------- */
  .speed-lines-left, .speed-lines-right {
    position: absolute;
    top: 0;
    width: 30px;
    height: 100%;
    z-index: 3;
    overflow: hidden;
    pointer-events: none;
  }
  .speed-lines-left { left: -2px; }
  .speed-lines-right { right: -2px; }

  .speed-line {
    position: absolute;
    height: 2px;
    border-radius: 1px;
    animation: speed-slide 1.2s linear infinite;
    opacity: 0;
  }
  .speed-lines-left .speed-line {
    right: 0;
    background: #ff7b00;
  }
  .speed-lines-right .speed-line {
    left: 0;
    background: #0066ff;
  }

  .speed-line:nth-child(1) { top: 18%; width: 16px; animation-delay: 0s; }
  .speed-line:nth-child(2) { top: 35%; width: 12px; animation-delay: 0.3s; }
  .speed-line:nth-child(3) { top: 52%; width: 20px; animation-delay: 0.6s; }
  .speed-line:nth-child(4) { top: 70%; width: 14px; animation-delay: 0.15s; }
  .speed-line:nth-child(5) { top: 85%; width: 10px; animation-delay: 0.8s; }

  @keyframes speed-slide {
    0%   { opacity: 0; transform: translateX(0); }
    10%  { opacity: 0.8; }
    80%  { opacity: 0.6; }
    100% { opacity: 0; transform: translateX(-10px); }
  }
  .speed-lines-right .speed-line {
    animation-name: speed-slide-right;
  }
  @keyframes speed-slide-right {
    0%   { opacity: 0; transform: translateX(0); }
    10%  { opacity: 0.8; }
    80%  { opacity: 0.6; }
    100% { opacity: 0; transform: translateX(10px); }
  }

  /* ---------- IMPACT FLASH ---------- */
  .impact-flash {
    position: absolute;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #ffffff80 30%, transparent 70%);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: none;
  }
  .impact-flash.active {
    animation: flash-pop 0.35s ease-out forwards;
  }
  @keyframes flash-pop {
    0%   { opacity: 1; transform: scale(0.3); }
    50%  { opacity: 0.8; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.3); }
  }

  /* ---------- LABEL ---------- */
  #label {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 4;
    background: linear-gradient(90deg, #ff7b00, #ffdd00, #0066ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="particles" width="420" height="320"></canvas>

<div class="frame-wrap">
  <!-- Angular border with speed-cut corners (top-right, bottom-left) -->
  <div class="border-main">
    <svg viewBox="0 0 384 260" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- ── Main border ── -->
      <polyline points="192,0 0,0 0,230 30,260 192,260"
        stroke="#ff7b00" stroke-width="3" fill="none" stroke-linejoin="miter"/>
      <polyline points="192,0 354,0 384,30 384,260 192,260"
        stroke="#0066ff" stroke-width="3" fill="none" stroke-linejoin="miter"/>

      <!-- ── Inner parallel line (double border) ── -->
      <polyline points="192,5 5,5 5,228 32,257 192,257"
        stroke="#ff7b00" stroke-width="1.5" fill="none" stroke-linejoin="miter" opacity="0.55"/>
      <polyline points="192,5 350,5 381,34 381,257 192,257"
        stroke="#0066ff" stroke-width="1.5" fill="none" stroke-linejoin="miter" opacity="0.55"/>

      <!-- ── Dashed third line ── -->
      <polyline points="192,10 10,10 10,226 33,254 192,254"
        stroke="#ff7b00" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.22" stroke-dasharray="10,7"/>
      <polyline points="192,10 347,10 379,37 379,254 192,254"
        stroke="#0066ff" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.22" stroke-dasharray="10,7"/>

      <!-- ── Top edge ticks – orange side ── -->
      <line x1="38"  y1="0" x2="38"  y2="8" stroke="#ff7b00" stroke-width="1.5" opacity="0.75"/>
      <line x1="78"  y1="0" x2="78"  y2="5" stroke="#ff7b00" stroke-width="1"   opacity="0.45"/>
      <line x1="118" y1="0" x2="118" y2="8" stroke="#ff7b00" stroke-width="1.5" opacity="0.75"/>
      <line x1="158" y1="0" x2="158" y2="5" stroke="#ff7b00" stroke-width="1"   opacity="0.45"/>

      <!-- ── Top edge ticks – blue side ── -->
      <line x1="226" y1="0" x2="226" y2="5" stroke="#0066ff" stroke-width="1"   opacity="0.45"/>
      <line x1="266" y1="0" x2="266" y2="8" stroke="#0066ff" stroke-width="1.5" opacity="0.75"/>
      <line x1="306" y1="0" x2="306" y2="5" stroke="#0066ff" stroke-width="1"   opacity="0.45"/>
      <line x1="346" y1="0" x2="346" y2="8" stroke="#0066ff" stroke-width="1.5" opacity="0.75"/>

      <!-- ── Left edge ticks ── -->
      <line x1="0" y1="46"  x2="8" y2="46"  stroke="#ff7b00" stroke-width="1.5" opacity="0.75"/>
      <line x1="0" y1="92"  x2="5" y2="92"  stroke="#ff7b00" stroke-width="1"   opacity="0.45"/>
      <line x1="0" y1="138" x2="8" y2="138" stroke="#ff7b00" stroke-width="1.5" opacity="0.75"/>
      <line x1="0" y1="184" x2="5" y2="184" stroke="#ff7b00" stroke-width="1"   opacity="0.45"/>

      <!-- ── Right edge ticks ── -->
      <line x1="376" y1="60"  x2="384" y2="60"  stroke="#0066ff" stroke-width="1.5" opacity="0.75"/>
      <line x1="379" y1="110" x2="384" y2="110" stroke="#0066ff" stroke-width="1"   opacity="0.45"/>
      <line x1="376" y1="160" x2="384" y2="160" stroke="#0066ff" stroke-width="1.5" opacity="0.75"/>
      <line x1="379" y1="210" x2="384" y2="210" stroke="#0066ff" stroke-width="1"   opacity="0.45"/>

      <!-- ── Bottom edge ticks – orange side ── -->
      <line x1="50"  y1="252" x2="50"  y2="260" stroke="#ff7b00" stroke-width="1.5" opacity="0.75"/>
      <line x1="92"  y1="255" x2="92"  y2="260" stroke="#ff7b00" stroke-width="1"   opacity="0.45"/>
      <line x1="134" y1="252" x2="134" y2="260" stroke="#ff7b00" stroke-width="1.5" opacity="0.75"/>
      <line x1="170" y1="255" x2="170" y2="260" stroke="#ff7b00" stroke-width="1"   opacity="0.45"/>

      <!-- ── Bottom edge ticks – blue side ── -->
      <line x1="214" y1="255" x2="214" y2="260" stroke="#0066ff" stroke-width="1"   opacity="0.45"/>
      <line x1="252" y1="252" x2="252" y2="260" stroke="#0066ff" stroke-width="1.5" opacity="0.75"/>
      <line x1="294" y1="255" x2="294" y2="260" stroke="#0066ff" stroke-width="1"   opacity="0.45"/>
      <line x1="334" y1="252" x2="334" y2="260" stroke="#0066ff" stroke-width="1.5" opacity="0.75"/>

      <!-- ── Corner L-brackets (inset) ── -->
      <!-- Top-left -->
      <path d="M 3,24 L 3,3 L 24,3" stroke="#ff7b00" stroke-width="1.5" fill="none" opacity="0.85"/>
      <!-- Bottom-right -->
      <path d="M 381,236 L 381,257 L 360,257" stroke="#0066ff" stroke-width="1.5" fill="none" opacity="0.85"/>

      <!-- ── Center accent marks (top & bottom split) ── -->
      <line x1="188" y1="0" x2="188" y2="10" stroke="#ff7b00" stroke-width="2"   opacity="0.95"/>
      <line x1="196" y1="0" x2="196" y2="10" stroke="#0066ff" stroke-width="2"   opacity="0.95"/>
      <line x1="188" y1="250" x2="188" y2="260" stroke="#ff7b00" stroke-width="2"   opacity="0.95"/>
      <line x1="196" y1="250" x2="196" y2="260" stroke="#0066ff" stroke-width="2"   opacity="0.95"/>

      <!-- ── Cut corner hash marks ── -->
      <!-- Bottom-left cut -->
      <line x1="7"   y1="237" x2="18"  y2="250" stroke="#ff7b00" stroke-width="1.5" opacity="0.65"/>
      <line x1="13"  y1="233" x2="24"  y2="246" stroke="#ff7b00" stroke-width="0.8" opacity="0.35"/>
      <!-- Top-right cut -->
      <line x1="363" y1="9"   x2="376" y2="21"  stroke="#0066ff" stroke-width="1.5" opacity="0.65"/>
      <line x1="356" y1="14"  x2="369" y2="26"  stroke="#0066ff" stroke-width="0.8" opacity="0.35"/>

      <!-- ── Corner anchor dots ── -->
      <circle cx="3"   cy="3"   r="2.5" fill="#ff7b00" opacity="0.9"/>
      <circle cx="381" cy="257" r="2.5" fill="#0066ff" opacity="0.9"/>
      <circle cx="192" cy="2"   r="2"   fill="#ffffff"  opacity="0.65"/>
      <circle cx="192" cy="258" r="2"   fill="#ffffff"  opacity="0.65"/>
    </svg>
  </div>

  <!-- Center divider at top -->
  <div class="center-divider"></div>

  <!-- Speed lines left (orange) -->
  <div class="speed-lines-left">
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
  </div>

  <!-- Speed lines right (blue) -->
  <div class="speed-lines-right">
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>
  </div>

  <!-- Boost meter bar -->
  <div class="boost-bar-wrap">
    <div class="boost-bar-bg"></div>
    <div class="boost-bar-fill"></div>
    <div class="boost-bar-segments"></div>
  </div>

  <!-- Boost 100 indicator -->
  <div class="boost-indicator">100</div>

  <!-- Impact flash element -->
  <div class="impact-flash" id="impactFlash"></div>
</div>

<!-- Label below frame -->
<div id="label"></div>

<script>
const LABEL_TEXT = 'ROCKET BOOST';

/* ---- Label ---- */
document.getElementById('label').textContent = LABEL_TEXT;

/* ---- Canvas particles: boost sparks from bottom corners ---- */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
const W = 420, H = 320;
const frameL = (W - 384) / 2;
const frameR = frameL + 384;
const frameT = (H - 260) / 2;
const frameB = frameT + 260;
const centerL = frameL + 50;
const centerR = frameR - 50;
const centerT = frameT + 40;
const centerB = frameB - 40;

const sparks = [];
const MAX_SPARKS = 40;

function spawnSpark() {
  const side = Math.random() < 0.5 ? 'left' : 'right';
  const baseX = side === 'left' ? frameL + Math.random() * 30 : frameR - Math.random() * 30;
  const baseY = frameB - Math.random() * 10;
  const color = side === 'left'
    ? (Math.random() < 0.7 ? '#ff7b00' : '#ffdd00')
    : (Math.random() < 0.7 ? '#0066ff' : '#ffffff');
  sparks.push({
    x: baseX, y: baseY,
    vx: (side === 'left' ? 1 : -1) * (Math.random() * 0.3 + 0.1),
    vy: -(Math.random() * 1.5 + 0.8),
    life: 1,
    decay: Math.random() * 0.012 + 0.008,
    size: Math.random() * 2.5 + 1,
    color: color
  });
}

function animate() {
  ctx.clearRect(0, 0, W, H);

  if (sparks.length < MAX_SPARKS && Math.random() < 0.4) {
    spawnSpark();
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy *= 0.99;
    s.life -= s.decay;

    if (s.life <= 0 || s.x < centerL && s.x > frameL + 30 && s.y > centerT && s.y < centerB) {
      sparks.splice(i, 1);
      continue;
    }

    /* Keep particles out of center webcam area */
    if (s.x > centerL && s.x < centerR && s.y > centerT && s.y < centerB) {
      sparks.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = s.life;
    ctx.fillStyle = s.color;
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  requestAnimationFrame(animate);
}
animate();

/* ---- Impact Flash ---- */
const flash = document.getElementById('impactFlash');
const corners = [
  { top: '-10px', left: '-10px' },
  { top: '-10px', right: '-10px' },
  { bottom: '-10px', left: '-10px' },
  { bottom: '-10px', right: '-10px' }
];

function triggerFlash() {
  const c = corners[Math.floor(Math.random() * corners.length)];
  flash.style.top = ''; flash.style.bottom = ''; flash.style.left = ''; flash.style.right = '';
  Object.assign(flash.style, c);
  flash.classList.remove('active');
  void flash.offsetWidth;
  flash.classList.add('active');
  setTimeout(() => {
    flash.classList.remove('active');
  }, 400);
  setTimeout(triggerFlash, 7000 + Math.random() * 2000);
}
setTimeout(triggerFlash, 4000);
</script>
</body>
</html>
