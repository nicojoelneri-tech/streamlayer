<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=440,height=340">
<title>Pixelcraft — Camera Frame</title>
<style>
  /* ═══════════════════════════════════════════
     PIXELCRAFT — Minecraft-style Camera Frame
     Browser Source: 440 × 340, transparent bg
     Webcam goes ABOVE this source in OBS
  ═══════════════════════════════════════════ */

  @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:440px;height:340px;background:transparent;overflow:hidden;image-rendering:pixelated}

  .frame-wrap{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:400px;height:280px;
  }

  /* ── Dirt/stone border (thick, chunky, pixel feel) ── */
  .border-base{
    position:absolute;inset:0;
    border:12px solid;
    border-image:repeating-linear-gradient(
      90deg,
      #6b5b3a 0px,#7a6842 4px,#5c4e32 4px,#6b5b3a 8px
    ) 12;
    image-rendering:pixelated;
  }

  /* Top grass layer on border */
  .grass-top{
    position:absolute;
    top:-4px;left:-4px;right:-4px;
    height:16px;
    background:repeating-linear-gradient(
      90deg,
      #4a8c2a 0px,#5a9e32 4px,#3d7a22 4px,#4a8c2a 8px,#5a9e32 8px,#3d7a22 12px,#4a8c2a 12px,#5a9e32 16px
    );
    image-rendering:pixelated;
    border-bottom:4px solid #3a6a1e;
  }
  /* Grass tufts (pixel blocks on top) */
  .grass-top::before{
    content:'';position:absolute;
    top:-4px;left:20px;
    width:100%;height:4px;
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0px,transparent 12px,
        #4a8c2a 12px,#4a8c2a 16px,
        transparent 16px,transparent 28px,
        #3d7a22 28px,#3d7a22 32px,
        transparent 32px,transparent 48px,
        #5a9e32 48px,#5a9e32 52px,
        transparent 52px,transparent 64px
      );
    image-rendering:pixelated;
  }

  /* Stone inner trim */
  .stone-trim{
    position:absolute;inset:12px;
    border:4px solid;
    border-image:repeating-linear-gradient(
      90deg,
      #888 0px,#999 4px,#777 4px,#888 8px
    ) 4;
    image-rendering:pixelated;
  }

  /* ── Pixel corner blocks (3D cube look) ── */
  .corner-block{
    position:absolute;width:16px;height:16px;
    image-rendering:pixelated;
  }
  .corner-block::before{
    content:'';position:absolute;inset:0;
    background:
      linear-gradient(135deg,#5a9e32 25%,#4a8c2a 25%,#4a8c2a 50%,#3d7a22 50%,#3d7a22 75%,#2d6a18 75%);
    border:1px solid #2a5a15;
  }
  .corner-block::after{
    content:'';position:absolute;
    top:2px;left:2px;width:4px;height:4px;
    background:rgba(255,255,255,.15);
  }
  .cb-tl{top:-4px;left:-4px}
  .cb-tr{top:-4px;right:-4px}
  .cb-bl{bottom:-4px;left:-4px}
  .cb-br{bottom:-4px;right:-4px}

  /* ── Ore blocks on border (diamond, gold, redstone accents) ── */
  .ore{
    position:absolute;width:8px;height:8px;
    image-rendering:pixelated;
    animation:oreGlow 3s ease-in-out infinite;
  }
  .ore-diamond{background:#44e8d4;box-shadow:0 0 4px rgba(68,232,212,.5)}
  .ore-gold{background:#ffd700;box-shadow:0 0 4px rgba(255,215,0,.5)}
  .ore-redstone{background:#cc2020;box-shadow:0 0 4px rgba(204,32,32,.5)}
  .ore-emerald{background:#30d050;box-shadow:0 0 4px rgba(48,208,80,.5)}

  .o1{top:2px;left:60px}.o2{top:2px;right:100px}
  .o3{bottom:2px;left:120px}.o4{bottom:2px;right:60px}
  .o5{top:40px;left:2px}.o6{bottom:50px;left:2px}
  .o7{top:60px;right:2px}.o8{bottom:30px;right:2px}

  @keyframes oreGlow{
    0%,100%{opacity:.7;transform:scale(1)}
    50%{opacity:1;transform:scale(1.1)}
  }

  /* ── TNT blocks on sides ── */
  .tnt{
    position:absolute;width:20px;height:20px;
    image-rendering:pixelated;pointer-events:none;
  }
  .tnt-left{left:-18px;top:50%;transform:translateY(-50%)}
  .tnt-right{right:-18px;top:50%;transform:translateY(-50%)}

  .tnt-body{
    width:20px;height:20px;
    background:#cc3030;
    border:2px solid #992020;
    position:relative;
  }
  /* TNT label stripe */
  .tnt-body::before{
    content:'TNT';
    position:absolute;top:4px;left:1px;right:1px;
    height:10px;line-height:10px;text-align:center;
    background:#e8e8d0;
    font-family:'Silkscreen',monospace;font-size:6px;font-weight:700;
    color:#cc3030;letter-spacing:0;
    border-top:1px solid #bbb;border-bottom:1px solid #bbb;
  }
  /* Top darker band */
  .tnt-body::after{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:#aa2828;
  }

  /* Fuse (wick) */
  .tnt-fuse{
    width:2px;height:10px;
    margin:0 auto;
    background:linear-gradient(180deg,#333,#555);
    position:relative;
    top:-10px;
  }
  /* Fuse spark */
  .tnt-fuse::after{
    content:'';position:absolute;
    top:-3px;left:-2px;width:6px;height:5px;
    background:radial-gradient(circle,#ffe680,#ffaa00,transparent 70%);
    border-radius:50%;
    animation:fuseFlicker 0.3s step-end infinite;
    box-shadow:0 0 4px rgba(255,170,0,.6),0 0 8px rgba(255,100,0,.3);
  }
  @keyframes fuseFlicker{
    0%{opacity:1;transform:scale(1)}
    33%{opacity:.7;transform:scale(.8)}
    66%{opacity:1;transform:scale(1.1)}
  }

  /* ── Creeper face hint (very subtle in border) ── */
  .creeper-face{
    position:absolute;
    top:50%;right:2px;transform:translateY(-50%);
    width:8px;height:8px;
    opacity:.12;
    image-rendering:pixelated;
  }
  .cf-eye1,.cf-eye2{position:absolute;width:2px;height:2px;background:#000}
  .cf-eye1{top:1px;left:1px}.cf-eye2{top:1px;right:1px}
  .cf-mouth{position:absolute;width:4px;height:3px;left:2px;top:4px;
    background:#000;border-bottom:1px solid #000;}

  /* ── XP bar (bottom) ── */
  .xp-bar{
    position:absolute;
    bottom:-10px;left:20px;right:20px;height:6px;
    background:#222;
    border:2px solid #111;
    image-rendering:pixelated;
  }
  .xp-fill{
    position:absolute;top:0;left:0;bottom:0;
    width:72%;
    background:linear-gradient(90deg,#80e840,#60c030);
    box-shadow:inset 0 -1px 0 rgba(0,0,0,.2);
    animation:xpPulse 5s ease-in-out infinite;
  }
  @keyframes xpPulse{0%,100%{width:72%}50%{width:78%}}
  .xp-segments{
    position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent,transparent 7px,rgba(0,0,0,.3) 7px,rgba(0,0,0,.3) 8px);
  }

  /* ── Hearts row (inside frame, below top border) ── */
  .hearts{
    position:absolute;
    top:18px;left:18px;
    display:flex;gap:2px;
    z-index:1;
  }
  .heart{
    width:9px;height:8px;
    position:relative;
    image-rendering:pixelated;
  }
  .heart::before,.heart::after{
    content:'';position:absolute;
    background:#cc2020;
  }
  .heart::before{
    width:9px;height:5px;top:2px;left:0;
    clip-path:polygon(0 0,3px 0,4px 2px,5px 0,9px 0,9px 5px,4px 8px,0 5px);
    background:#dd3030;
  }
  .heart::after{
    width:4px;height:2px;top:2px;left:1px;
    background:rgba(255,100,100,.4);
  }
  .heart.empty::before{background:#444}
  .heart.empty::after{display:none}

  /* ── Particle canvas ── */
  #particleCanvas{
    position:absolute;inset:-20px;
    width:calc(100% + 40px);height:calc(100% + 40px);
    pointer-events:none;
  }

  /* ── Label ── */
  .craft-label{
    position:absolute;
    bottom:-26px;left:50%;transform:translateX(-50%);
    font-family:'Silkscreen',monospace;
    font-size:9px;
    letter-spacing:2px;
    color:rgba(255,255,255,.6);
    text-shadow:2px 2px 0 rgba(0,0,0,.7);
    white-space:nowrap;
  }

</style>
</head>
<body>

<div class="frame-wrap">

  <!-- Particle canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Dirt border -->
  <div class="border-base"></div>

  <!-- Grass layer on top -->
  <div class="grass-top"></div>

  <!-- Stone inner trim -->
  <div class="stone-trim"></div>

  <!-- Corner blocks -->
  <div class="corner-block cb-tl"></div><div class="corner-block cb-tr"></div>
  <div class="corner-block cb-bl"></div><div class="corner-block cb-br"></div>

  <!-- Ore accents -->
  <div class="ore ore-diamond o1"></div><div class="ore ore-gold o2"></div>
  <div class="ore ore-redstone o3"></div><div class="ore ore-emerald o4"></div>
  <div class="ore ore-diamond o5"></div><div class="ore ore-gold o6"></div>
  <div class="ore ore-emerald o7"></div><div class="ore ore-redstone o8"></div>

  <!-- TNT blocks -->
  <div class="tnt tnt-left">
    <div class="tnt-fuse"></div>
    <div class="tnt-body"></div>
  </div>
  <div class="tnt tnt-right">
    <div class="tnt-fuse"></div>
    <div class="tnt-body"></div>
  </div>

  <!-- Creeper face easter egg -->
  <div class="creeper-face">
    <div class="cf-eye1"></div><div class="cf-eye2"></div>
    <div class="cf-mouth"></div>
  </div>

  <!-- Hearts -->
  <div class="hearts">
    <div class="heart"></div><div class="heart"></div><div class="heart"></div>
    <div class="heart"></div><div class="heart"></div><div class="heart"></div>
    <div class="heart"></div><div class="heart"></div>
    <div class="heart empty"></div><div class="heart empty"></div>
  </div>

  <!-- XP bar -->
  <div class="xp-bar">
    <div class="xp-fill"></div>
    <div class="xp-segments"></div>
  </div>

  <!-- Label -->
  <div class="craft-label" id="label"></div>

</div>

<script>
// ═══════════════ CONFIGURACION ═══════════════
// Edita este texto para personalizar el label del marco:
const LABEL_TEXT = 'PIXELCRAFT';
// ═════════════════════════════════════════════
document.getElementById('label').textContent = LABEL_TEXT;

// ═════════════════════════════════════════
//  PARTICLES — Floating green XP orbs + ember sparks
// ═════════════════════════════════════════

const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
const frameW = 400, frameH = 280;
canvas.width = frameW + 40; canvas.height = frameH + 40;
const ox = 20, oy = 20;

class XPOrb {
  constructor() { this.reset(true); }
  reset(init) {
    // Spawn near torches (left or right side)
    const left = Math.random() < 0.5;
    this.x = left ? ox - 8 + Math.random() * 20 : ox + frameW - 12 + Math.random() * 20;
    this.y = init ? oy + frameH * 0.3 + Math.random() * frameH * 0.4 : oy + frameH * 0.4 + Math.random() * frameH * 0.3;
    this.vy = -0.3 - Math.random() * 0.6;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.size = 1.5 + Math.random() * 2;
    this.life = 80 + Math.random() * 100;
    this.maxLife = this.life;
    this.wobble = Math.random() * Math.PI * 2;
    // Mostly green, some yellow
    this.isGold = Math.random() < 0.25;
  }
  update() {
    this.wobble += 0.04;
    this.x += this.vx + Math.sin(this.wobble) * 0.2;
    this.y += this.vy;
    this.life--;
    if (this.life <= 0) this.reset(false);
  }
  draw(ctx) {
    const a = (this.life / this.maxLife) * 0.7;
    const s = this.size * (0.8 + 0.2 * Math.sin(this.wobble * 2));
    if (this.isGold) {
      ctx.fillStyle = `rgba(255,215,0,${a})`;
      ctx.shadowColor = `rgba(255,215,0,${a * 0.5})`;
    } else {
      ctx.fillStyle = `rgba(100,230,50,${a})`;
      ctx.shadowColor = `rgba(100,230,50,${a * 0.5})`;
    }
    ctx.shadowBlur = 5;
    // Square-ish orb (pixel feel)
    ctx.fillRect(this.x - s/2, this.y - s/2, s, s);
    ctx.shadowBlur = 0;
  }
}

class FuseSpark {
  constructor(tx, ty) { this.tx = tx; this.ty = ty; this.reset(); }
  reset() {
    this.x = this.tx + (Math.random() - 0.5) * 6;
    this.y = this.ty;
    this.vy = -0.5 - Math.random() * 1.2;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.life = 12 + Math.random() * 18;
    this.maxLife = this.life;
    this.size = 1 + Math.random();
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.life--;
    if (this.life <= 0) this.reset();
  }
  draw(ctx) {
    const t = this.life / this.maxLife;
    const a = t * 0.8;
    ctx.fillStyle = t > 0.5 ? `rgba(255,230,130,${a})` : `rgba(255,140,30,${a})`;
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

const orbs = Array.from({ length: 12 }, () => new XPOrb());
const sparksL = Array.from({ length: 6 }, () => new FuseSpark(ox - 8, oy + frameH / 2 - 22));
const sparksR = Array.from({ length: 6 }, () => new FuseSpark(ox + frameW + 8, oy + frameH / 2 - 22));

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  orbs.forEach(o => { o.update(); o.draw(ctx); });
  sparksL.forEach(s => { s.update(); s.draw(ctx); });
  sparksR.forEach(s => { s.update(); s.draw(ctx); });
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
