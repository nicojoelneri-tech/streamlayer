<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=420,height=320">
<title>Carbon Racer — Camera Frame</title>
<style>
  /* ═══════════════════════════════════════════
     CARBON RACER — F1 / Racing Camera Frame
     Browser Source: 420 × 320, transparent bg
     Webcam goes ABOVE this source in OBS
  ═══════════════════════════════════════════ */

  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:420px;height:320px;background:transparent;overflow:hidden}

  .frame-wrap{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:384px;height:260px;
  }

  /* ── Carbon fiber border ── */
  .border-main{
    position:absolute;inset:0;
    border:4px solid #1a1a1a;
    background:
      repeating-linear-gradient(
        45deg,
        rgba(40,40,40,.9) 0px,
        rgba(30,30,30,.9) 2px,
        rgba(50,50,50,.9) 2px,
        rgba(35,35,35,.9) 4px
      );
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    padding:0;
  }
  /* We use a pseudo-element approach for the carbon border */
  .carbon-border{
    position:absolute;inset:0;
    border:4px solid transparent;
    pointer-events:none;
  }
  .carbon-border::before{
    content:'';
    position:absolute;inset:-4px;
    background:
      repeating-linear-gradient(
        45deg,
        #1a1a1a 0px,
        #252525 1px,
        #1a1a1a 2px,
        #2a2a2a 3px,
        #1a1a1a 4px
      );
    -webkit-mask:
      linear-gradient(#000 0 0) center/calc(100% - 8px) calc(100% - 8px) no-repeat,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }
  .carbon-border::after{
    content:'';
    position:absolute;inset:-1px;
    border:1px solid rgba(168,168,168,.25);
    pointer-events:none;
  }

  /* ── Inner metallic trim ── */
  .inner-trim{
    position:absolute;inset:4px;
    border:1px solid rgba(168,168,168,.15);
    pointer-events:none;
  }

  /* ── Checkered flag corner (top-right) ── */
  .checkered{
    position:absolute;
    top:-2px;right:-2px;
    width:32px;height:24px;
    overflow:hidden;
    pointer-events:none;
  }
  .checkered-inner{
    width:100%;height:100%;
    background:
      repeating-conic-gradient(
        #000 0% 25%, #fff 25% 50%
      ) 0 0/8px 8px;
    opacity:.85;
  }

  /* ── F1 Starting Lights ── */
  .f1-lights{
    position:absolute;
    top:-8px; left:50%;
    transform:translateX(-50%);
    display:flex;gap:5px;
    align-items:center;
    z-index:5;
    pointer-events:none;
    background:rgba(0,0,0,.75);
    padding:3px 8px;
    border:1px solid #333;
    border-radius:3px;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  /* small gantry arm top line */
  .f1-lights::before{
    content:'';
    position:absolute;
    top:-4px; left:10px; right:10px;
    height:2px;
    background:linear-gradient(90deg,transparent,#444,transparent);
  }
  .f1-light{
    width:12px; height:12px;
    border-radius:50%;
    background:#111;
    border:1.5px solid #2a2a2a;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.9);
  }
  .f1-light.on{
    background:radial-gradient(circle at 35% 35%, #ff5555, #cc0000);
    border-color:#7a0000;
    box-shadow:0 0 7px #cc0000, 0 0 16px rgba(204,0,0,.45), inset 0 1px 2px rgba(255,130,130,.35);
  }

  /* ── Speed text (bottom border) ── */
  .speed-text{
    position:absolute;
    bottom:2px;right:10px;
    font-family:'Courier New',monospace;
    font-size:8px;
    letter-spacing:2px;
    color:rgba(168,168,168,.35);
    pointer-events:none;
  }

  /* ── DRS Panel (F1-game style) ── */
  .drs-panel{
    position:absolute;
    top:5px; right:8px;
    display:flex;
    align-items:center;
    gap:4px;
    pointer-events:none;
    z-index:5;
  }
  .drs-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:#1a1a1a;
    border:1px solid #333;
    flex-shrink:0;
    transition:background .2s, box-shadow .2s;
  }
  .drs-box{
    background:linear-gradient(160deg,#1c1c1c,#111);
    border:1px solid #333;
    clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);
    padding:2px 10px 2px 8px;
  }
  .drs-label{
    font-family:'Chakra Petch',sans-serif;
    font-size:9px; font-weight:700;
    letter-spacing:2px;
    color:rgba(80,80,80,.45);
    transition:color .2s, text-shadow .2s;
    white-space:nowrap;
  }
  /* AVAILABLE state */
  .drs-panel.available .drs-dot{
    background:#eab308;
    box-shadow:0 0 5px rgba(234,179,8,.9);
  }
  .drs-panel.available .drs-label{
    color:#eab308;
    text-shadow:0 0 6px rgba(234,179,8,.7);
  }
  /* ACTIVE state */
  .drs-panel.active .drs-dot{
    background:#22c55e;
    box-shadow:0 0 8px rgba(34,197,94,1), 0 0 16px rgba(34,197,94,.4);
  }
  .drs-panel.active .drs-label{
    color:#22c55e;
    text-shadow:0 0 8px rgba(34,197,94,.9), 0 0 16px rgba(34,197,94,.4);
  }

  /* ── Metallic highlight line (top) ── */
  .metal-line-top{
    position:absolute;
    top:0;left:40px;right:34px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(168,168,168,.3),transparent);
    pointer-events:none;
  }

  /* ── Bottom red glow line ── */
  .red-line-bottom{
    position:absolute;
    bottom:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent 5%,#dc2626 30%,#dc2626 70%,transparent 95%);
    opacity:.4;
    animation:redPulse 3s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes redPulse{0%,100%{opacity:.25}50%{opacity:.6}}

  /* ── Side accent lines ── */
  .side-accent-left{
    position:absolute;
    left:0;top:20%;bottom:20%;width:2px;
    background:linear-gradient(180deg,transparent,rgba(220,38,38,.4),transparent);
    pointer-events:none;
  }
  .side-accent-right{
    position:absolute;
    right:0;top:20%;bottom:20%;width:2px;
    background:linear-gradient(180deg,transparent,rgba(220,38,38,.4),transparent);
    pointer-events:none;
  }

  /* ── Bottom label ── */
  .race-label{
    position:absolute;
    bottom:-22px;left:50%;transform:translateX(-50%);
    font-family:'Chakra Petch',sans-serif;
    font-size:11px;font-weight:700;
    letter-spacing:5px;
    text-transform:uppercase;
    color:rgba(168,168,168,.55);
    text-shadow:0 0 6px rgba(220,38,38,.25);
    white-space:nowrap;
  }

  /* ── Spark canvas ── */
  #sparkCanvas{
    position:absolute;inset:-10px;
    width:calc(100% + 20px);height:calc(100% + 20px);
    pointer-events:none;
  }

</style>
</head>
<body>

<div class="frame-wrap">

  <!-- Spark particles canvas -->
  <canvas id="sparkCanvas"></canvas>

  <!-- Carbon fiber border -->
  <div class="carbon-border"></div>

  <!-- Inner metallic trim -->
  <div class="inner-trim"></div>

  <!-- Checkered flag corner -->
  <div class="checkered"><div class="checkered-inner"></div></div>

  <!-- F1 Starting Lights -->
  <div class="f1-lights" id="f1Lights">
    <div class="f1-light"></div>
    <div class="f1-light"></div>
    <div class="f1-light"></div>
    <div class="f1-light"></div>
    <div class="f1-light"></div>
  </div>

  <!-- Metal highlight line -->
  <div class="metal-line-top"></div>

  <!-- Side accents -->
  <div class="side-accent-left"></div>
  <div class="side-accent-right"></div>

  <!-- Red glow bottom -->
  <div class="red-line-bottom"></div>

  <!-- DRS Panel -->
  <div class="drs-panel" id="drsPanel">
    <div class="drs-dot" id="drsDot"></div>
    <div class="drs-box"><span class="drs-label">DRS</span></div>
  </div>

  <!-- Speed text -->
  <div class="speed-text">320 KM/H</div>

  <!-- Label -->
  <div class="race-label" id="label"></div>

</div>

<script>
// ═══════════════ CONFIGURACION ═══════════════
// Edita este texto para personalizar el label del marco:
const LABEL_TEXT = 'POLE POSITION';
// ═════════════════════════════════════════════
document.getElementById('label').textContent = LABEL_TEXT;

// ═════════════════════════════════════════
//  F1 STARTING LIGHTS — race start sequence
// ═════════════════════════════════════════
const f1LightEls = document.querySelectorAll('.f1-light');

function runF1Sequence() {
  // Reset all lights
  f1LightEls.forEach(l => l.classList.remove('on'));
  let idx = 0;

  function lightNext() {
    if (idx < 5) {
      f1LightEls[idx].classList.add('on');
      idx++;
      setTimeout(lightNext, 780 + Math.random() * 180);
    } else {
      // All 5 on — hold, then go dark (GO!)
      setTimeout(() => {
        f1LightEls.forEach(l => l.classList.remove('on'));
        // Restart after a longer pause
        setTimeout(runF1Sequence, 5000 + Math.random() * 3000);
      }, 1400 + Math.random() * 400);
    }
  }
  lightNext();
}
setTimeout(runF1Sequence, 1200);

// ═════════════════════════════════════════
//  DRS PANEL — Available → Active cycle
// ═════════════════════════════════════════
const drsPanelEl = document.getElementById('drsPanel');

function drsIdle() {
  drsPanelEl.className = 'drs-panel';
  setTimeout(drsAvailable, 6000 + Math.random() * 3000);
}
function drsAvailable() {
  drsPanelEl.className = 'drs-panel available';
  setTimeout(drsActive, 1200 + Math.random() * 800);
}
function drsActive() {
  drsPanelEl.className = 'drs-panel active';
  setTimeout(drsIdle, 2000 + Math.random() * 1000);
}
setTimeout(drsAvailable, 4000);

// ═════════════════════════════════════════
//  SPARK PARTICLES — Along bottom border
// ═════════════════════════════════════════
const canvas = document.getElementById('sparkCanvas');
const ctx = canvas.getContext('2d');
const frameW = 384, frameH = 260;
canvas.width = frameW + 20;
canvas.height = frameH + 20;
const ox = 10, oy = 10;

class Spark {
  constructor() { this.reset(true); }
  reset(init) {
    // Spawn along bottom border
    this.x = ox + Math.random() * frameW;
    this.y = oy + frameH - 2 + (Math.random() * 6 - 3);
    this.vx = (Math.random() - 0.3) * 1.5;
    this.vy = -(0.5 + Math.random() * 2);
    this.life = 1;
    this.decay = 0.015 + Math.random() * 0.025;
    this.size = 0.5 + Math.random() * 1.5;
    this.isWhite = Math.random() < 0.3;
    this.gravity = 0.04 + Math.random() * 0.03;
  }
  update() {
    this.x += this.vx;
    this.vy += this.gravity;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.life <= 0) this.reset(false);
  }
  draw(ctx) {
    const a = this.life * 0.7;
    if (this.isWhite) {
      ctx.fillStyle = `rgba(255,255,255,${a})`;
    } else {
      const r = 255, g = Math.floor(120 + Math.random() * 80), b = 0;
      ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

const sparks = Array.from({ length: 18 }, () => new Spark());

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  sparks.forEach(s => { s.update(); s.draw(ctx); });
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
