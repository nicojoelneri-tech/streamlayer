<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=420,height=320">
<title>Bogos Binted — Camera Frame</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════
     BOGOS BINTED — Alien Casino Camera Frame
     Browser Source: 420 × 320, transparent bg
     Webcam goes ABOVE this source in OBS
  ═══════════════════════════════════════════ */

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:420px;height:320px;
    background:transparent;
    overflow:hidden;
  }

  /* ── Main frame ── */
  .frame-wrap{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:380px;height:260px;
  }

  /* ── Outer border — neon green con flicker y pulso rosa ocasional ── */
  .border-outer{
    position:absolute;inset:0;
    border:2px solid rgba(57,255,20,0.65);
    box-shadow:
      0 0 8px  rgba(57,255,20,0.45),
      0 0 22px rgba(57,255,20,0.18),
      inset 0 0 10px rgba(57,255,20,0.05);
    animation:borderAnim 11s ease-in-out infinite;
  }
  .border-inner{
    position:absolute;inset:7px;
    border:1px solid rgba(57,255,20,0.20);
    box-shadow:inset 0 0 6px rgba(57,255,20,0.06);
    animation:borderAnim 11s ease-in-out infinite 0.7s;
  }

  @keyframes borderAnim{
    /* Pulso normal */
    0%,80%,100%{
      border-color:rgba(57,255,20,0.65);
      box-shadow:0 0 8px rgba(57,255,20,0.45),0 0 22px rgba(57,255,20,0.18),inset 0 0 10px rgba(57,255,20,0.05);
    }
    /* Flicker apagado */
    85%{border-color:rgba(57,255,20,0.30);box-shadow:0 0 4px rgba(57,255,20,0.20)}
    /* Flash rosa */
    87%{
      border-color:rgba(217,70,239,0.80);
      box-shadow:0 0 12px rgba(217,70,239,0.60),0 0 30px rgba(217,70,239,0.25),inset 0 0 14px rgba(217,70,239,0.08);
    }
    /* Vuelve verde */
    90%{border-color:rgba(57,255,20,0.65);box-shadow:0 0 8px rgba(57,255,20,0.45),0 0 22px rgba(57,255,20,0.18),inset 0 0 10px rgba(57,255,20,0.05)}
  }

  /* ── Corner L-brackets — idénticos al overlay ── */
  .corner{position:absolute;width:34px;height:34px}
  .corner .bh,.corner .bv{
    position:absolute;
    background:#39FF14;
    box-shadow:0 0 8px rgba(57,255,20,0.75),0 0 20px rgba(57,255,20,0.35);
    animation:bracketPulse 4s ease-in-out infinite;
  }
  .corner .bh{top:0;left:0;width:100%;height:3px}
  .corner .bv{top:0;left:0;width:3px;height:100%}
  .c-tl{top:-1px;left:-1px}
  .c-tr{top:-1px;right:-1px;transform:scaleX(-1)}
  .c-bl{bottom:-1px;left:-1px;transform:scaleY(-1)}
  .c-br{bottom:-1px;right:-1px;transform:scale(-1,-1)}

  @keyframes bracketPulse{
    0%,100%{box-shadow:0 0 8px rgba(57,255,20,0.75),0 0 20px rgba(57,255,20,0.35)}
    50%     {box-shadow:0 0 12px rgba(57,255,20,1.0),0 0 30px rgba(57,255,20,0.55)}
  }

  /* ── Palos de carta en esquinas ── */
  .suit{
    position:absolute;
    font-family:'VT323',monospace;
    font-size:17px;line-height:1;
  }
  /* ♠ verde TL, ♥ rosa TR, ♣ violeta BL, ♦ verde BR */
  .s-tl{top:5px;left:8px;color:#39FF14;text-shadow:0 0 7px rgba(57,255,20,0.75);animation:suitPulse 4s ease-in-out infinite}
  .s-tr{top:5px;right:8px;color:#D946EF;text-shadow:0 0 7px rgba(217,70,239,0.75);animation:suitPulse 4s ease-in-out infinite 1s}
  .s-bl{bottom:5px;left:8px;color:#C084FC;text-shadow:0 0 7px rgba(192,132,252,0.75);animation:suitPulse 4s ease-in-out infinite 2s}
  .s-br{bottom:5px;right:8px;color:#39FF14;text-shadow:0 0 7px rgba(57,255,20,0.75);animation:suitPulse 4s ease-in-out infinite 3s}

  @keyframes suitPulse{
    0%,100%{opacity:0.65}
    50%     {opacity:1}
  }

  /* ── Dots en vértices ── */
  .dot{position:absolute;width:5px;height:5px;border-radius:50%}
  .d-tl{top:-2.5px;left:-2.5px;background:#39FF14;box-shadow:0 0 6px #39FF14,0 0 12px rgba(57,255,20,0.5);animation:dotPop 2s ease-in-out infinite}
  .d-tr{top:-2.5px;right:-2.5px;background:#D946EF;box-shadow:0 0 6px #D946EF,0 0 12px rgba(217,70,239,0.5);animation:dotPop 2s ease-in-out infinite 0.5s}
  .d-bl{bottom:-2.5px;left:-2.5px;background:#C084FC;box-shadow:0 0 6px #C084FC,0 0 12px rgba(192,132,252,0.5);animation:dotPop 2s ease-in-out infinite 1s}
  .d-br{bottom:-2.5px;right:-2.5px;background:#39FF14;box-shadow:0 0 6px #39FF14,0 0 12px rgba(57,255,20,0.5);animation:dotPop 2s ease-in-out infinite 1.5s}

  @keyframes dotPop{
    0%,100%{transform:scale(1);opacity:0.8}
    50%     {transform:scale(1.9);opacity:1}
  }

  /* ── Palos en punto medio de cada lado ── */
  .edge-suit{
    position:absolute;
    font-family:'VT323',monospace;
    font-size:15px;line-height:1;
    animation:edgeFade 3s ease-in-out infinite;
  }
  .es-t{top:-12px;left:50%;transform:translateX(-50%);color:#39FF14;opacity:0.55;text-shadow:0 0 5px rgba(57,255,20,0.5)}
  .es-b{bottom:-12px;left:50%;transform:translateX(-50%);color:#C084FC;opacity:0.55;text-shadow:0 0 5px rgba(192,132,252,0.5);animation-delay:1.5s}
  .es-l{left:-13px;top:50%;transform:translateY(-50%);color:#D946EF;opacity:0.55;text-shadow:0 0 5px rgba(217,70,239,0.5);animation-delay:0.75s}
  .es-r{right:-13px;top:50%;transform:translateY(-50%);color:#39FF14;opacity:0.55;text-shadow:0 0 5px rgba(57,255,20,0.5);animation-delay:2.25s}

  @keyframes edgeFade{
    0%,100%{opacity:0.55}50%{opacity:1}
  }

  /* ── Palos viajeros a lo largo del borde ── */
  .traveler{
    position:absolute;
    font-family:'VT323',monospace;
    font-size:16px;line-height:1;
    pointer-events:none;
    opacity:0;
  }
  /* ♦ verde, viaja de izquierda a derecha (borde superior) */
  .tv-top{
    top:-12px;
    color:#39FF14;text-shadow:0 0 10px rgba(57,255,20,0.9),0 0 24px rgba(57,255,20,0.45);
    animation:travelTop 5s linear infinite;
  }
  /* ♠ rosa, viaja de derecha a izquierda (borde inferior) */
  .tv-bot{
    bottom:-12px;
    color:#D946EF;text-shadow:0 0 10px rgba(217,70,239,0.9),0 0 24px rgba(217,70,239,0.45);
    animation:travelBot 6s linear infinite 2.5s;
  }
  /* ♥ violeta, baja (borde izquierdo) */
  .tv-left{
    left:-14px;
    color:#C084FC;text-shadow:0 0 10px rgba(192,132,252,0.9),0 0 24px rgba(192,132,252,0.45);
    animation:travelLeft 5.5s linear infinite 1s;
  }
  /* ♣ verde, sube (borde derecho) */
  .tv-right{
    right:-14px;
    color:#39FF14;text-shadow:0 0 10px rgba(57,255,20,0.9),0 0 24px rgba(57,255,20,0.45);
    animation:travelRight 5s linear infinite 3.5s;
  }

  @keyframes travelTop{
    0%  {left:-20px;opacity:0}
    5%  {opacity:1}
    95% {opacity:1}
    100%{left:calc(100% + 20px);opacity:0}
  }
  @keyframes travelBot{
    0%  {right:-20px;opacity:0}
    5%  {opacity:1}
    95% {opacity:1}
    100%{right:calc(100% + 20px);opacity:0}
  }
  @keyframes travelLeft{
    0%  {top:calc(100% + 20px);opacity:0}
    5%  {opacity:1}
    95% {opacity:1}
    100%{top:-20px;opacity:0}
  }
  @keyframes travelRight{
    0%  {bottom:calc(100% + 20px);opacity:0}
    5%  {opacity:1}
    95% {opacity:1}
    100%{bottom:-20px;opacity:0}
  }

  /* ── Scanlines (interior) ── */
  .scanlines{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      transparent 0,transparent 2px,
      rgba(0,0,0,0.09) 2px,rgba(0,0,0,0.09) 4px
    );
    animation:scanMove 14s linear infinite;
  }
  @keyframes scanMove{
    0%{background-position:0 0}100%{background-position:0 80px}
  }

  /* ── Glow interior ── */
  .inner-glow{
    position:absolute;inset:15px;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(57,255,20,0.025) 0%,transparent 70%);
    animation:innerGlow 5s ease-in-out infinite;
  }
  @keyframes innerGlow{
    0%,100%{opacity:0.5}50%{opacity:1}
  }

  /* ── Glitch layers ── */
  .glitch{position:absolute;inset:0;opacity:0;pointer-events:none}
  .g1{border:2px solid rgba(57,255,20,0.85);animation:glitch1 12s step-end infinite}
  .g2{border:2px solid rgba(217,70,239,0.75);animation:glitch2 12s step-end infinite}

  @keyframes glitch1{
    0%,90%,94%,100%{opacity:0;transform:translate(0)}
    91%{opacity:0.75;transform:translate(3px,-2px)}
    92%{opacity:0.45;transform:translate(-2px,1px)}
    93%{opacity:0;transform:translate(0)}
  }
  @keyframes glitch2{
    0%,92%,96%,100%{opacity:0;transform:translate(0)}
    93%{opacity:0.65;transform:translate(-3px,2px)}
    94.5%{opacity:0.50;transform:translate(2px,-1px)}
    95%{opacity:0;transform:translate(0)}
  }

  /* ── Label inferior ── */
  .hud-label{
    position:absolute;
    bottom:-24px;left:50%;
    transform:translateX(-50%);
    font-family:'Fredoka One',cursive;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:rgba(57,255,20,0.75);
    text-shadow:0 0 8px rgba(57,255,20,0.55);
    white-space:nowrap;
    animation:labelFlicker 5s ease-in-out infinite;
  }
  @keyframes labelFlicker{
    0%,100%{opacity:0.75}
    44%{opacity:0.75}45%{opacity:0.20}46%{opacity:0.85}47%{opacity:0.30}48%{opacity:0.75}
  }

  /* ── Canvas de partículas ── */
  #pc{
    position:absolute;
    inset:-30px;
    width:calc(100% + 60px);
    height:calc(100% + 60px);
    pointer-events:none;
  }
</style>
</head>
<body>

<div class="frame-wrap">

  <canvas id="pc"></canvas>

  <div class="inner-glow"></div>
  <div class="border-outer"></div>
  <div class="border-inner"></div>

  <!-- L-brackets -->
  <div class="corner c-tl"><div class="bh"></div><div class="bv"></div></div>
  <div class="corner c-tr"><div class="bh"></div><div class="bv"></div></div>
  <div class="corner c-bl"><div class="bh"></div><div class="bv"></div></div>
  <div class="corner c-br"><div class="bh"></div><div class="bv"></div></div>

  <!-- Palos en esquinas -->
  <span class="suit s-tl">♠</span>
  <span class="suit s-tr">♥</span>
  <span class="suit s-bl">♣</span>
  <span class="suit s-br">♦</span>

  <!-- Dots en vértices -->
  <div class="dot d-tl"></div>
  <div class="dot d-tr"></div>
  <div class="dot d-bl"></div>
  <div class="dot d-br"></div>

  <!-- Palos en midpoints -->
  <span class="edge-suit es-t">♦</span>
  <span class="edge-suit es-b">♠</span>
  <span class="edge-suit es-l">♥</span>
  <span class="edge-suit es-r">♣</span>

  <!-- Viajeros -->
  <span class="traveler tv-top">♦</span>
  <span class="traveler tv-bot">♠</span>
  <span class="traveler tv-left">♥</span>
  <span class="traveler tv-right">♣</span>

  <div class="scanlines"></div>
  <div class="glitch g1"></div>
  <div class="glitch g2"></div>

  <div class="hud-label" id="label"></div>

</div>

<script>
// ═══════════════ CONFIG ═══════════════
const LABEL_TEXT = '◆ BOGOS BINTED ◆';
// ══════════════════════════════════════

document.getElementById('label').textContent = LABEL_TEXT;

// ══════════════════════════════════════════════
//  CANVAS — Palos orbitando + starfield alien
// ══════════════════════════════════════════════

const cv  = document.getElementById('pc');
const ctx = cv.getContext('2d');

const FW = 380, FH = 260;
cv.width  = FW + 60;
cv.height = FH + 60;
const CX = cv.width  / 2;
const CY = cv.height / 2;

const SUITS   = ['♠','♥','♦','♣'];
const GREEN   = [57,  255, 20];
const PINK    = [217, 70,  239];
const PURPLE  = [192, 132, 252];
// Paleta alterna: verde y rosa/violeta para los palos
const COLORS  = [GREEN, PINK, GREEN, PURPLE, GREEN, PINK, GREEN, PURPLE, GREEN, PINK];

// ── Palos que orbitan el borde exterior ──
class SuitOrbiter {
  constructor(i, total) {
    this.suit    = SUITS[i % 4];
    this.col     = COLORS[i % COLORS.length];
    this.prog    = i / total + Math.random() * 0.02;
    this.speed   = 0.0005 + Math.random() * 0.0007;
    this.size    = 12 + Math.floor(Math.random() * 7);
    this.alpha   = 0.22 + Math.random() * 0.20;
    this.pulse   = Math.random() * Math.PI * 2;
    this.pulseS  = 0.016 + Math.random() * 0.016;
    this.off     = (Math.random() - 0.5) * 12;
    this.trail   = [];
    this.trailLen= 3 + Math.floor(Math.random() * 4);
  }

  getPos() {
    const hw = FW / 2 + 17, hh = FH / 2 + 17;
    const P  = (hw + hh) * 2;
    let d    = this.prog * P;
    let x, y;
    if      (d < hw * 2)           { x = -hw + d;                    y = -hh + this.off; }
    else if (d < hw * 2 + hh * 2) { d -= hw * 2; x = hw + this.off; y = -hh + d; }
    else if (d < hw * 4 + hh * 2) { d -= hw*2+hh*2; x = hw - d;    y =  hh + this.off; }
    else                           { d -= hw*4+hh*2; x = -hw+this.off; y = hh - d; }
    return { x: CX + x, y: CY + y };
  }

  update() {
    this.prog += this.speed;
    if (this.prog > 1) this.prog -= 1;
    this.pulse += this.pulseS;
    const p = this.getPos();
    this.trail.unshift({ x: p.x, y: p.y });
    if (this.trail.length > this.trailLen) this.trail.pop();
  }

  draw() {
    const a = this.alpha * (0.55 + 0.45 * Math.sin(this.pulse));
    const [r,g,b] = this.col;
    const pos = this.trail[0] || this.getPos();

    // Trail
    this.trail.forEach((t, i) => {
      if (!i) return;
      ctx.save();
      ctx.globalAlpha = a * (1 - i / this.trail.length) * 0.38;
      ctx.fillStyle   = `rgb(${r},${g},${b})`;
      ctx.font        = `${Math.round(this.size * (1 - i / this.trail.length * 0.5))}px VT323,monospace`;
      ctx.textAlign   = 'center';
      ctx.textBaseline= 'middle';
      ctx.fillText(this.suit, t.x, t.y);
      ctx.restore();
    });

    // Core
    ctx.save();
    ctx.globalAlpha  = a;
    ctx.fillStyle    = `rgb(${r},${g},${b})`;
    ctx.shadowColor  = `rgba(${r},${g},${b},${a * 0.85})`;
    ctx.shadowBlur   = 14;
    ctx.font         = `${this.size}px VT323,monospace`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.suit, pos.x, pos.y);
    ctx.restore();
  }
}

// ── Chispas cortas cerca del borde ──
class BorderSpark {
  constructor() { this.reset(); }
  reset() {
    const side = Math.floor(Math.random() * 4);
    const hw = FW / 2, hh = FH / 2;
    switch(side) {
      case 0: this.x = CX + (Math.random()-0.5)*FW; this.y = CY - hh - 3 - Math.random()*14; break;
      case 1: this.x = CX + hw + 3 + Math.random()*14; this.y = CY + (Math.random()-0.5)*FH; break;
      case 2: this.x = CX + (Math.random()-0.5)*FW; this.y = CY + hh + 3 + Math.random()*14; break;
      case 3: this.x = CX - hw - 3 - Math.random()*14; this.y = CY + (Math.random()-0.5)*FH; break;
    }
    this.col  = Math.random() < 0.55 ? GREEN : (Math.random() < 0.5 ? PINK : PURPLE);
    this.life = 40 + Math.random() * 90;
    this.maxL = this.life;
    this.r    = 0.5 + Math.random() * 1.2;
    this.vx   = (Math.random()-0.5) * 0.4;
    this.vy   = (Math.random()-0.5) * 0.4;
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.life--;
    if (this.life <= 0) this.reset();
  }
  draw() {
    const a = (this.life / this.maxL) * 0.75;
    const [r,g,b] = this.col;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle   = `rgba(${r},${g},${b},${a})`;
    ctx.shadowColor = `rgba(${r},${g},${b},${a * 0.7})`;
    ctx.shadowBlur  = 5;
    ctx.fill();
    ctx.shadowBlur  = 0;
  }
}

// ── Mini starfield (fondo exterior al frame) ──
const stars = Array.from({length: 40}, () => ({
  x: Math.random() * cv.width,
  y: Math.random() * cv.height,
  r: Math.random() * 0.85 + 0.15,
  a: Math.random() * 0.22 + 0.04,
  spd: Math.random() * 0.014 + 0.004,
  ph: Math.random() * Math.PI * 2,
}));

// ── Nebula sutil en esquinas ──
function drawNebula() {
  const pts = [
    {x: CX - FW/2 - 22, y: CY - FH/2 - 22, c: GREEN},
    {x: CX + FW/2 + 22, y: CY - FH/2 - 22, c: PINK},
    {x: CX - FW/2 - 22, y: CY + FH/2 + 22, c: PURPLE},
    {x: CX + FW/2 + 22, y: CY + FH/2 + 22, c: GREEN},
  ];
  pts.forEach(p => {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 60);
    g.addColorStop(0, `rgba(${p.c.join(',')},0.055)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cv.width, cv.height);
  });
}

const orbiters = Array.from({length: 10}, (_,i) => new SuitOrbiter(i, 10));
const sparks   = Array.from({length: 28}, () => new BorderSpark());
let t = 0;

function animate() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1;

  drawNebula();

  // Stars
  stars.forEach(s => {
    const tw = Math.sin(t * s.spd + s.ph) * 0.4 + 0.6;
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle   = '#CCF0FF';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  sparks.forEach(s => { s.update(); s.draw(); });
  orbiters.forEach(o => { o.update(); o.draw(); });

  t++;
  requestAnimationFrame(animate);
}

// Espera a que cargue la fuente VT323 para los palos
document.fonts.ready.then(() => animate());
</script>
</body>
</html>
