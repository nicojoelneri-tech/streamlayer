<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=420, height=320">
<title>Warzone Tactical - Camera Frame</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 420px;
    height: 320px;
    background: transparent;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
  }
  canvas#particles {
    position: absolute;
    top: 0; left: 0;
    width: 420px; height: 320px;
    pointer-events: none;
    z-index: 5;
  }
  .frame-wrapper {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 384px; height: 260px;
  }
  .frame-border {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 2px solid #4a5c2a;
    z-index: 2;
  }
  /* Warning flash */
  .frame-border.flash {
    border-color: #cc0000;
    box-shadow: inset 0 0 15px rgba(204,0,0,0.15);
  }
  /* Scope corner brackets */
  .corner {
    position: absolute;
    width: 28px; height: 28px;
    z-index: 3;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: #4a5c2a;
  }
  /* tick marks on corners */
  .corner .tick {
    position: absolute;
    background: #4a5c2a;
  }
  .corner.tl { top: -1px; left: -1px; }
  .corner.tl::before { top: 0; left: 0; width: 28px; height: 2px; }
  .corner.tl::after  { top: 0; left: 0; width: 2px; height: 28px; }
  .corner.tl .tick { top: 10px; left: 5px; width: 6px; height: 1px; }

  .corner.tr { top: -1px; right: -1px; }
  .corner.tr::before { top: 0; right: 0; width: 28px; height: 2px; }
  .corner.tr::after  { top: 0; right: 0; width: 2px; height: 28px; }
  .corner.tr .tick { top: 10px; right: 5px; width: 6px; height: 1px; }

  .corner.bl { bottom: -1px; left: -1px; }
  .corner.bl::before { bottom: 0; left: 0; width: 28px; height: 2px; }
  .corner.bl::after  { bottom: 0; left: 0; width: 2px; height: 28px; }
  .corner.bl .tick { bottom: 10px; left: 5px; width: 6px; height: 1px; }

  .corner.br { bottom: -1px; right: -1px; }
  .corner.br::before { bottom: 0; right: 0; width: 28px; height: 2px; }
  .corner.br::after  { bottom: 0; right: 0; width: 2px; height: 28px; }
  .corner.br .tick { bottom: 10px; right: 5px; width: 6px; height: 1px; }

  /* Crosshair ticks at edge midpoints */
  .crosshair {
    position: absolute;
    z-index: 3;
  }
  .crosshair.top {
    top: -1px; left: 50%; transform: translateX(-50%);
    width: 2px; height: 10px;
    background: #4a5c2a;
  }
  .crosshair.top::after {
    content: '';
    position: absolute;
    top: 4px; left: -4px;
    width: 10px; height: 2px;
    background: #4a5c2a;
  }
  .crosshair.bottom {
    bottom: -1px; left: 50%; transform: translateX(-50%);
    width: 2px; height: 10px;
    background: #4a5c2a;
  }
  .crosshair.bottom::after {
    content: '';
    position: absolute;
    bottom: 4px; left: -4px;
    width: 10px; height: 2px;
    background: #4a5c2a;
  }
  .crosshair.left {
    left: -1px; top: 50%; transform: translateY(-50%);
    width: 10px; height: 2px;
    background: #4a5c2a;
  }
  .crosshair.left::after {
    content: '';
    position: absolute;
    top: -4px; left: 4px;
    width: 2px; height: 10px;
    background: #4a5c2a;
  }
  .crosshair.right {
    right: -1px; top: 50%; transform: translateY(-50%);
    width: 10px; height: 2px;
    background: #4a5c2a;
  }
  .crosshair.right::after {
    content: '';
    position: absolute;
    top: -4px; right: 4px;
    width: 2px; height: 10px;
    background: #4a5c2a;
  }

  /* Compass heading */
  .compass {
    position: absolute;
    top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 10px;
    color: rgba(74,92,42,0.5);
    letter-spacing: 2px;
    z-index: 3;
    white-space: nowrap;
  }

  /* Range finder on right */
  .rangefinder {
    position: absolute;
    right: -32px; top: 20%;
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .rangefinder span {
    font-size: 8px;
    color: rgba(74,92,42,0.3);
    letter-spacing: 1px;
  }

  /* Ammo counter */
  .ammo {
    position: absolute;
    bottom: -18px; right: 4px;
    font-size: 10px;
    color: rgba(194,168,62,0.5);
    letter-spacing: 1px;
    z-index: 3;
  }

  /* Scope vignette - dark corners only */
  .vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    box-shadow:
      inset 40px 30px 30px -25px rgba(42,48,21,0.4),
      inset -40px 30px 30px -25px rgba(42,48,21,0.4),
      inset 40px -30px 30px -25px rgba(42,48,21,0.4),
      inset -40px -30px 30px -25px rgba(42,48,21,0.4);
    pointer-events: none;
    z-index: 4;
  }

  /* Green scan line */
  .scanline {
    position: absolute;
    top: 0; left: 0;
    width: 2px; height: 100%;
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(74,92,42,0.0) 20%,
      rgba(74,92,42,0.15) 50%,
      rgba(74,92,42,0.0) 80%,
      transparent 100%
    );
    z-index: 4;
    pointer-events: none;
    animation: scanSweep 4s linear infinite;
  }
  @keyframes scanSweep {
    0%   { left: 0; opacity: 0; }
    5%   { opacity: 1; }
    95%  { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }

  /* Label */
  #label {
    position: absolute;
    bottom: -30px; left: 50%; transform: translateX(-50%);
    font-size: 12px;
    color: #c2a83e;
    letter-spacing: 4px;
    text-transform: uppercase;
    z-index: 3;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="particles" width="420" height="320"></canvas>
<div class="frame-wrapper">
  <div class="frame-border" id="frameBorder">
    <div class="scanline"></div>
    <div class="vignette"></div>
  </div>

  <div class="corner tl"><span class="tick"></span></div>
  <div class="corner tr"><span class="tick"></span></div>
  <div class="corner bl"><span class="tick"></span></div>
  <div class="corner br"><span class="tick"></span></div>

  <div class="crosshair top"></div>
  <div class="crosshair bottom"></div>
  <div class="crosshair left"></div>
  <div class="crosshair right"></div>

  <div class="compass">N - 355</div>
  <div class="rangefinder">
    <span>100</span>
    <span>200</span>
    <span>300</span>
    <span>400</span>
    <span>500</span>
  </div>
  <div class="ammo">30 / 90</div>
  <div id="label"></div>
</div>

<script>
  const LABEL_TEXT = 'WARZONE';
  document.getElementById('label').textContent = LABEL_TEXT;

  /* --- Warning flash --- */
  const frameBorder = document.getElementById('frameBorder');
  setInterval(() => {
    frameBorder.classList.add('flash');
    setTimeout(() => frameBorder.classList.remove('flash'), 300);
  }, 12000);

  /* --- Dust particles near bottom border (Canvas) --- */
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const W = 420, H = 320;
  const frameLeft = (W - 384) / 2;
  const frameRight = frameLeft + 384;
  const frameTop = (H - 260) / 2;
  const frameBottom = frameTop + 260;

  class Dust {
    constructor() { this.reset(); }
    reset() {
      this.x = frameLeft + Math.random() * 384;
      this.y = frameBottom - 10 - Math.random() * 40;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = -Math.random() * 0.2 - 0.05;
      this.size = Math.random() * 1.5 + 0.5;
      this.alpha = Math.random() * 0.35 + 0.05;
      this.life = Math.random() * 200 + 100;
      this.age = 0;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.age++;
      if (this.age > this.life || this.x < frameLeft || this.x > frameRight) this.reset();
    }
    draw() {
      const fade = 1 - this.age / this.life;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(194,168,62,${this.alpha * fade})`;
      ctx.fill();
    }
  }

  const dusts = Array.from({ length: 30 }, () => new Dust());

  function animate() {
    ctx.clearRect(0, 0, W, H);
    for (const d of dusts) { d.update(); d.draw(); }
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
