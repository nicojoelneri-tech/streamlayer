<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <title>DEADLINK BLOOD — Preview</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0f0a; }

    .bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 40% 50%, rgba(40,5,5,0.25) 0%, transparent 60%),
        linear-gradient(180deg, #000 0%, #080404 50%, #000 100%);
    }

    .game-placeholder {
      position: absolute;
      left: 260px; top: 86px; width: 1360px; height: 780px;
      background: linear-gradient(135deg, rgba(12,4,4,0.5), rgba(8,2,2,0.5));
      display: flex; align-items: center; justify-content: center; z-index: 0;
    }
    .cam-placeholder {
      position: absolute;
      right: 16px; bottom: 68px; width: 268px; height: 190px;
      background: linear-gradient(135deg, rgba(12,4,4,0.6), rgba(8,2,2,0.6));
      display: flex; align-items: center; justify-content: center; z-index: 5;
    }
    .chat-placeholder {
      position: absolute;
      left: 16px; top: 86px; width: 236px; height: 700px; z-index: 5;
    }
    .placeholder-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px; color: rgba(255,26,46,0.08); text-transform: uppercase;
    }
    .chat-msg {
      padding: 5px 10px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; color: rgba(255,26,46,0.1);
      border-bottom: 1px solid rgba(255,26,46,0.03);
    }
    .chat-msg b { color: rgba(255,26,46,0.15); }

    iframe {
      position: absolute; top: 0; left: 0;
      width: 1920px; height: 1080px;
      border: none; background: transparent;
    }
    .controls {
      position: fixed; bottom: 10px; right: 10px; z-index: 9999;
      display: flex; gap: 6px; font-family: 'Segoe UI', sans-serif;
    }
    .controls button {
      padding: 6px 14px; background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,26,46,0.4); color: #ff1a2e;
      font-size: 13px; cursor: pointer; border-radius: 4px;
    }
    .controls button:hover { background: rgba(255,26,46,0.12); }

    .tabs {
      position: fixed; top: 10px; right: 10px; z-index: 9999;
      display: flex; gap: 6px; font-family: 'Segoe UI', sans-serif;
    }
    .tabs button {
      padding: 6px 16px; background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,26,46,0.3); color: #888;
      font-size: 12px; cursor: pointer; border-radius: 4px; letter-spacing: 1px;
    }
    .tabs button.active { color: #ff1a2e; border-color: #ff1a2e; background: rgba(255,26,46,0.08); }
    .tabs button:hover { color: #ff1a2e; }

    .scene { display: none; }
    .scene.active { display: block; }
  </style>
</head>
<body>
  <div class="scene active" id="scene-gameplay">
    <div class="bg"></div>
    <div class="game-placeholder"><span class="placeholder-text">Game Capture</span></div>
    <div class="cam-placeholder"><span class="placeholder-text" style="font-size:11px">Webcam</span></div>
    <div class="chat-placeholder">
      <div class="chat-msg"><b>> user1:</b> hola a todos</div>
      <div class="chat-msg"><b>> mod_bot:</b> bienvenidos</div>
      <div class="chat-msg"><b>> viewer:</b> que onda</div>
      <div class="chat-msg"><b>> sub_fan:</b> vamos!</div>
    </div>
    <iframe src="modules/ambient.html"></iframe>
    <iframe src="modules/top_hud.html"></iframe>
    <iframe src="modules/game_frame.html"></iframe>
    <iframe src="modules/chat_frame.html"></iframe>
    <iframe src="modules/focus_panel.html"></iframe>
    <iframe src="modules/camera_frame.html"></iframe>
    <iframe src="modules/ticker.html"></iframe>
  </div>

  <div class="scene" id="scene-jc">
    <div class="bg"></div>
    <div class="cam-placeholder" style="left:260px;top:86px;right:auto;bottom:auto;width:1360px;height:860px;">
      <span class="placeholder-text">Webcam (Full)</span>
    </div>
    <div class="chat-placeholder">
      <div class="chat-msg"><b>> user1:</b> hola</div>
      <div class="chat-msg"><b>> viewer:</b> que tal</div>
    </div>
    <iframe src="modules/top_hud.html"></iframe>
    <iframe src="modules/just_chatting_camera.html"></iframe>
    <iframe src="modules/chat_frame.html"></iframe>
    <iframe src="modules/ticker.html"></iframe>
  </div>

  <div class="scene" id="scene-starting">
    <div class="bg"></div>
    <iframe src="presets/starting.html"></iframe>
  </div>
  <div class="scene" id="scene-brb">
    <div class="bg"></div>
    <iframe src="presets/brb.html"></iframe>
  </div>
  <div class="scene" id="scene-ending">
    <div class="bg"></div>
    <iframe src="presets/ending.html"></iframe>
  </div>

  <div class="tabs">
    <button class="active" onclick="showScene('gameplay', this)">GAMEPLAY</button>
    <button onclick="showScene('jc', this)">JUST CHATTING</button>
    <button onclick="showScene('starting', this)">STARTING</button>
    <button onclick="showScene('brb', this)">BRB</button>
    <button onclick="showScene('ending', this)">ENDING</button>
  </div>
  <div class="controls">
    <button onclick="setZoom(0.5)">50%</button>
    <button onclick="setZoom(0.65)">65%</button>
    <button onclick="setZoom(0.8)">80%</button>
    <button onclick="setZoom(1)">100%</button>
  </div>

  <script>
    function showScene(id, btn) {
      document.querySelectorAll('.scene').forEach(function(s) { s.classList.remove('active'); });
      document.getElementById('scene-' + id).classList.add('active');
      document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('active'); });
      if(btn) btn.classList.add('active');
    }
    function setZoom(z) {
      document.body.style.transform = 'scale(' + z + ')';
      document.body.style.transformOrigin = 'top left';
    }
    // auto-zoom disabled for embed
    //(function() {
      //var z = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      //setZoom(z);
      //window.addEventListener('resize', function() {
        //var z = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        //setZoom(z);
      //});
    //})();
  </script>
</body>
</html>
