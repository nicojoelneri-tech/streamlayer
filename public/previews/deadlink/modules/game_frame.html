<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .wrap{ position:absolute; left:260px; top:86px; width:1360px; height:780px; z-index:2; }

    .frame{
      position:absolute; inset:0;
      border:1px solid rgba(0,255,65,0.40);
      clip-path: polygon(
        0 12px, 12px 0, calc(100% - 12px) 0, 100% 12px,
        100% calc(100% - 12px), calc(100% - 12px) 100%,
        12px 100%, 0 calc(100% - 12px)
      );
      box-shadow: var(--glow-green);
    }

    /* L-bracket corners */
    .frame-corner{ position:absolute; pointer-events:none; }
    .frame-corner::before, .frame-corner::after{
      content:""; position:absolute; background:var(--green); opacity:.5;
    }
    .frame-corner::before{ width:20px; height:1px; }
    .frame-corner::after{ width:1px; height:20px; }
    .fc-tl{ top:0; left:0; }
    .fc-tl::before{ top:0; left:0; }
    .fc-tl::after{ top:0; left:0; }
    .fc-tr{ top:0; right:0; }
    .fc-tr::before{ top:0; right:0; }
    .fc-tr::after{ top:0; right:0; }
    .fc-bl{ bottom:0; left:0; }
    .fc-bl::before{ bottom:0; left:0; }
    .fc-bl::after{ bottom:0; left:0; }
    .fc-br{ bottom:0; right:0; }
    .fc-br::before{ bottom:0; right:0; }
    .fc-br::after{ bottom:0; right:0; }

    /* edge labels — terminal readout style */
    .edge-label{
      position:absolute; height:22px; display:flex; align-items:center;
      padding:0 10px; gap:6px;
      background:var(--bg-void);
      border:1px solid var(--border-dim);
      font-size:9px; letter-spacing:1.5px; text-transform:uppercase;
      color:var(--text-mid);
      box-shadow: var(--glow-green);
    }
    .edge-tl{ top:-11px; left:40px; }
    .edge-tr{ top:-11px; right:40px; color:var(--cyan); }
    .edge-bot{ bottom:-11px; left:50%; transform:translateX(-50%); color:var(--text-dim); }

    /* ── circuit trace connection lines ── */
    .circuit-lines{
      position:absolute; inset:0; z-index:1;
      pointer-events:none; overflow:visible;
    }
    .circuit-lines svg{ width:1920px; height:1080px; }

    @keyframes circuitPulse{
      0%,100%{ opacity:.12; }
      50%{ opacity:.25; }
    }
    @keyframes circuitPulseAlt{
      0%,100%{ opacity:.08; }
      50%{ opacity:.18; }
    }
    @keyframes nodePulse{
      0%,100%{ opacity:.2; }
      50%{ opacity:.55; }
    }

    .circuit-lines .trace{
      fill:none; stroke-linecap:square;
      stroke-dasharray:6 3;
      animation: circuitPulse 4s ease-in-out infinite;
    }
    .circuit-lines .trace-alt{
      fill:none; stroke-linecap:square;
      stroke-dasharray:4 4;
      animation: circuitPulseAlt 3.5s ease-in-out infinite;
    }
    .circuit-lines .node{
      animation: nodePulse 4s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <!-- circuit trace connections (full 1920x1080) -->
  <div class="circuit-lines">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gLeft" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0%" stop-color="#00ff41" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00ff41" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gUp" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#00ff41" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gDown" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#00ff41" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- LEFT: game → chat terminal (right-angle traces) -->
      <path class="trace" d="M260,350 H180 V300 H20" stroke="url(#gLeft)" stroke-width="1"/>
      <path class="trace-alt" d="M260,500 H200 V520 H20" stroke="url(#gLeft)" stroke-width="0.7" style="animation-delay:.8s"/>
      <rect class="node" x="178" y="298" width="4" height="4" fill="rgba(0,255,65,0.5)"/>
      <rect class="node" x="198" y="518" width="4" height="4" fill="rgba(0,212,255,0.4)" style="animation-delay:1s"/>

      <!-- RIGHT: game → diagnostic panel -->
      <path class="trace" d="M1620,350 H1700 V300 H1900" stroke="url(#gRight)" stroke-width="1"/>
      <path class="trace-alt" d="M1620,500 H1720 V520 H1900" stroke="url(#gRight)" stroke-width="0.7" style="animation-delay:1.2s"/>
      <rect class="node" x="1698" y="298" width="4" height="4" fill="rgba(0,255,65,0.5)" style="animation-delay:.5s"/>
      <rect class="node" x="1718" y="518" width="4" height="4" fill="rgba(0,212,255,0.4)" style="animation-delay:1.5s"/>

      <!-- TOP: game → HUD -->
      <path class="trace" d="M940,86 V50 H940 V10" stroke="url(#gUp)" stroke-width="1"/>
      <path class="trace-alt" d="M800,86 V60 H790 V10" stroke="url(#gUp)" stroke-width="0.7" style="animation-delay:.6s"/>
      <path class="trace-alt" d="M1100,86 V55 H1110 V10" stroke="url(#gUp)" stroke-width="0.7" style="animation-delay:1.1s"/>
      <rect class="node" x="938" y="48" width="4" height="4" fill="rgba(0,255,65,0.5)" style="animation-delay:.3s"/>

      <!-- BOTTOM: game → ticker -->
      <path class="trace" d="M940,866 V950 H940 V1020" stroke="url(#gDown)" stroke-width="1"/>
      <path class="trace-alt" d="M700,866 V960 H690 V1020" stroke="url(#gDown)" stroke-width="0.7" style="animation-delay:.7s"/>
      <rect class="node" x="938" y="948" width="4" height="4" fill="rgba(0,255,65,0.5)" style="animation-delay:.4s"/>
    </svg>
  </div>

  <div class="wrap">
    <div class="frame"></div>
    <div class="frame-corner fc-tl"></div>
    <div class="frame-corner fc-tr"></div>
    <div class="frame-corner fc-bl"></div>
    <div class="frame-corner fc-br"></div>

    <div class="edge-label edge-tl"><span data-config="gameEdgeLeft">> sector_principal</span></div>
    <div class="edge-label edge-tr"><span data-config="gameEdgeRight">> feed_activo</span></div>
    <div class="edge-label edge-bot"><span data-config="gameEdgeBottom">// stream en curso — no desconectar</span></div>
  </div>
  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
