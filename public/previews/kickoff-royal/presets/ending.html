<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;background:transparent;
      animation:koFadeLoop 8s ease-in-out infinite}
    .card{width:540px;padding:40px 36px;background:var(--bg-dark);
      border:1px solid rgba(255,107,26,0.28);box-shadow:0 0 8px rgba(255,107,26,0.2);
      text-align:center;position:relative;
      clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),
        calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
    .card::before{content:'';position:absolute;top:0;left:var(--cut);right:0;
      height:3px;background:linear-gradient(90deg,#ff6b1a,#ff8844);z-index:2}
    .tag{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--text-dim);margin-bottom:16px}
    .heading{font-weight:700;font-size:38px;letter-spacing:4px;color:var(--text);margin-bottom:2px}
    .accent{font-weight:700;font-size:38px;letter-spacing:4px;color:var(--amber);
      text-shadow:0 0 20px rgba(255,107,26,0.3);margin-bottom:18px}
    .sub{font-size:14px;font-weight:500;color:var(--text-mid);margin-bottom:18px}
    .chips{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
    .chip{padding:0 12px;line-height:22px;font-size:11px;font-weight:700;letter-spacing:1px;
      background:rgba(255,107,26,0.1);border:1px solid rgba(255,107,26,0.2);color:var(--amber);
      clip-path:polygon(0 0,calc(100% - 5px) 0,100% 100%,0 100%)}
    .note{font-size:10px;color:var(--text-dim);letter-spacing:1px}
    canvas{position:fixed;top:0;left:0;z-index:-1}
  </style>
</head>
<body>
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div class="card">
    <div class="tag" data-config="endingTag">// full-time</div>
    <div class="heading" data-config="endingTitle">Fin Del</div>
    <div class="accent" data-config="endingAccent">Partido</div>
    <div class="sub" data-config="endingSub">Gracias por ver la transmisión. Nos vemos en el próximo match.</div>
    <div class="chips">
      <span class="chip" data-config="endingChip1">GG</span>
      <span class="chip" data-config="endingChip2">GRACIAS</span>
      <span class="chip" data-config="endingChip3">FIN</span>
    </div>
    <div class="note" data-config="endingNote">KICKOFF ROYAL v1.0 // full-time</div>
  </div>
  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
  <script>
    (function(){var c=document.getElementById('bg'),ctx=c.getContext('2d'),W=1920,H=1080;
    var p=[];for(var i=0;i<30;i++){p.push({x:Math.random()*W,y:Math.random()*H,
      w:2+Math.random()*3,h:1.5+Math.random()*2,vy:0.15+Math.random()*0.3,
      vx:(Math.random()-0.5)*0.15,rot:Math.random()*Math.PI*2,
      rotSpeed:(Math.random()-0.5)*0.03,wobble:Math.random()*Math.PI*2,
      wobbleSpeed:0.015+Math.random()*0.02,wobbleAmp:0.2+Math.random()*0.25,
      a:0.08+Math.random()*0.18});}
    function draw(){ctx.clearRect(0,0,W,H);
    for(var i=0;i<p.length;i++){var d=p[i];d.wobble+=d.wobbleSpeed;
      d.x+=d.vx+Math.sin(d.wobble)*d.wobbleAmp;d.y+=d.vy;d.rot+=d.rotSpeed;
      if(d.y>H+20){d.y=-20;d.x=Math.random()*W;}
      ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);
      ctx.fillStyle='rgba(255,255,255,'+d.a+')';
      ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);ctx.restore();}
    requestAnimationFrame(draw);}draw();})();
  </script>
</body>
</html>
