<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .jc-wrap { position: absolute; left: 14px; top: 114px; width: 1614px; height: 910px; }
    .jc-label { position: absolute; top: -18px; left: 14px;
      font-size: 10px; font-weight: 600; letter-spacing: 2px; color: var(--cyan); }
    .jc-frame { position: absolute; inset: 0;
      clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
    .jc-svg { position: absolute; inset: 0; pointer-events: none; }
    .jc-svg svg { width: 100%; height: 100%; }
    .jc-line { fill: none; stroke-width: 2.5; stroke: url(#jcGrad);
      filter: drop-shadow(0 0 3px rgba(255,0,80,0.3)) drop-shadow(0 0 6px rgba(0,229,255,0.2)); }
    .jc-stripe-top { position: absolute; top: -1px; left: 16px; right: 0; height: 3px;
      background: var(--grad-main); clip-path: polygon(0 0, 100% 0, 100% 100%, 4px 100%); }
    .jc-stripe-bot { position: absolute; bottom: -1px; left: 0; right: 16px; height: 3px;
      background: var(--grad-main); clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 100%, 0 100%); }
    .jc-hud { position: absolute; top: 8px; right: 20px;
      display: flex; align-items: center; gap: 0; height: 16px;
      font-size: 8px; font-weight: 700; letter-spacing: 1px; z-index: 2; }
    .jc-hud-live { background: linear-gradient(90deg, #ff0050, #cc0040);
      color: #fff; padding: 0 8px; line-height: 16px;
      clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 100%, 0 100%); }
    .jc-hud-info { background: rgba(0,0,0,0.7); color: rgba(255,255,255,0.6);
      padding: 0 8px 0 6px; line-height: 16px;
      border: 1px solid rgba(255,255,255,0.08); border-left: none;
      clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 100%, 0 100%); }
    .cc { position: absolute; width: 18px; height: 18px; pointer-events: none; }
    .cc-tl { top: -1px; left: -1px; }
    .cc-br { bottom: -1px; right: -1px; }
    .cc line { fill: none; stroke-width: 2; stroke: var(--green);
      filter: drop-shadow(0 0 3px rgba(255,0,80,0.4)); }
  </style>
</head>
<body>
  <div class="jc-wrap">
    <div class="jc-label" data-config="justChattingLabel">CAM://PRINCIPAL</div>
    <div class="jc-frame">
      <div class="jc-svg">
        <svg viewBox="0 0 1614 910" preserveAspectRatio="none">
          <defs><linearGradient id="jcGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff0050"/><stop offset="100%" stop-color="#00e5ff"/>
          </linearGradient></defs>
          <polygon class="jc-line" points="16,0 1614,0 1614,894 1598,910 0,910 0,16"/>
        </svg>
      </div>
      <div class="jc-stripe-top"></div>
      <div class="jc-stripe-bot"></div>
      <div class="jc-hud"><div class="jc-hud-live">LIVE</div><div class="jc-hud-info">CAM</div></div>
      <div class="cc cc-tl"><svg viewBox="0 0 18 18"><line x1="0" y1="18" x2="18" y2="0"/></svg></div>
      <div class="cc cc-br"><svg viewBox="0 0 18 18"><line x1="0" y1="18" x2="18" y2="0"/></svg></div>
    </div>
  </div>
  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
