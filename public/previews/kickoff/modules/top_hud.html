<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 68px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
    }

    .hud-left {
      display: flex; align-items: center; gap: 0; min-width: 280px;
    }
    .hud-tag-live {
      background: linear-gradient(90deg, #00e676, #00b854);
      color: #fff; padding: 0 12px; line-height: 22px;
      font-weight: 700; font-size: 12px; letter-spacing: 2px;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 100%, 0 100%);
    }
    .hud-tag-info {
      background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.65);
      padding: 0 12px 0 10px; line-height: 22px;
      font-weight: 600; font-size: 11px; letter-spacing: 1.5px;
      border: 1px solid rgba(255,255,255,0.08); border-left: none;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 100%, 0 100%);
    }

    .hud-center { flex: 1; text-align: center; }
    .hud-title {
      font-weight: 700; font-size: 30px; letter-spacing: 8px;
      background: var(--grad-main); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }

    .hud-right {
      display: flex; align-items: center; gap: 10px;
      min-width: 280px; justify-content: flex-end;
    }
    .hud-channel {
      font-weight: 700; font-size: 16px; letter-spacing: 3px;
      color: var(--cyan);
    }
    .hud-game-box {
      padding: 4px 14px;
      background: var(--bg-panel);
      border: 1px solid rgba(0,176,255,0.25);
      box-shadow: var(--glow-cyan);
      clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    }
    .hud-game { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; color: var(--cyan); }

    .hud-line {
      position: absolute; bottom: 0; left: 14px; right: 14px; height: 2px;
      background: var(--grad-main); opacity: 0.5;
      animation: koLineGlow 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-left">
      <div class="hud-tag-live" data-config="streamMode">EN VIVO</div>
      <div class="hud-tag-info" data-config="statusLine">ON AIR</div>
    </div>
    <div class="hud-center">
      <div class="hud-title" data-config="hudCenter">KICKOFF</div>
    </div>
    <div class="hud-right">
      <span class="hud-channel" data-config="channelName">STREAMER</span>
      <div class="hud-game-box">
        <span class="hud-game" data-config="gameLabel">EA FC 25</span>
      </div>
    </div>
    <div class="hud-line"></div>
  </div>
  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
