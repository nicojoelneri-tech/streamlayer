<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Hanami — Pausa</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body{ background:transparent; }

  /* ── Falling petals background (calmer, fewer) ── */
  .petals-bg{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
  }
  .petal-fall{
    position:absolute;
    width:10px; height:14px;
    border-radius:50% 50% 50% 0;
    opacity:0;
    animation: petalDrift linear infinite;
  }
  .petal-fall.wisteria{ background:var(--wisteria); }
  .petal-fall.wisteria-soft{ background:var(--wisteria-soft); }
  .petal-fall.sakura-pale{ background:var(--sakura-pale); }
  .petal-fall.sakura{ background:var(--sakura); }

  @keyframes petalDrift{
    0%{
      opacity:0;
      transform:translateX(-20px) translateY(-20px) rotate(0deg);
    }
    10%{ opacity:.35; }
    80%{ opacity:.3; }
    100%{
      opacity:0;
      transform:translateX(200px) translateY(1100px) rotate(280deg);
    }
  }

  /* ── Scene layout ── */
  .scene{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }

  /* ── Card ── */
  .card{
    position:relative; width:800px;
    padding:44px 52px;
    background:var(--bg-panel);
    border:1px solid var(--border-dim);
    border-radius:8px;
    box-shadow:
      var(--glow-wisteria),
      0 12px 60px rgba(42,36,32,0.08);
    text-align:left;
  }

  /* washi texture */
  .card::after{
    content:""; position:absolute; inset:0;
    border-radius:8px;
    background:
      radial-gradient(ellipse at 25% 25%, rgba(123,94,167,0.03), transparent 40%),
      radial-gradient(ellipse at 75% 75%, rgba(168,140,200,0.02), transparent 40%);
    pointer-events:none;
  }

  /* brush stroke accent top — wisteria tones */
  .card::before{
    content:""; position:absolute;
    left:20px; right:20px; top:0; height:2px;
    background: linear-gradient(90deg,
      transparent,
      var(--wisteria-soft) 20%,
      var(--wisteria) 50%,
      var(--wisteria-soft) 80%,
      transparent);
    opacity:.30; border-radius:2px;
  }

  .tag{
    font-size:10px; letter-spacing:3px; color:var(--text-dim);
    text-transform:lowercase; margin-bottom:16px;
    font-family:'Noto Sans JP',sans-serif;
  }

  .heading{
    font-family:'Zen Old Mincho',serif;
    font-size:48px; font-weight:600;
    letter-spacing:5px; color:var(--ink);
    line-height:1.1; margin-bottom:8px;
  }
  .heading .accent{ color:var(--wisteria-soft); }

  /* ink brush divider — wisteria tint */
  .brush-divider{
    width:180px; height:1px; margin:16px 0 18px;
    background:linear-gradient(90deg,
      transparent 5%,
      rgba(42,36,32,0.10) 15%,
      rgba(123,94,167,0.18) 50%,
      rgba(42,36,32,0.10) 85%,
      transparent 95%);
  }

  .sub{
    font-size:15px; color:var(--text-mid);
    font-style:italic; margin-bottom:24px;
    font-family:'Noto Sans JP',sans-serif;
  }

  .chips{ display:flex; gap:10px; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:center; gap:7px;
    padding:7px 14px;
    background:rgba(123,94,167,0.04);
    border:1px solid rgba(123,94,167,0.12);
    border-radius:4px;
    font-size:10px; letter-spacing:1.5px;
    color:var(--wisteria);
    font-family:'Noto Sans JP',sans-serif;
  }
  .chip .hm-petal{ width:8px; height:8px; }
  .chip .hm-petal::before{ width:6px; height:9px; background:var(--wisteria); }

  .chip.soft{
    background:rgba(168,140,200,0.04);
    border-color:rgba(168,140,200,0.15);
    color:var(--wisteria-soft);
  }
  .chip.soft .hm-petal::before{ background:var(--wisteria-soft); }

  .chip.pale{
    background:rgba(212,98,138,0.03);
    border-color:rgba(212,98,138,0.10);
    color:var(--sakura-soft);
  }
  .chip.pale .hm-petal::before{ background:var(--sakura-soft); }

  .note{
    position:absolute; left:50%; bottom:36px; transform:translateX(-50%);
    font-size:9px; letter-spacing:3px; color:var(--text-dim);
    font-family:'Noto Sans JP',sans-serif;
  }

  /* ── Corner petal ornaments — wisteria ── */
  .corner-petal{
    position:absolute; pointer-events:none;
    width:14px; height:20px;
    border-radius:50% 50% 50% 0;
    background:var(--wisteria);
    opacity:.18;
    animation: hmOrnamentPulse 6s ease-in-out infinite;
  }
  .corner-petal.tl{ top:12px; left:12px; transform:rotate(45deg); }
  .corner-petal.tr{ top:12px; right:12px; transform:rotate(135deg); }
  .corner-petal.bl{ bottom:12px; left:12px; transform:rotate(-45deg); }
  .corner-petal.br{ bottom:12px; right:12px; transform:rotate(-135deg); }
</style>
</head>
<body>

<!-- Falling petals background — fewer, calmer -->
<div class="petals-bg">
  <div class="petal-fall wisteria" style="left:6%;top:-10px;width:8px;height:12px;animation-duration:10s;animation-delay:0s"></div>
  <div class="petal-fall wisteria-soft" style="left:18%;top:-10px;width:10px;height:14px;animation-duration:12s;animation-delay:1.5s;transform:rotate(-15deg)"></div>
  <div class="petal-fall sakura-pale" style="left:32%;top:-10px;width:7px;height:10px;animation-duration:11s;animation-delay:0.8s"></div>
  <div class="petal-fall wisteria" style="left:48%;top:-10px;width:9px;height:13px;animation-duration:9.5s;animation-delay:2.5s;transform:rotate(30deg)"></div>
  <div class="petal-fall wisteria-soft" style="left:62%;top:-10px;width:11px;height:15px;animation-duration:10.5s;animation-delay:0.4s;transform:rotate(-25deg)"></div>
  <div class="petal-fall sakura" style="left:76%;top:-10px;width:7px;height:10px;animation-duration:11.5s;animation-delay:3s"></div>
  <div class="petal-fall wisteria" style="left:88%;top:-10px;width:9px;height:12px;animation-duration:9s;animation-delay:1.8s;transform:rotate(15deg)"></div>
  <div class="petal-fall wisteria-soft" style="left:95%;top:-10px;width:6px;height:9px;animation-duration:12s;animation-delay:0.6s"></div>
</div>

<div class="scene">
  <div class="card">
    <!-- Corner ornaments -->
    <div class="corner-petal tl"></div>
    <div class="corner-petal tr"></div>
    <div class="corner-petal bl"></div>
    <div class="corner-petal br"></div>

    <div class="tag" data-config="brbTag">// pausa breve</div>
    <div class="heading">
      <span data-config="brbTitle">Un Momento</span>
      <span class="accent" data-config="brbAccent">de Calma</span>
    </div>
    <div class="brush-divider"></div>
    <div class="sub" data-config="brbSub">Vuelvo enseguida. La brisa sigue soplando...</div>
    <div class="chips">
      <div class="chip"><span class="hm-petal sm wisteria"></span> <span data-config="brbChip1">en pausa</span></div>
      <div class="chip soft"><span class="hm-petal sm wisteria"></span> <span data-config="brbChip2">vuelvo pronto</span></div>
      <div class="chip pale"><span class="hm-petal sm"></span> <span data-config="brbChip3">conexion activa</span></div>
    </div>
  </div>
</div>

<div class="note" data-config="brbNote">hanami v1.0 // pausa</div>

<script src="../config/config.js"></script>
<script src="../shared.js"></script>
</body>
</html>
