<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Hanami — Despedida</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body{ background:transparent; }

  /* ── Falling petals background — vermillion/autumn mood ── */
  .petals-bg{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
  }
  .petal-fall{
    position:absolute;
    width:10px; height:14px;
    border-radius:50% 50% 50% 0;
    opacity:0;
    animation: petalDrift linear infinite;
  }
  .petal-fall.vermillion{ background:var(--vermillion); }
  .petal-fall.gold{ background:var(--gold); }
  .petal-fall.sakura{ background:var(--sakura); }
  .petal-fall.gold-soft{ background:var(--gold-soft); }

  @keyframes petalDrift{
    0%{
      opacity:0;
      transform:translateX(-30px) translateY(-20px) rotate(0deg);
    }
    10%{ opacity:.45; }
    80%{ opacity:.35; }
    100%{
      opacity:0;
      transform:translateX(280px) translateY(1100px) rotate(340deg);
    }
  }

  /* ── Scene layout ── */
  .scene{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }

  /* ── Card ── */
  .card{
    position:relative; width:800px;
    padding:44px 52px;
    background:var(--bg-panel);
    border:1px solid var(--border-dim);
    border-radius:8px;
    box-shadow:
      0 0 16px rgba(196,78,63,0.10),
      0 0 40px rgba(196,78,63,0.04),
      0 12px 60px rgba(42,36,32,0.08);
    text-align:left;
  }

  /* washi texture — warm tint */
  .card::after{
    content:""; position:absolute; inset:0;
    border-radius:8px;
    background:
      radial-gradient(ellipse at 25% 25%, rgba(196,78,63,0.03), transparent 40%),
      radial-gradient(ellipse at 75% 75%, rgba(196,162,101,0.02), transparent 40%);
    pointer-events:none;
  }

  /* brush stroke accent top — vermillion tones */
  .card::before{
    content:""; position:absolute;
    left:20px; right:20px; top:0; height:2px;
    background: linear-gradient(90deg,
      transparent,
      var(--gold) 20%,
      var(--vermillion) 50%,
      var(--gold) 80%,
      transparent);
    opacity:.30; border-radius:2px;
  }

  .tag{
    font-size:10px; letter-spacing:3px; color:var(--text-dim);
    text-transform:lowercase; margin-bottom:16px;
    font-family:'Noto Sans JP',sans-serif;
  }

  .heading{
    font-family:'Zen Old Mincho',serif;
    font-size:48px; font-weight:600;
    letter-spacing:5px; color:var(--ink);
    line-height:1.1; margin-bottom:8px;
    text-shadow: 0 0 16px rgba(196,78,63,0.08);
  }
  .heading .accent{ color:var(--vermillion); }

  /* ink brush divider — vermillion tint */
  .brush-divider{
    width:180px; height:1px; margin:16px 0 18px;
    background:linear-gradient(90deg,
      transparent 5%,
      rgba(42,36,32,0.10) 15%,
      rgba(196,78,63,0.18) 50%,
      rgba(42,36,32,0.10) 85%,
      transparent 95%);
  }

  .sub{
    font-size:15px; color:var(--text-mid);
    font-style:italic; margin-bottom:24px;
    font-family:'Noto Sans JP',sans-serif;
  }

  .chips{ display:flex; gap:10px; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:center; gap:7px;
    padding:7px 14px;
    background:rgba(196,78,63,0.04);
    border:1px solid rgba(196,78,63,0.12);
    border-radius:4px;
    font-size:10px; letter-spacing:1.5px;
    color:var(--vermillion);
    font-family:'Noto Sans JP',sans-serif;
  }
  .chip .hm-petal{ width:8px; height:8px; }
  .chip .hm-petal::before{ width:6px; height:9px; background:var(--vermillion); }

  .chip.gold{
    background:rgba(196,162,101,0.04);
    border-color:rgba(196,162,101,0.15);
    color:var(--gold);
  }
  .chip.gold .hm-petal::before{ background:var(--gold); }

  .chip.warm{
    background:rgba(196,78,63,0.03);
    border-color:rgba(196,78,63,0.10);
    color:var(--ink-soft);
  }
  .chip.warm .hm-petal::before{ background:var(--sakura); }

  .note{
    position:absolute; left:50%; bottom:36px; transform:translateX(-50%);
    font-size:9px; letter-spacing:3px; color:var(--text-dim);
    font-family:'Noto Sans JP',sans-serif;
  }

  /* ── Corner petal ornaments — vermillion ── */
  .corner-petal{
    position:absolute; pointer-events:none;
    width:14px; height:20px;
    border-radius:50% 50% 50% 0;
    background:var(--vermillion);
    opacity:.18;
    animation: hmOrnamentPulse 5s ease-in-out infinite;
  }
  .corner-petal.tl{ top:12px; left:12px; transform:rotate(45deg); }
  .corner-petal.tr{ top:12px; right:12px; transform:rotate(135deg); }
  .corner-petal.bl{ bottom:12px; left:12px; transform:rotate(-45deg); }
  .corner-petal.br{ bottom:12px; right:12px; transform:rotate(-135deg); }

  /* sunset fade */
  .card{ animation: sunsetBreath 6s ease-in-out infinite; }
  @keyframes sunsetBreath{
    0%,100%{ box-shadow: 0 0 16px rgba(196,78,63,0.10), 0 0 40px rgba(196,78,63,0.04), 0 12px 60px rgba(42,36,32,0.08); }
    50%{ box-shadow: 0 0 20px rgba(196,78,63,0.14), 0 0 50px rgba(196,162,101,0.06), 0 12px 60px rgba(42,36,32,0.08); }
  }
</style>
</head>
<body>

<!-- Falling petals background — warm autumn tones -->
<div class="petals-bg">
  <div class="petal-fall vermillion" style="left:4%;top:-10px;width:9px;height:13px;animation-duration:8.5s;animation-delay:0s;transform:rotate(25deg)"></div>
  <div class="petal-fall gold" style="left:14%;top:-10px;width:11px;height:15px;animation-duration:10s;animation-delay:1.3s;transform:rotate(-20deg)"></div>
  <div class="petal-fall sakura" style="left:24%;top:-10px;width:7px;height:10px;animation-duration:9.5s;animation-delay:0.6s"></div>
  <div class="petal-fall vermillion" style="left:35%;top:-10px;width:10px;height:14px;animation-duration:11s;animation-delay:2.2s;transform:rotate(40deg)"></div>
  <div class="petal-fall gold-soft" style="left:46%;top:-10px;width:8px;height:11px;animation-duration:8s;animation-delay:0.9s;transform:rotate(-35deg)"></div>
  <div class="petal-fall vermillion" style="left:57%;top:-10px;width:12px;height:16px;animation-duration:9s;animation-delay:1.7s;transform:rotate(15deg)"></div>
  <div class="petal-fall gold" style="left:68%;top:-10px;width:7px;height:10px;animation-duration:10.5s;animation-delay:0.3s"></div>
  <div class="petal-fall sakura" style="left:78%;top:-10px;width:9px;height:13px;animation-duration:7.5s;animation-delay:2.8s;transform:rotate(-10deg)"></div>
  <div class="petal-fall vermillion" style="left:87%;top:-10px;width:10px;height:14px;animation-duration:9s;animation-delay:1s;transform:rotate(50deg)"></div>
  <div class="petal-fall gold-soft" style="left:95%;top:-10px;width:6px;height:9px;animation-duration:11s;animation-delay:0.5s"></div>
</div>

<div class="scene">
  <div class="card">
    <!-- Corner ornaments -->
    <div class="corner-petal tl"></div>
    <div class="corner-petal tr"></div>
    <div class="corner-petal bl"></div>
    <div class="corner-petal br"></div>

    <div class="tag" data-config="endingTag">// atardecer</div>
    <div class="heading">
      <span data-config="endingTitle">Gracias por</span>
      <span class="accent" data-config="endingAccent">Acompanarme</span>
    </div>
    <div class="brush-divider"></div>
    <div class="sub" data-config="endingSub">Los petalos caen, pero la primavera siempre vuelve.</div>
    <div class="chips">
      <div class="chip"><span class="hm-petal sm vermillion"></span> <span data-config="endingChip1">sesion cerrada</span></div>
      <div class="chip gold"><span class="hm-petal sm gold"></span> <span data-config="endingChip2">gracias</span></div>
      <div class="chip warm"><span class="hm-petal sm"></span> <span data-config="endingChip3">hasta pronto</span></div>
    </div>
  </div>
</div>

<div class="note" data-config="endingNote">hanami v1.0 // despedida</div>

<script src="../config/config.js"></script>
<script src="../shared.js"></script>
</body>
</html>
