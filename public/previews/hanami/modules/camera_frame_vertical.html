<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>HANAMI - Camera Frame Vertical</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body{ background:transparent; }

  .wrap{ position:absolute; left:16px; bottom:70px; width:188px; height:320px; }

  /* ── White glow backdrop ── */
  .backdrop{
    position:absolute; inset:-12px;
    background:rgba(255,255,255,0.45);
    border-radius:16px;
    pointer-events:none;
  }

  .cam-frame{
    position:absolute; inset:0;
    border:3px solid rgba(42,36,32,0.28);
    border-radius:8px;
    box-shadow:
      0 0 0 1px rgba(212,98,138,0.15),
      inset 0 0 20px rgba(212,98,138,0.05),
      0 4px 20px rgba(42,36,32,0.10);
    overflow:hidden;
  }
  .cam-inner{
    position:absolute; inset:5px;
    border:1px solid rgba(42,36,32,0.12);
    border-radius:4px;
  }

  .cam-brush-top{
    position:absolute; top:-1px; left:10px; right:10px; height:3px;
    background:linear-gradient(90deg,
      transparent, rgba(212,98,138,0.6) 30%, rgba(123,94,167,0.5) 70%, transparent);
    border-radius:2px;
  }
  .cam-brush-bottom{
    position:absolute; bottom:-1px; left:20px; right:20px; height:2px;
    background:linear-gradient(90deg,
      transparent, rgba(123,94,167,0.4) 30%, rgba(212,98,138,0.45) 70%, transparent);
    border-radius:2px;
  }

  .cam-blossom{
    position:absolute; width:18px; height:18px; pointer-events:none;
  }
  .cam-blossom::after{
    content:""; position:absolute;
    width:10px; height:10px;
    border-radius:50%;
    box-shadow: 0 0 6px rgba(212,98,138,0.4);
  }
  .cam-blossom.tl{ top:-6px; left:-6px; }
  .cam-blossom.tl::after{ background:rgba(212,98,138,0.7); top:2px; left:2px; }
  .cam-blossom.tr{ top:-6px; right:-6px; }
  .cam-blossom.tr::after{ background:rgba(123,94,167,0.65); top:2px; right:2px; }
  .cam-blossom.bl{ bottom:-6px; left:-6px; }
  .cam-blossom.bl::after{ background:rgba(196,78,63,0.55); bottom:2px; left:2px; }
  .cam-blossom.br{ bottom:-6px; right:-6px; }
  .cam-blossom.br::after{ background:rgba(196,162,101,0.55); bottom:2px; right:2px; }

  .crosshair{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:50px; height:50px; opacity:.18;
  }
  .crosshair::before, .crosshair::after{
    content:""; position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%); background:rgba(42,36,32,0.4);
  }
  .crosshair::before{ width:30px; height:1px; }
  .crosshair::after{ width:1px; height:30px; }

  .guide{ position:absolute; inset:0; pointer-events:none; }
  .guide::before, .guide::after{
    content:""; position:absolute; width:16px; height:16px;
    border-style:solid; border-color:rgba(42,36,32,0.15);
  }
  .guide::before{ top:8px; left:8px; border-width:1px 0 0 1px; }
  .guide::after{ right:8px; bottom:8px; border-width:0 1px 1px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="backdrop"></div>
    <div class="cam-frame">
      <div class="cam-inner"></div>
      <div class="cam-brush-top"></div>
      <div class="cam-brush-bottom"></div>
      <div class="crosshair"></div>
      <div class="guide"></div>
    </div>
    <div class="cam-blossom tl"></div>
    <div class="cam-blossom tr"></div>
    <div class="cam-blossom bl"></div>
    <div class="cam-blossom br"></div>
  </div>
  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
