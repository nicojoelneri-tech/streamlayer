<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>HANAMI - Ticker</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body{ background:transparent; }

  .hm-ticker{
    position:fixed;
    bottom:0; left:0;
    width:1920px; height:50px;
    background: var(--bg-panel);
    border-top:1px solid var(--border-dim);
    display:flex; align-items:center;
    overflow:hidden;
    z-index:10;
  }

  /* top brush stroke edge */
  .hm-ticker::before{
    content:""; position:absolute;
    left:40px; right:40px; top:0; height:2px;
    background: linear-gradient(90deg,
      transparent,
      var(--sakura) 15%,
      var(--wisteria) 50%,
      var(--sakura) 85%,
      transparent);
    opacity:.25;
    pointer-events:none;
  }

  /* left tag */
  .hm-ticker-tag{
    flex-shrink:0;
    display:flex; align-items:center; gap:7px;
    padding:0 20px 0 24px;
    font-family:'Zen Old Mincho',serif;
    font-size:13px;
    color:var(--sakura);
    letter-spacing:2px;
    border-right:1px solid var(--border-dim);
    height:100%;
    z-index:2;
    background: var(--bg-panel);
  }

  /* scrolling area */
  .hm-ticker-track{
    flex:1;
    overflow:hidden;
    position:relative;
    height:100%;
    display:flex; align-items:center;
    mask-image: linear-gradient(90deg, transparent 0%, black 4%, black 96%, transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 4%, black 96%, transparent 100%);
  }
  .hm-ticker-scroll{
    display:flex; align-items:center; gap:0;
    white-space:nowrap;
    animation: hmTicker 90s linear infinite;
    font-family:'Noto Sans JP',sans-serif;
    font-size:18px;
    font-style:italic;
    color:var(--text-mid);
  }
  .hm-ticker-scroll span{
    padding:0 40px;
  }
  .hm-ticker-scroll :deep(.hl),
  .hm-ticker-scroll .hl{
    color:var(--sakura);
    font-style:italic;
    text-shadow:0 0 10px rgba(212,98,138,0.12);
  }
</style>
</head>
<body>

<div class="hm-ticker">

  <!-- left tag -->
  <div class="hm-ticker-tag">
    <span class="hm-petal sm"></span>
    <span data-config="tickerTag">風 viento</span>
  </div>

  <!-- scrolling text -->
  <div class="hm-ticker-track">
    <div class="hm-ticker-scroll" data-config-list="tickerItems">
      <!-- filled by shared.js -->
    </div>
  </div>

</div>

<script src="../config/config.js"></script>
<script src="../shared.js"></script>
</body>
</html>
