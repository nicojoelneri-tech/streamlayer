<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>HANAMI - Game Frame</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body{ background:transparent; }

  .wrap{ position:absolute; left:290px; top:94px; width:1340px; height:740px; z-index:5; }

  /* ── Main frame border ── */
  .frame{
    position:absolute; inset:0;
    border:3px solid rgba(42,36,32,0.30);
    border-radius:8px;
    box-shadow:
      0 0 0 1px rgba(212,98,138,0.15),
      inset 0 0 40px rgba(212,98,138,0.06),
      0 6px 30px rgba(42,36,32,0.12);
  }
  .frame-inner{
    position:absolute; inset:7px;
    border:1px solid rgba(42,36,32,0.14);
    border-radius:4px;
  }

  /* ── Brush stroke accents — BOLD ── */
  .brush-top{
    position:absolute; top:-2px; left:20px; right:20px; height:4px;
    background:linear-gradient(90deg,
      transparent 2%,
      rgba(212,98,138,0.7) 15%,
      rgba(123,94,167,0.6) 40%,
      rgba(212,98,138,0.65) 60%,
      rgba(196,162,101,0.5) 85%,
      transparent 98%);
    border-radius:2px;
  }
  .brush-bottom{
    position:absolute; bottom:-2px; left:60px; right:60px; height:3px;
    background:linear-gradient(90deg,
      transparent 5%,
      rgba(123,94,167,0.5) 25%,
      rgba(212,98,138,0.55) 50%,
      rgba(123,94,167,0.5) 75%,
      transparent 95%);
    border-radius:2px;
  }
  .brush-left{
    position:absolute; left:-2px; top:30px; bottom:30px; width:3px;
    background:linear-gradient(180deg,
      transparent 5%,
      rgba(212,98,138,0.45) 20%,
      rgba(123,94,167,0.35) 50%,
      rgba(196,78,63,0.3) 80%,
      transparent 95%);
    border-radius:2px;
  }
  .brush-right{
    position:absolute; right:-2px; top:30px; bottom:30px; width:3px;
    background:linear-gradient(180deg,
      transparent 5%,
      rgba(123,94,167,0.45) 20%,
      rgba(212,98,138,0.35) 50%,
      rgba(196,162,101,0.3) 80%,
      transparent 95%);
    border-radius:2px;
  }

  /* ── Corner branches — BIG (140px), fully visible ── */
  .corner-branch{ position:absolute; width:140px; height:140px; pointer-events:none; }
  .corner-branch svg{ width:100%; height:100%; overflow:visible; }
  .corner-branch.tl{ top:-20px; left:-20px; }
  .corner-branch.tr{ top:-20px; right:-20px; transform:scaleX(-1); }
  .corner-branch.bl{ bottom:-20px; left:-20px; transform:scaleY(-1); }
  .corner-branch.br{ bottom:-20px; right:-20px; transform:scale(-1,-1); }

  /* ── Side wisps ── */
  .wisp{
    position:absolute; top:50%; width:4px; height:120px;
    transform:translateY(-50%);
    border-radius:3px;
    opacity:.5;
    animation: hmBreathe 6s ease-in-out infinite;
  }
  .wisp.left{
    left:-14px;
    background:linear-gradient(180deg, transparent, rgba(212,98,138,0.7), rgba(123,94,167,0.5), transparent);
  }
  .wisp.right{
    right:-14px;
    background:linear-gradient(180deg, transparent, rgba(123,94,167,0.7), rgba(212,98,138,0.5), transparent);
    animation-delay:3s;
  }

  /* ── Edge labels ── */
  .edge-label{
    position:absolute; height:26px; display:flex; align-items:center;
    padding:0 14px; gap:8px;
    background:rgba(252,248,242,0.92);
    border:1px solid rgba(42,36,32,0.18);
    border-radius:4px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:9px; font-weight:500;
    letter-spacing:1.5px;
    box-shadow: 0 2px 10px rgba(42,36,32,0.08);
  }
  .edge-tl{ top:-13px; left:100px; color:var(--sakura); }
  .edge-tr{ top:-13px; right:100px; color:var(--ink); }
  .edge-bot{
    bottom:-13px; left:50%; transform:translateX(-50%);
    color:var(--text-mid); gap:10px;
  }
  .edge-bot .bar{
    width:30px; height:2px;
    background:linear-gradient(90deg, transparent, var(--sakura), transparent);
    opacity:.6;
    animation: hmBreathe 4s ease-in-out infinite;
  }

  /* ── White backdrop — lienzo behind the frame ── */
  .backdrop{
    position:absolute; inset:-14px;
    background:rgba(255,255,255,0.35);
    border-radius:18px;
    pointer-events:none;
  }

  /* ── Ink mist corners ── */
  .mist{
    position:absolute; inset:-10px;
    background:
      radial-gradient(ellipse at 3% 3%, rgba(212,98,138,0.10), transparent 22%),
      radial-gradient(ellipse at 97% 97%, rgba(123,94,167,0.10), transparent 22%),
      radial-gradient(ellipse at 3% 97%, rgba(196,78,63,0.07), transparent 18%),
      radial-gradient(ellipse at 97% 3%, rgba(196,162,101,0.07), transparent 18%);
    filter:blur(14px); pointer-events:none;
  }

  /* ── Connection lines ── */
  .ink-lines{
    position:absolute; inset:0; z-index:1;
    pointer-events:none; overflow:visible;
  }
  .ink-lines svg{ width:1920px; height:1080px; }

  @keyframes inkPulse{
    0%,100%{ opacity:.25; }
    50%{ opacity:.55; }
  }
  @keyframes inkPulseAlt{
    0%,100%{ opacity:.18; }
    50%{ opacity:.4; }
  }
  @keyframes inkNodePulse{
    0%,100%{ opacity:.3; }
    50%{ opacity:.75; }
  }

  .ink-lines .iline{
    fill:none; stroke-linecap:round;
    animation: inkPulse 5s ease-in-out infinite;
  }
  .ink-lines .iline-alt{
    fill:none; stroke-linecap:round;
    animation: inkPulseAlt 4s ease-in-out infinite;
  }
  .ink-lines .inode{
    animation: inkNodePulse 5s ease-in-out infinite;
  }
</style>
</head>
<body>

      <defs>

            stroke="url(#gRight)" stroke-width="1.2" style="animation-delay:1.5s"/>
      <circle class="inode" cx="1740" cy="300" r="5" fill="rgba(123,94,167,0.6)" style="animation-delay:.3s"/>
      <circle class="inode" cx="1770" cy="490" r="4" fill="rgba(212,98,138,0.5)" style="animation-delay:1.2s"/>
      <circle class="inode" cx="1750" cy="215" r="3.5" fill="rgba(196,162,101,0.4)" style="animation-delay:2s"/>

      <!-- TOP: frame → HUD -->
      <path class="iline" d="M960,94 Q957,55 953,20"
            stroke="url(#gUp)" stroke-width="1.8"/>
      <path class="iline-alt" d="M820,94 Q815,58 808,15"
            stroke="url(#gUp)" stroke-width="1.2" style="animation-delay:.6s"/>
      <path class="iline-alt" d="M1100,94 Q1107,55 1112,12"
            stroke="url(#gUp)" stroke-width="1.2" style="animation-delay:1.2s"/>
      <circle class="inode" cx="955" cy="45" r="4" fill="rgba(212,98,138,0.5)" style="animation-delay:.3s"/>

      <!-- BOTTOM: frame → ticker -->
      <path class="iline" d="M960,834 Q957,885 953,950 Q950,1000 953,1028"
            stroke="url(#gDown)" stroke-width="1.8"/>
      <path class="iline-alt" d="M760,834 Q755,895 748,970 L745,1028"
            stroke="url(#gDown)" stroke-width="1.2" style="animation-delay:.8s"/>
      <path class="iline-alt" d="M1160,834 Q1165,895 1172,970 L1175,1028"
            stroke="url(#gDown)" stroke-width="1.2" style="animation-delay:1.4s"/>
      <circle class="inode" cx="953" cy="950" r="4" fill="rgba(123,94,167,0.5)" style="animation-delay:.5s"/>
    </svg>
  </div>

    <div class="brush-top"></div>

    <div class="corner-branch bl"><svg viewBox="0 0 140 140">

    <div class="wisp right"></div>

    <div class="edge-label edge-tl"><div class="hm-petal sm"></div><span data-config="gameEdgeLeft">風の道</span></div>

</body>
</html>
