<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>HANAMI - Ink Wash Stinger</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1920px; height:1080px; overflow:hidden; background:transparent; }
  canvas{ position:absolute; top:0; left:0; width:1920px; height:1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 1920, H = 1080;

  /* cream fill */
  const CREAM = [248, 244, 236];
  const SAKURA = [242, 212, 222];

  /* timing */
  const FILL_DURATION  = 0.50;
  const HOLD_DURATION  = 0.15;
  const CLEAR_DURATION = 0.45;
  const TOTAL = FILL_DURATION + HOLD_DURATION + CLEAR_DURATION;

  const BAND_WIDTH = 300;

  /* Petal colors for decorative elements */
  const PETAL_COLORS = [
    [212, 98, 138],
    [242, 212, 222],
    [123, 94, 167],
    [196, 78, 63],
    [196, 162, 101],
  ];

  /* Decorative petals spawned during transitions */
  const bandPetals = [];
  const holdPetals = [];

  function spawnBandPetal(cx, cy) {
    const col = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
    return {
      x: cx + (Math.random() - 0.5) * BAND_WIDTH * 0.8,
      y: cy,
      rx: 3 + Math.random() * 5,
      ry: 5 + Math.random() * 8,
      rot: Math.random() * Math.PI * 2,
      alpha: 0.3 + Math.random() * 0.5,
      color: col,
    };
  }

  /* Pre-generate hold petals */
  for (let i = 0; i < 8; i++) {
    const col = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
    holdPetals.push({
      x: 200 + Math.random() * (W - 400),
      y: 100 + Math.random() * (H - 200),
      rx: 4 + Math.random() * 6,
      ry: 6 + Math.random() * 10,
      rot: Math.random() * Math.PI * 2,
      alpha: 0.15 + Math.random() * 0.25,
      color: col,
    });
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.rx, p.ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${p.color[0]},${p.color[1]},${p.color[2]})`;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  /* Draw the watercolor gradient band */
  function drawBand(frontX, opacity) {
    const x0 = frontX - BAND_WIDTH;
    const grad = ctx.createLinearGradient(x0, 0, frontX, 0);
    const s = SAKURA;
    const c = CREAM;
    grad.addColorStop(0,   `rgba(${s[0]},${s[1]},${s[2]},0)`);
    grad.addColorStop(0.2, `rgba(${s[0]},${s[1]},${s[2]},${0.3 * opacity})`);
    grad.addColorStop(0.4, `rgba(${c[0]},${c[1]},${c[2]},${0.85 * opacity})`);
    grad.addColorStop(0.6, `rgba(${c[0]},${c[1]},${c[2]},${0.95 * opacity})`);
    grad.addColorStop(0.8, `rgba(${s[0]},${s[1]},${s[2]},${0.4 * opacity})`);
    grad.addColorStop(1,   `rgba(${s[0]},${s[1]},${s[2]},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(x0, 0, BAND_WIDTH, H);
  }

  /* Spawn petals in band region */
  let lastPetalSpawn = 0;

  function spawnBandPetals(frontX, now, count) {
    if (now - lastPetalSpawn < 30) return;
    lastPetalSpawn = now;
    for (let i = 0; i < count; i++) {
      bandPetals.push(spawnBandPetal(frontX - BAND_WIDTH * 0.5, Math.random() * H));
    }
    /* Limit array */
    while (bandPetals.length > 80) bandPetals.shift();
  }

  let startTime = null;

  function frame(ts) {
    if (!startTime) startTime = ts;
    const elapsed = (ts - startTime) / 1000;

    ctx.clearRect(0, 0, W, H);

    if (elapsed > TOTAL + 0.05) return;

    /* Phase 1: Ink wash fills left to right */
    if (elapsed < FILL_DURATION + HOLD_DURATION) {
      const t = Math.min(elapsed / FILL_DURATION, 1);
      const ease = easeInOut(t);
      const frontX = (W + BAND_WIDTH) * ease;

      /* Solid cream behind the band */
      if (frontX > BAND_WIDTH) {
        ctx.fillStyle = `rgb(${CREAM[0]},${CREAM[1]},${CREAM[2]})`;
        ctx.fillRect(0, 0, Math.max(0, frontX - BAND_WIDTH * 0.6), H);
      }

      /* Watercolor gradient band */
      if (t < 1) {
        drawBand(frontX, 1);
        spawnBandPetals(frontX, ts, 2);
      }

      /* Draw band petals */
      for (const p of bandPetals) {
        p.alpha *= 0.995;
        if (p.alpha > 0.02) drawPetal(p);
      }

      /* Hold phase: full cream with scattered petals */
      if (elapsed >= FILL_DURATION) {
        ctx.fillStyle = `rgb(${CREAM[0]},${CREAM[1]},${CREAM[2]})`;
        ctx.fillRect(0, 0, W, H);
        for (const p of holdPetals) drawPetal(p);
      }
    }

    /* Phase 3: Ink wash clears left to right */
    if (elapsed >= FILL_DURATION + HOLD_DURATION) {
      const clearElapsed = elapsed - FILL_DURATION - HOLD_DURATION;
      const t = Math.min(clearElapsed / CLEAR_DURATION, 1);
      const ease = easeInOut(t);
      const clearX = (W + BAND_WIDTH) * ease;

      /* Right side still filled with cream */
      if (clearX < W + BAND_WIDTH) {
        ctx.fillStyle = `rgb(${CREAM[0]},${CREAM[1]},${CREAM[2]})`;
        ctx.fillRect(Math.max(0, clearX - BAND_WIDTH * 0.3), 0, W, H);
      }

      /* Lighter clearing band */
      if (t < 1) {
        drawBand(clearX, 0.6);
        spawnBandPetals(clearX, ts, 1);
      }

      /* Draw remaining petals fading */
      for (const p of bandPetals) {
        p.alpha *= 0.98;
        if (p.alpha > 0.02) drawPetal(p);
      }
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
