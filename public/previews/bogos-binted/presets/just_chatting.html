<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg); }

    /* ── Layout Just Chatting ──
       Top HUD:    y=0,    h=80
       JC Camera:  x=0,    y=80,  w=1280, h=860
       Chat:       x=1280, y=80,  w=640,  h=940
       Ticker:     y=1020, h=60
    */

    /* TOP HUD — igual que gameplay */
    .hud {
      position: absolute; top: 0; left: 0;
      width: 1920px; height: 80px;
      display: flex; align-items: center;
      padding: 0 28px;
      background: var(--panel);
      border-bottom: 2px solid var(--border);
      box-shadow: var(--glow-md);
    }
    .hud::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--border-hi), transparent); }
    .hud-left  { display: flex; align-items: center; gap: 14px; min-width: 360px; }
    .hud-center{ flex: 1; display: flex; align-items: center; justify-content: center; }
    .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 360px; }
    .hud-suit  { font-family: var(--font-terminal); font-size: 22px; color: var(--green); opacity: 0.50; text-shadow: var(--glow-xs); }
    .mode-badge {
      display: flex; align-items: center; gap: 8px; padding: 7px 20px;
      background: var(--green-dark); border: 1.5px solid var(--border);
      clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
      font-family: var(--font-ui); font-size: 13px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--green); text-shadow: var(--glow-sm);
      animation: neon-flicker 9s infinite;
    }
    .hud-title { font-family: var(--font-display); font-size: 40px; color: var(--green); text-shadow: var(--glow-lg); letter-spacing: 0.03em; animation: neon-flicker 14s infinite; }
    .hud-channel { font-family: var(--font-ui); font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: 0.06em; }
    .hud-status  { font-family: var(--font-ui); font-size: 12px; color: #C084FC; text-shadow: 0 0 6px rgba(217,70,239,0.35); }
    .hud-line { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--green), transparent); box-shadow: var(--glow-sm); }

    /* JC CAMERA */
    .jc-cam {
      position: absolute; left: 0; top: 80px;
      width: 1280px; height: 860px;
      border: 2px solid var(--border);
      box-shadow: var(--glow-md), inset 0 0 60px rgba(57,255,20,0.03);
      background: rgba(57,255,20,0.015);
    }
    .jc-cam-label-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 50px;
      background: linear-gradient(0deg, rgba(3,3,20,0.90) 0%, transparent 100%);
      display: flex; align-items: center; justify-content: center; gap: 12px;
    }
    .jc-suit { font-family: var(--font-terminal); font-size: 18px; color: var(--green); opacity: 0.7; text-shadow: var(--glow-xs); }
    .jc-label { font-family: var(--font-display); font-size: 24px; color: var(--green); text-shadow: var(--glow-sm); letter-spacing: 0.08em; animation: neon-flicker 10s infinite; }

    /* Esquinas cámara */
    .cam-corner { position: absolute; width: 28px; height: 28px; }
    .cam-corner .bh, .cam-corner .bv { position: absolute; background: var(--green); box-shadow: var(--glow-sm); }
    .cam-corner .bh { top: 0; left: 0; width: 100%; height: 3px; }
    .cam-corner .bv { top: 0; left: 0; width: 3px; height: 100%; }
    .cc-tl { top: -1px; left: -1px; }
    .cc-tr { top: -1px; right: -1px; transform: scaleX(-1); }
    .cc-bl { bottom: -1px; left: -1px; transform: scaleY(-1); }
    .cc-br { bottom: -1px; right: -1px; transform: scale(-1,-1); }

    /* CHAT PANEL */
    .chat {
      position: absolute; left: 1280px; top: 80px;
      width: 640px; height: 940px;
      background: var(--panel);
      border: 1.5px solid var(--border);
      box-shadow: var(--glow-sm);
      display: flex; flex-direction: column;
    }
    .chat-header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(57,255,20,0.05);
    }
    .chat-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .chat-suit { font-family: var(--font-terminal); font-size: 18px; color: var(--green); opacity: 0.7; text-shadow: var(--glow-xs); }
    .chat-title { font-family: var(--font-display); font-size: 24px; color: var(--green); text-shadow: var(--glow-sm); flex: 1; animation: neon-flicker 11s infinite; }
    .chat-sub { font-family: var(--font-terminal); font-size: 16px; color: #C084FC; text-shadow: 0 0 6px rgba(217,70,239,0.35); letter-spacing: 0.12em; }
    .chat-body { flex: 1; position: relative; overflow: hidden; }
    .chat-scan { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(57,255,20,0.25), transparent); animation: scan-sweep 6s linear infinite; }

    /* TICKER */
    .ticker {
      position: absolute; bottom: 0; left: 0;
      width: 1920px; height: 60px;
      background: #040415; border-top: 2px solid var(--border);
      box-shadow: 0 -4px 20px rgba(57,255,20,0.15);
      display: flex; align-items: center; overflow: hidden;
    }
    .ticker::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--border-hi), transparent); }
    .ticker-tag-el {
      display: flex; align-items: center; gap: 8px;
      padding: 0 20px 0 22px; height: 100%;
      background: var(--green-dark); border-right: 2px solid var(--border);
      flex-shrink: 0;
      font-family: var(--font-display); font-size: 22px;
      color: var(--green); text-shadow: var(--glow-sm); white-space: nowrap;
    }
    .ticker-track-wrap { flex: 1; overflow: hidden; height: 100%; display: flex; align-items: center; }
    .ticker-track {
      display: flex; align-items: center; white-space: nowrap;
      font-family: var(--font-ui); font-size: 15px; font-weight: 600;
      color: var(--text); letter-spacing: 0.04em;
      animation: ticker-scroll 60s linear infinite;
    }
    .ticker-suit { color: #D946EF; opacity: 0.90; margin: 0 10px; text-shadow: 0 0 7px rgba(217,70,239,0.6); }
  </style>
</head>
<body>
  <!-- TOP HUD -->
  <div class="hud">
    <div class="hud-left">
      <span class="hud-suit">♠</span>
      <div class="mode-badge">
        <span class="dot-live"></span>
        <span data-config="streamMode">PLAYING</span>
      </div>
    </div>
    <div class="hud-center">
      <div class="hud-title" data-config="hudCenter">BOGOS BINTED?</div>
    </div>
    <div class="hud-right">
      <div class="hud-channel" data-config="channelName">TuCanal</div>
      <div class="hud-status" data-config="statusLine">¡Aliens y cartas!</div>
    </div>
    <span class="hud-suit" style="margin-left:16px">♣</span>
    <div class="hud-line"></div>
  </div>

  <!-- JC CAMERA -->
  <div class="jc-cam">
    <div class="jc-cam-label-bar">
      <span class="jc-suit">♠</span>
      <span class="jc-label" data-config="justChattingLabel">JUST CHATTING</span>
      <span class="jc-suit">♠</span>
    </div>
    <div class="cam-corner cc-tl"><div class="bh"></div><div class="bv"></div></div>
    <div class="cam-corner cc-tr"><div class="bh"></div><div class="bv"></div></div>
    <div class="cam-corner cc-bl"><div class="bh"></div><div class="bv"></div></div>
    <div class="cam-corner cc-br"><div class="bh"></div><div class="bv"></div></div>
  </div>

  <!-- CHAT -->
  <div class="chat">
    <div class="chat-header">
      <div class="chat-title-row">
        <span class="chat-suit">♦</span>
        <div class="chat-title" data-config="chatTitle">TRANSMISSIONS</div>
        <span class="chat-suit">♦</span>
      </div>
      <div class="chat-sub" data-config="chatSubtitle">INCOMING SIGNALS</div>
    </div>
    <div class="chat-body">
      <div class="chat-scan"></div>
    </div>
  </div>

  <!-- TICKER -->
  <div class="ticker">
    <div class="ticker-tag-el">
      <span>★</span><span data-config="tickerTag">★</span><span>★</span>
    </div>
    <div class="ticker-track-wrap">
      <div class="ticker-track" data-ticker-track></div>
    </div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
  <script>
    var track = document.querySelector('.ticker-track');
    if (track) {
      track.style.animationDuration = Math.max(40, track.scrollWidth / 2 / 80) + 's';
    }
  </script>
</body>
</html>
