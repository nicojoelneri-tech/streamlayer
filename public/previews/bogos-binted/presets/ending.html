<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg); }
    .bg-canvas { position: absolute; top: 0; left: 0; z-index: 0; }

    .scene {
      position: absolute; inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .card {
      width: 820px;
      background: var(--panel);
      border: 2px solid var(--border-hi);
      box-shadow: var(--glow-lg), inset 0 0 80px rgba(57,255,20,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 46px 56px 40px;
      position: relative;
      animation: pulse-glow 4.5s ease-in-out infinite;
    }

    .card-corner {
      position: absolute;
      width: 48px; height: 48px;
    }
    .card-corner .bh, .card-corner .bv {
      position: absolute;
      background: var(--green);
      box-shadow: var(--glow-sm);
    }
    .card-corner .bh { top: 0; left: 0; width: 100%; height: 3px; }
    .card-corner .bv { top: 0; left: 0; width: 3px; height: 100%; }
    .cc-tl { top: -1px; left: -1px; }
    .cc-tr { top: -1px; right: -1px; transform: scaleX(-1); }
    .cc-bl { bottom: -1px; left: -1px; transform: scaleY(-1); }
    .cc-br { bottom: -1px; right: -1px; transform: scale(-1,-1); }

    .card-suit {
      position: absolute;
      font-family: var(--font-terminal);
      font-size: 20px;
      color: var(--green);
      opacity: 0.55;
      text-shadow: var(--glow-xs);
    }
    .cs-tl { top: 10px; left: 14px; }
    .cs-tr { top: 10px; right: 14px; }
    .cs-bl { bottom: 10px; left: 14px; }
    .cs-br { bottom: 10px; right: 14px; }

    .e-tag {
      font-family: var(--font-terminal);
      font-size: 20px;
      letter-spacing: 0.18em;
      color: var(--red);
      text-shadow: var(--glow-red);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .e-title {
      font-family: var(--font-display);
      font-size: 100px;
      color: var(--green);
      text-shadow: var(--glow-lg);
      line-height: 1;
      text-align: center;
      margin-bottom: 4px;
      animation: neon-flicker 8s infinite;
    }

    .e-accent {
      font-family: var(--font-ui);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    .divider-suits {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }
    .divider-suits .line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }
    .divider-suits .suits-row {
      font-family: var(--font-terminal);
      font-size: 18px;
      color: var(--green);
      opacity: 0.65;
      text-shadow: var(--glow-xs);
      letter-spacing: 0.2em;
    }

    .e-sub {
      font-family: var(--font-terminal);
      font-size: 22px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 24px;
      text-align: center;
    }

    .chips {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .chip {
      padding: 8px 22px;
      background: var(--green-dark);
      border: 1.5px solid var(--border);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
      text-shadow: var(--glow-xs);
      clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    }

    .e-note {
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-align: center;
      font-style: italic;
    }

    .channel-tag {
      position: absolute;
      top: 28px; right: 40px;
      z-index: 2;
      font-family: var(--font-display);
      font-size: 26px;
      color: var(--green);
      text-shadow: var(--glow-sm);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <canvas class="bg-canvas" id="bgc" width="1920" height="1080"></canvas>

  <div class="scene">
    <div class="card">
      <div class="card-corner cc-tl"><div class="bh"></div><div class="bv"></div></div>
      <div class="card-corner cc-tr"><div class="bh"></div><div class="bv"></div></div>
      <div class="card-corner cc-bl"><div class="bh"></div><div class="bv"></div></div>
      <div class="card-corner cc-br"><div class="bh"></div><div class="bv"></div></div>

      <span class="card-suit cs-tl">♠</span>
      <span class="card-suit cs-tr">♥</span>
      <span class="card-suit cs-bl">♣</span>
      <span class="card-suit cs-br">♦</span>

      <div class="e-tag"    data-config="endingTag">FIN DE TRANSMISIÓN</div>
      <div class="e-title"  data-config="endingTitle">GG WP</div>
      <div class="e-accent" data-config="endingAccent">HASTA LA PRÓXIMA</div>

      <div class="divider-suits">
        <div class="line"></div>
        <span class="suits-row">♠ ♥ ♦ ♣</span>
        <div class="line"></div>
      </div>

      <div class="e-sub" data-config="endingSub">¡Gracias por jugar con los aliens!</div>

      <div class="chips">
        <div class="chip" data-config="endingChip1">!seguir</div>
        <div class="chip" data-config="endingChip2">!discord</div>
        <div class="chip" data-config="endingChip3">VOD disponible</div>
      </div>

      <div class="e-note" data-config="endingNote">Los aliens volverán... pronto</div>
    </div>
  </div>

  <div class="channel-tag" data-config="channelName">TuCanal</div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
  <script>
    var cv=document.getElementById('bgc'), ctx=cv.getContext('2d');
    var stars=Array.from({length:300},function(){return{x:Math.random()*1920,y:Math.random()*1080,r:Math.random()*1.3+0.2,base:Math.random()*0.7+0.15,spd:Math.random()*0.02+0.005,phase:Math.random()*Math.PI*2};});
    var t=0;
    function draw(){ctx.clearRect(0,0,1920,1080);
    var g1=ctx.createRadialGradient(0,0,0,0,0,500);g1.addColorStop(0,'rgba(255,59,59,0.04)');g1.addColorStop(1,'transparent');ctx.fillStyle=g1;ctx.fillRect(0,0,1920,1080);
    var g2=ctx.createRadialGradient(1920,1080,0,1920,1080,500);g2.addColorStop(0,'rgba(57,255,20,0.04)');g2.addColorStop(1,'transparent');ctx.fillStyle=g2;ctx.fillRect(0,0,1920,1080);
    stars.forEach(function(s){var tw=Math.sin(t*s.spd+s.phase)*0.38+0.62;ctx.globalAlpha=s.base*tw;ctx.fillStyle='#D0F0FF';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
    ctx.globalAlpha=1;t++;requestAnimationFrame(draw);}draw();
  </script>
</body>
</html>
