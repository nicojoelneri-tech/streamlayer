<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: transparent; }

    /* Posición: x=0 y=343, w=350 h=677 */
    .focus {
      position: absolute;
      left: 0; top: 343px;
      width: 350px; height: 677px;
      background: var(--panel);
      border: 1.5px solid var(--border);
      box-shadow: var(--glow-sm), inset 0 0 40px rgba(57,255,20,0.03);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .focus-header {
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(57,255,20,0.05);
      flex-shrink: 0;
    }
    .focus-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .focus-suit {
      font-family: var(--font-terminal);
      font-size: 18px;
      color: var(--green);
      opacity: 0.7;
      text-shadow: var(--glow-xs);
    }
    .focus-title {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--green);
      text-shadow: var(--glow-sm);
      letter-spacing: 0.03em;
      flex: 1;
      animation: neon-flicker 13s infinite;
    }
    .focus-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      background: var(--purple-dark);
      border: 1px solid rgba(168,85,247,0.45);
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--purple);
      text-shadow: var(--glow-purple);
    }

    /* Stats */
    .focus-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px 0;
      overflow: hidden;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(57,255,20,0.12);
      position: relative;
      overflow: hidden;
    }
    .stat-row:last-child { border-bottom: none; }

    /* Barra scan por fila */
    .stat-row::after {
      content: '';
      position: absolute;
      left: 0; top: -2px; right: 0;
      height: 100%;
      background: linear-gradient(0deg,
        transparent 0%,
        rgba(57,255,20,0.04) 50%,
        transparent 100%
      );
      transform: translateY(-100%);
      animation: stat-scan 4s ease-in-out infinite;
    }
    .stat-row:nth-child(2)::after { animation-delay: 1.3s; }
    .stat-row:nth-child(3)::after { animation-delay: 2.6s; }

    @keyframes stat-scan {
      0%, 100% { transform: translateY(-100%); }
      50%       { transform: translateY(100%); }
    }

    .stat-label {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      color: var(--pink-dim);
      text-shadow: 0 0 6px rgba(217,70,239,0.30);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .stat-value {
      font-family: var(--font-terminal);
      font-size: 42px;
      color: var(--green);
      text-shadow: var(--glow-md);
      line-height: 1;
      animation: neon-flicker 7s infinite;
    }

    /* Ornamento inferior */
    .focus-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .focus-footer-suit {
      font-family: var(--font-terminal);
      font-size: 16px;
      color: var(--green);
      opacity: 0.45;
      text-shadow: var(--glow-xs);
    }
    .focus-footer-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    /* Corner suits */
    .suits span {
      font-family: var(--font-terminal);
      font-size: 12px;
      color: var(--green);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="focus">
    <!-- Header -->
    <div class="focus-header">
      <div class="focus-title-row">
        <span class="focus-suit">♦</span>
        <div class="focus-title" data-config="sideTitle">ALIEN INTEL</div>
      </div>
      <span class="focus-tag" data-config="sideTag">CLASSIFIED</span>
    </div>

    <!-- Stats -->
    <div class="focus-body">
      <div class="stat-row">
        <div class="stat-label" data-config="sideLabel1">Followers</div>
        <div class="stat-value" data-config="sidePrimary">1337</div>
      </div>
      <div class="stat-row">
        <div class="stat-label" data-config="sideLabel2">Subs</div>
        <div class="stat-value" data-config="sideSecondary">420</div>
      </div>
      <div class="stat-row">
        <div class="stat-label" data-config="sideLabel3">Viewers</div>
        <div class="stat-value" data-config="sideTertiary">42</div>
      </div>
    </div>

    <!-- Footer decorativo -->
    <div class="focus-footer">
      <div class="focus-footer-line"></div>
      <span class="focus-footer-suit">♠ ♥ ♦ ♣</span>
      <div class="focus-footer-line"></div>
    </div>

    <!-- Corner suits -->
    <div class="suits">
      <span class="s-tl">♠</span>
      <span class="s-tr">♠</span>
    </div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
