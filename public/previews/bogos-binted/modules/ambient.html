<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg); }
    canvas { position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    cv.width = 1920; cv.height = 1080;

    // Estrellas
    const stars = Array.from({length: 380}, () => ({
      x:     Math.random() * 1920,
      y:     Math.random() * 1080,
      r:     Math.random() * 1.4 + 0.2,
      base:  Math.random() * 0.75 + 0.15,
      spd:   Math.random() * 0.025 + 0.006,
      phase: Math.random() * Math.PI * 2,
    }));

    // Palos de cartas flotantes
    const SUITS = ['♠','♥','♦','♣'];
    const floaters = Array.from({length: 14}, () => resetFloater({}));

    function resetFloater(f) {
      f.x     = Math.random() * 1920;
      f.y     = 1080 + 60 + Math.random() * 300;
      f.suit  = SUITS[Math.floor(Math.random() * 4)];
      f.size  = Math.random() * 22 + 12;
      f.spd   = Math.random() * 0.35 + 0.12;
      f.drift = (Math.random() - 0.5) * 0.6;
      f.alpha = Math.random() * 0.22 + 0.06;
      f.rot   = Math.random() * Math.PI * 2;
      f.rotSpd = (Math.random() - 0.5) * 0.012;
      return f;
    }

    // Estrella fugaz ocasional
    let shooting = null;
    function maybeShoot(t) {
      if (!shooting && Math.random() < 0.003) {
        shooting = {
          x: Math.random() * 1200,
          y: Math.random() * 400,
          len: Math.random() * 120 + 60,
          alpha: 1,
          angle: Math.PI / 6 + (Math.random() - 0.5) * 0.3,
        };
      }
    }

    let t = 0;

    function draw() {
      ctx.clearRect(0, 0, 1920, 1080);

      // Nebula corner — verde
      const g1 = ctx.createRadialGradient(0, 0, 0, 0, 0, 520);
      g1.addColorStop(0, 'rgba(57,255,20,0.045)');
      g1.addColorStop(1, 'transparent');
      ctx.fillStyle = g1; ctx.fillRect(0, 0, 1920, 1080);

      // Nebula corner — morado
      const g2 = ctx.createRadialGradient(1920, 1080, 0, 1920, 1080, 600);
      g2.addColorStop(0, 'rgba(168,85,247,0.045)');
      g2.addColorStop(1, 'transparent');
      ctx.fillStyle = g2; ctx.fillRect(0, 0, 1920, 1080);

      // Estrella fugaz
      maybeShoot(t);
      if (shooting) {
        ctx.save();
        ctx.globalAlpha = shooting.alpha;
        ctx.strokeStyle = '#E0F8FF';
        ctx.lineWidth = 1.5;
        ctx.shadowColor = '#A0D8FF';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(shooting.x, shooting.y);
        ctx.lineTo(
          shooting.x + Math.cos(shooting.angle) * shooting.len,
          shooting.y + Math.sin(shooting.angle) * shooting.len
        );
        ctx.stroke();
        ctx.restore();
        shooting.x  += Math.cos(shooting.angle) * 14;
        shooting.y  += Math.sin(shooting.angle) * 14;
        shooting.alpha -= 0.035;
        if (shooting.alpha <= 0) shooting = null;
      }

      // Estrellas
      ctx.shadowColor = '#B0E0FF';
      stars.forEach(s => {
        const tw = Math.sin(t * s.spd + s.phase) * 0.38 + 0.62;
        ctx.globalAlpha = s.base * tw;
        ctx.shadowBlur  = s.r > 1 ? 4 : 0;
        ctx.fillStyle   = '#D8F4FF';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Palos flotantes
      ctx.shadowColor = '#39FF14';
      floaters.forEach(f => {
        f.y   -= f.spd;
        f.x   += f.drift;
        f.rot += f.rotSpd;
        if (f.y < -60) resetFloater(f);

        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);
        ctx.globalAlpha = f.alpha;
        ctx.fillStyle   = '#39FF14';
        ctx.shadowBlur  = 10;
        ctx.font        = `${f.size}px "VT323", monospace`;
        ctx.textAlign   = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.suit, 0, 0);
        ctx.restore();
      });

      ctx.globalAlpha = 1;
      ctx.shadowBlur  = 0;
      t++;
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
