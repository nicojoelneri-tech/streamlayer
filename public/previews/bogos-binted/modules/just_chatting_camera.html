<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: transparent; }

    /* Cámara grande para just chatting: x=0 y=80, w=1280 h=720 */
    .jc-frame {
      position: absolute;
      left: 0; top: 80px;
      width: 1280px; height: 720px;
    }

    .jc-border {
      position: absolute;
      inset: 0;
      border: 2px solid var(--border);
      box-shadow: var(--glow-md), inset 0 0 60px rgba(57,255,20,0.04);
      pointer-events: none;
    }

    /* Etiqueta inferior */
    .jc-label-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 44px;
      background: linear-gradient(0deg, rgba(3,3,20,0.90) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
    }
    .jc-suit {
      font-family: var(--font-terminal);
      font-size: 18px;
      color: var(--green);
      opacity: 0.7;
      text-shadow: var(--glow-xs);
    }
    .jc-label {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--green);
      text-shadow: var(--glow-sm);
      letter-spacing: 0.08em;
      animation: neon-flicker 10s infinite;
    }

    /* Esquinas L-bracket */
    .cam-corner {
      position: absolute;
      width: 30px; height: 30px;
    }
    .cam-corner .bh,
    .cam-corner .bv {
      position: absolute;
      background: var(--green);
      box-shadow: var(--glow-sm);
    }
    .cam-corner .bh { top: 0; left: 0; width: 100%; height: 3px; }
    .cam-corner .bv { top: 0; left: 0; width: 3px; height: 100%; }

    .c-tl { top: -1px;    left: -1px; }
    .c-tr { top: -1px;    right: -1px; transform: scaleX(-1); }
    .c-bl { bottom: -1px; left: -1px;  transform: scaleY(-1); }
    .c-br { bottom: -1px; right: -1px; transform: scale(-1,-1); }
  </style>
</head>
<body>
  <div class="jc-frame">
    <div class="jc-border"></div>

    <div class="jc-label-bar">
      <span class="jc-suit">♠</span>
      <span class="jc-label" data-config="justChattingLabel">JUST CHATTING</span>
      <span class="jc-suit">♠</span>
    </div>

    <div class="cam-corner c-tl"><div class="bh"></div><div class="bv"></div></div>
    <div class="cam-corner c-tr"><div class="bh"></div><div class="bv"></div></div>
    <div class="cam-corner c-bl"><div class="bh"></div><div class="bv"></div></div>
    <div class="cam-corner c-br"><div class="bh"></div><div class="bv"></div></div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
