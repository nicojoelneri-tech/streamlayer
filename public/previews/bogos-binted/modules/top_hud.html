<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: transparent; }

    .hud {
      position: absolute;
      top: 0; left: 0;
      width: 1920px; height: 80px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      background: var(--panel);
      border-bottom: 2px solid var(--border);
      box-shadow: var(--glow-md);
    }

    /* Borde superior muy sutil */
    .hud::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-hi), transparent);
    }

    /* ── Izquierda ── */
    .hud-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 360px;
    }
    .hud-suit-deco {
      font-family: var(--font-terminal);
      font-size: 22px;
      color: var(--green);
      opacity: 0.50;
      text-shadow: var(--glow-xs);
    }
    .mode-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 20px;
      background: var(--green-dark);
      border: 1.5px solid var(--border);
      clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--green);
      text-shadow: var(--glow-sm);
      animation: neon-flicker 9s infinite;
    }

    /* ── Centro ── */
    .hud-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hud-title {
      font-family: var(--font-display);
      font-size: 40px;
      color: var(--green);
      text-shadow: var(--glow-lg);
      letter-spacing: 0.03em;
      line-height: 1;
      animation: neon-flicker 14s infinite;
    }

    /* ── Derecha ── */
    .hud-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      min-width: 360px;
    }
    .hud-channel {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.06em;
    }
    .hud-status {
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--pink-dim);
      text-shadow: 0 0 6px rgba(217,70,239,0.35);
      letter-spacing: 0.03em;
    }

    /* Línea decorativa inferior verde */
    .hud-line {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        var(--green) 20%,
        var(--green) 80%,
        transparent 100%
      );
      box-shadow: var(--glow-sm);
    }
  </style>
</head>
<body>
  <div class="hud">
    <!-- Izquierda -->
    <div class="hud-left">
      <span class="hud-suit-deco">♠</span>
      <div class="mode-badge">
        <span class="dot-live"></span>
        <span data-config="streamMode">PLAYING</span>
      </div>
    </div>

    <!-- Centro -->
    <div class="hud-center">
      <div class="hud-title" data-config="hudCenter">BOGOS BINTED?</div>
    </div>

    <!-- Derecha -->
    <div class="hud-right">
      <div class="hud-channel" data-config="channelName">TuCanal</div>
      <div class="hud-status" data-config="statusLine">¡Aliens y cartas!</div>
    </div>
    <span class="hud-suit-deco" style="margin-left:16px">♣</span>

    <div class="hud-line"></div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
