<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: transparent; }

    /* Posición: x=0 y=80, w=350 h=263 */
    .cam-frame {
      position: absolute;
      left: 0; top: 80px;
      width: 350px; height: 263px;
    }

    /* Marco limpio — sin labels ni ornamentos internos */
    .cam-border {
      position: absolute;
      inset: 0;
      border: 2px solid var(--border);
      box-shadow: var(--glow-md), inset 0 0 30px rgba(57,255,20,0.04);
      pointer-events: none;
    }

    /* Esquinas L-bracket únicamente */
    .cam-corner {
      position: absolute;
      width: 22px; height: 22px;
    }
    .cam-corner .bh,
    .cam-corner .bv {
      position: absolute;
      background: var(--green);
      box-shadow: var(--glow-sm);
    }
    .cam-corner .bh { top: 0; left: 0; width: 100%; height: 2.5px; }
    .cam-corner .bv { top: 0; left: 0; width: 2.5px; height: 100%; }

    .c-tl { top: -1px;    left: -1px; }
    .c-tr { top: -1px;    right: -1px; transform: scaleX(-1); }
    .c-bl { bottom: -1px; left: -1px;  transform: scaleY(-1); }
    .c-br { bottom: -1px; right: -1px; transform: scale(-1,-1); }
  </style>
</head>
<body>
  <div class="cam-frame">
    <div class="cam-border"></div>
    <div class="cam-corner c-tl"><div class="bh"></div><div class="bv"></div></div>
    <div class="cam-corner c-tr"><div class="bh"></div><div class="bv"></div></div>
    <div class="cam-corner c-bl"><div class="bh"></div><div class="bv"></div></div>
    <div class="cam-corner c-br"><div class="bh"></div><div class="bv"></div></div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
