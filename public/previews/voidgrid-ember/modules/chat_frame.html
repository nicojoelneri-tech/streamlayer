<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .chat-wrap {
      position: absolute;
      left: 14px; top: 288px;
      width: 280px; height: 732px;
    }

    .chat-panel {
      position: absolute;
      inset: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-mid);
      box-shadow: var(--glow-green);
      clip-path: polygon(
        12px 0, calc(100% - 12px) 0,
        100% 12px, 100% calc(100% - 12px),
        calc(100% - 12px) 100%, 12px 100%,
        0 calc(100% - 12px), 0 12px
      );
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 12px 16px 8px;
      flex-shrink: 0;
    }

    .chat-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 3px;
      color: var(--green);
    }

    .chat-sub {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .chat-divider {
      height: 1px;
      background: linear-gradient(90deg, var(--border-mid), transparent);
      margin: 0 16px;
      flex-shrink: 0;
    }

    .chat-body {
      flex: 1;
      /* empty: user places real chat widget here in OBS */
    }

    /* Decorative data stream on left edge */
    .chat-edge {
      position: absolute;
      left: -6px; top: 40px; bottom: 40px;
      width: 1px;
      border-left: 1px dashed var(--border-dim);
    }

    /* Corner marks */
    .cc { position: absolute; pointer-events: none; }
    .cc::before, .cc::after {
      content: ''; position: absolute;
      background: var(--green);
      box-shadow: 0 0 4px var(--green);
    }
    .cc--tl { top: 2px; left: 10px; }
    .cc--tl::before { width: 14px; height: 2px; }
    .cc--tl::after  { width: 2px; height: 14px; }

    .cc--br { bottom: 2px; right: 10px; }
    .cc--br::before { width: 14px; height: 2px; bottom: 0; right: 0; }
    .cc--br::after  { width: 2px; height: 14px; bottom: 0; right: 0; }

    /* Scanlines */
    .chat-panel::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(255,107,26,0.012) 2px, rgba(255,107,26,0.012) 4px
      );
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="chat-wrap">
    <div class="chat-edge"></div>
    <div class="chat-panel">
      <div class="chat-header">
        <div class="chat-title-row">
          <span class="vg-dot" style="width:5px;height:5px;"></span>
          <span class="chat-title" data-config="chatTitle">LIVE CHAT</span>
        </div>
        <div class="chat-sub" data-config="chatSubtitle">grid://chat_feed</div>
      </div>
      <div class="chat-divider"></div>
      <div class="chat-body"></div>

      <span class="cc cc--tl"></span>
      <span class="cc cc--br"></span>
    </div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
