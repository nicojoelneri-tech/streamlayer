<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .panel-wrap {
      position: absolute;
      left: 14px; top: 108px;
      width: 260px;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-mid);
      box-shadow: var(--glow-red);
      padding: 14px 12px;
      position: relative;
      clip-path: polygon(
        0 0, calc(100% - 12px) 0,
        100% 12px, 100% 100%,
        12px 100%, 0 calc(100% - 12px)
      );
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 60px; height: 2px;
      background: var(--red);
      z-index: 2;
      overflow: hidden;
    }

    /* Sweep light */
    .panel-sweep {
      position: absolute;
      top: 0; left: 0; width: 60px; height: 2px;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }
    .panel-sweep::after {
      content: '';
      position: absolute;
      top: 0; left: -60px;
      width: 60px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: rcSweep 5s ease-in-out infinite;
    }

    .panel::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(230,57,70,0.008) 3px, rgba(230,57,70,0.008) 4px
      );
      pointer-events: none;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .panel-title {
      font-family: var(--font-display);
      font-size: 20px;
      letter-spacing: 4px;
      color: var(--red);
    }
    .panel-tag {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .panel-tag-text {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-mid);
    }

    .panel-divider {
      height: 1px;
      background: linear-gradient(90deg, var(--red), var(--border-dim), transparent);
      margin-bottom: 12px;
    }

    .data-item { margin-bottom: 14px; }
    .data-item:last-child { margin-bottom: 0; }

    .data-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .data-prefix {
      display: inline-block;
      width: 3px; height: 12px;
    }
    .data-prefix--red   { background: var(--red); animation: rcDataPulse 2.5s ease-in-out infinite; }
    .data-prefix--steel { background: var(--steel); animation: rcDataPulse 2.5s ease-in-out infinite 0.8s; --dp-color: var(--steel); }
    .data-prefix--amber { background: var(--amber); animation: rcDataPulse 2.5s ease-in-out infinite 1.6s; --dp-color: var(--amber); }

    .data-value {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 2px;
    }
    .data-value--red   { color: var(--red); text-shadow: 0 0 10px rgba(230,57,70,0.3); animation: dvGlowRed 3s ease-in-out infinite; }
    .data-value--steel { color: var(--steel); text-shadow: 0 0 10px rgba(92,138,173,0.3); animation: dvGlowSteel 3s ease-in-out infinite 1s; }
    .data-value--amber { color: var(--amber); text-shadow: 0 0 10px rgba(240,160,48,0.3); animation: dvGlowAmber 3s ease-in-out infinite 2s; }

    @keyframes dvGlowRed {
      0%, 100% { text-shadow: 0 0 10px rgba(230,57,70,0.2); }
      50%      { text-shadow: 0 0 18px rgba(230,57,70,0.5), 0 0 4px rgba(230,57,70,0.8); }
    }
    @keyframes dvGlowSteel {
      0%, 100% { text-shadow: 0 0 10px rgba(92,138,173,0.2); }
      50%      { text-shadow: 0 0 18px rgba(92,138,173,0.5), 0 0 4px rgba(92,138,173,0.8); }
    }
    @keyframes dvGlowAmber {
      0%, 100% { text-shadow: 0 0 10px rgba(240,160,48,0.2); }
      50%      { text-shadow: 0 0 18px rgba(240,160,48,0.5), 0 0 4px rgba(240,160,48,0.8); }
    }

    /* Panel border glow breathing */
    .panel {
      animation: rcGlow 4s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="panel-wrap">
    <div class="panel">
      <div class="panel-sweep"></div>
      <div class="panel-header">
        <span class="panel-title" data-config="sideTitle">INTEL</span>
        <div class="panel-tag">
          <span class="rc-diamond" style="width:5px;height:5px;"></span>
          <span class="panel-tag-text" data-config="sideTag">ACTIVE</span>
        </div>
      </div>
      <div class="panel-divider"></div>

      <div class="data-item">
        <div class="data-label"><span class="data-prefix data-prefix--red"></span><span data-config="sideLabel1">AGENT</span></div>
        <div class="data-value data-value--red" data-config="sidePrimary">STREAMER</div>
      </div>

      <div class="data-item">
        <div class="data-label"><span class="data-prefix data-prefix--steel"></span><span data-config="sideLabel2">RANK</span></div>
        <div class="data-value data-value--steel" data-config="sideSecondary">DIAMOND II</div>
      </div>

      <div class="data-item">
        <div class="data-label"><span class="data-prefix data-prefix--amber"></span><span data-config="sideLabel3">K/D/A</span></div>
        <div class="data-value data-value--amber" data-config="sideTertiary">15 / 3 / 7</div>
      </div>
    </div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
