<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .mbar {
      position: absolute;
      top: 74px; left: 14px; right: 14px;
      height: 28px;
      display: flex;
      align-items: center;
      background: rgba(12,14,18,0.85);
      border: 1px solid var(--border-dim);
      border-top: none;
      clip-path: polygon(
        0 0, calc(100% - 10px) 0,
        100% 10px, 100% 100%,
        10px 100%, 0 calc(100% - 10px)
      );
      padding: 0 20px;
      gap: 6px;
    }

    .mbar-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mbar-sep {
      width: 1px; height: 14px;
      background: var(--border-dim);
      margin: 0 10px;
    }

    /* Map */
    .mbar-map-icon {
      width: 10px; height: 10px;
      border: 1.5px solid var(--steel);
      border-radius: 2px;
      position: relative;
    }
    .mbar-map-icon::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 3px; height: 3px;
      background: var(--steel);
      border-radius: 1px;
    }
    .mbar-map {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--steel);
    }

    /* Center: score */
    .mbar-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .mbar-team {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--text-mid);
    }
    .mbar-score {
      font-family: var(--font-display);
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--red);
    }
    .mbar-vs {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    /* Round */
    .mbar-round {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--amber);
    }

    /* Mode */
    .mbar-mode {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="mbar">
    <div class="mbar-section">
      <div class="mbar-map-icon"></div>
      <span class="mbar-map" data-config="matchMap">DUST II</span>
    </div>

    <div class="mbar-sep"></div>

    <div class="mbar-center">
      <span class="mbar-team" data-config="matchTeam1">CT</span>
      <span class="mbar-score" data-config="matchScore1">7</span>
      <span class="mbar-vs">VS</span>
      <span class="mbar-score" data-config="matchScore2">4</span>
      <span class="mbar-team" data-config="matchTeam2">T</span>
    </div>

    <div class="mbar-sep"></div>

    <div class="mbar-section">
      <span class="mbar-round" data-config="matchRound">ROUND 12</span>
    </div>

    <div class="mbar-sep"></div>

    <div class="mbar-section">
      <span class="rc-diamond" style="width:4px;height:4px;box-shadow:none;"></span>
      <span class="mbar-mode" data-config="matchMode">COMPETITIVE</span>
    </div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
