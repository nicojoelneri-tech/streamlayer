<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .ticker-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .ticker-line {
      position: absolute;
      top: 0; left: 14px; right: 14px;
      height: 1px;
      background: linear-gradient(90deg,
        var(--red), var(--border-dim) 40%,
        var(--border-dim) 60%, var(--steel)
      );
      background-size: 200% 100%;
      animation: rcGradientShift 6s ease-in-out infinite;
    }

    .ticker-tag {
      flex-shrink: 0;
      margin-left: 14px;
      padding: 3px 14px;
      background: rgba(230,57,70,0.12);
      border: 1px solid var(--border-dim);
      font-family: var(--font-display);
      font-size: 14px;
      letter-spacing: 3px;
      color: var(--red);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    }

    .ticker-scroll {
      flex: 1;
      overflow: hidden;
      margin: 0 12px;
    }
    .ticker-track {
      display: flex;
      gap: 36px;
      white-space: nowrap;
      animation: rcTicker 75s linear infinite;
    }
    .ticker-track span {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--text-mid);
      display: flex;
      align-items: center;
      gap: 36px;
    }
    .ticker-track span::after {
      content: '›';
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      opacity: 0.4;
    }

    .hl { color: var(--red); font-weight: 700; }

    .ticker-chev-l { position: absolute; top: -1px; left: 268px; color: var(--red); font-size: 10px; font-weight: 700; animation: rcPulse 2.5s ease-in-out infinite; }
    .ticker-chev-r { position: absolute; top: -1px; right: 298px; color: var(--steel); font-size: 10px; font-weight: 700; animation: rcPulse 2.5s ease-in-out infinite 1.2s; }
  </style>
</head>
<body>
  <div class="ticker-wrap">
    <div class="ticker-line"></div>
    <span class="ticker-chev-l">›</span>
    <span class="ticker-chev-r">‹</span>
    <div class="ticker-tag" data-config="tickerTag">INTEL</div>
    <div class="ticker-scroll">
      <div class="ticker-track" data-config-list="tickerItems"></div>
    </div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
