<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .cam-wrap {
      position: absolute;
      right: 14px; top: 108px;
      width: 290px; height: 206px;
    }

    .cam-frame {
      position: absolute; inset: 0;
      border: 2px solid var(--border-mid);
      box-shadow: var(--glow-red);
      background: transparent;
      clip-path: polygon(
        0 0, calc(100% - 12px) 0,
        100% 12px, 100% 100%,
        12px 100%, 0 calc(100% - 12px)
      );
    }

    /* Red accent top line */
    .cam-frame::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 50px; height: 2px;
      background: var(--red);
    }

    /* Corners */
    .cc { position: absolute; pointer-events: none; }
    .cc::before, .cc::after {
      content: ''; position: absolute;
      background: var(--red);
    }
    .cc--tl { top: 2px; left: 2px; }
    .cc--tl::before { width: 14px; height: 2px; }
    .cc--tl::after  { width: 2px; height: 14px; }

    .cc--br { bottom: 2px; right: 2px; }
    .cc--br::before { width: 14px; height: 2px; bottom: 0; right: 0; }
    .cc--br::after  { width: 2px; height: 14px; bottom: 0; right: 0; }

    /* REC */
    .rec {
      position: absolute;
      top: 6px; right: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      animation: rcRecBlink 1.2s step-end infinite;
      z-index: 2;
    }
    .rec-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
    }
    .rec-text {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--red);
    }

    .cam-scan::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(230,57,70,0.008) 3px, rgba(230,57,70,0.008) 4px
      );
      background-size: 100% 40px;
      animation: rcScanDrift 6s linear infinite;
      pointer-events: none;
    }

    /* Security cam scan line */
    .cam-scanline {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 5%, rgba(230,57,70,0.25) 20%, rgba(230,57,70,0.4) 50%, rgba(230,57,70,0.25) 80%, transparent 95%);
      box-shadow: 0 0 8px rgba(230,57,70,0.3), 0 -4px 12px rgba(230,57,70,0.08), 0 4px 12px rgba(230,57,70,0.08);
      animation: rcScanLine 4s linear infinite;
      pointer-events: none;
      z-index: 3;
    }

    /* Corner glow */
    .cc { animation: rcCornerGlow 3s ease-in-out infinite; }
    .cc--br { animation-delay: 1.5s; }
  </style>
</head>
<body>
  <div class="cam-wrap">
    <div class="cam-frame cam-scan">
      <div class="cam-scanline"></div>
      <div class="rec">
        <span class="rec-dot"></span>
        <span class="rec-text">REC</span>
      </div>
      <span class="cc cc--tl"></span>
      <span class="cc cc--br"></span>
    </div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
