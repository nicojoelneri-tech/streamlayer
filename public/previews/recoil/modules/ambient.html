<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    canvas { position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <canvas id="amb" width="1920" height="1080"></canvas>
  <script>
    (function () {
      var c = document.getElementById('amb');
      var ctx = c.getContext('2d');
      var W = 1920, H = 1080;

      // Safe zone (game area)
      var sx1 = 282, sx2 = 1608, sy1 = 108, sy2 = 1028;
      function inSafe(x, y) { return x > sx1 && x < sx2 && y > sy1 && y < sy2; }

      // Particles — more visible
      var particles = [];
      for (var i = 0; i < 100; i++) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.15,
          r: Math.random() * 1.5 + 0.4,
          a: Math.random() * 0.5 + 0.2,
          phase: Math.random() * Math.PI * 2,
          type: Math.random() > 0.65 ? 1 : 0  // 1 = diamond, 0 = circle
        });
      }

      // Radar sweep — visible arc
      var radarAngle = 0;
      var radarX = 137, radarY = 400;
      var radarRadius = 100;

      // Horizontal scan line
      var scanY = 0;
      var scanSpeed = 0.6;
      var scanAlpha = 0;

      // Glitch bars (occasional)
      var glitchTimer = 0;
      var glitchBars = [];
      var glitchActive = false;

      var t = 0;

      function draw() {
        ctx.clearRect(0, 0, W, H);
        t += 0.016;

        // ── Particles ──
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < -10) p.x = W + 10;
          if (p.x > W + 10) p.x = -10;
          if (p.y < -10) p.y = H + 10;
          if (p.y > H + 10) p.y = -10;

          var flicker = Math.sin(t * 2 + p.phase) * 0.3 + 0.7;
          var alpha = p.a * flicker;
          if (inSafe(p.x, p.y)) alpha *= 0.12;

          if (p.type === 1) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = 'rgba(230, 57, 70, ' + alpha + ')';
            ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
            ctx.restore();
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(92, 138, 173, ' + alpha + ')';
            ctx.fill();
          }
        }

        // ── Radar sweep (visible arc wedge) ──
        radarAngle += 0.012;
        var sweepAngle = 0.5; // radians of arc
        var grad = ctx.createConicGradient(radarAngle - sweepAngle, radarX, radarY);
        grad.addColorStop(0, 'rgba(230, 57, 70, 0)');
        grad.addColorStop(0.08, 'rgba(230, 57, 70, 0.12)');
        grad.addColorStop(0.16, 'rgba(230, 57, 70, 0)');

        ctx.beginPath();
        ctx.moveTo(radarX, radarY);
        ctx.arc(radarX, radarY, radarRadius, radarAngle - sweepAngle, radarAngle);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();

        // Radar ring
        ctx.beginPath();
        ctx.arc(radarX, radarY, radarRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(230, 57, 70, 0.06)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(radarX, radarY, radarRadius * 0.5, 0, Math.PI * 2);
        ctx.stroke();

        // Radar crosshairs
        ctx.beginPath();
        ctx.moveTo(radarX - radarRadius, radarY);
        ctx.lineTo(radarX + radarRadius, radarY);
        ctx.moveTo(radarX, radarY - radarRadius);
        ctx.lineTo(radarX, radarY + radarRadius);
        ctx.strokeStyle = 'rgba(230, 57, 70, 0.04)';
        ctx.stroke();

        // Radar blip at sweep front
        var blipX = radarX + Math.cos(radarAngle) * radarRadius * 0.6;
        var blipY = radarY + Math.sin(radarAngle) * radarRadius * 0.6;
        var blipAlpha = Math.sin(t * 3) * 0.15 + 0.2;
        ctx.beginPath();
        ctx.arc(blipX, blipY, 2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(230, 57, 70, ' + blipAlpha + ')';
        ctx.fill();

        // ── Horizontal scan line ──
        scanY += scanSpeed;
        if (scanY > H + 20) scanY = -20;
        scanAlpha = 0.08;
        // Dim inside safe zone
        ctx.beginPath();
        ctx.moveTo(0, scanY);
        ctx.lineTo(W, scanY);
        ctx.strokeStyle = 'rgba(230, 57, 70, ' + scanAlpha + ')';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Glow around scan line
        var scanGrad = ctx.createLinearGradient(0, scanY - 8, 0, scanY + 8);
        scanGrad.addColorStop(0, 'rgba(230, 57, 70, 0)');
        scanGrad.addColorStop(0.5, 'rgba(230, 57, 70, 0.03)');
        scanGrad.addColorStop(1, 'rgba(230, 57, 70, 0)');
        ctx.fillStyle = scanGrad;
        ctx.fillRect(0, scanY - 8, W, 16);

        // ── Occasional glitch bars ──
        glitchTimer += 0.016;
        if (glitchTimer > 6 + Math.random() * 4) {
          glitchTimer = 0;
          glitchActive = true;
          glitchBars = [];
          var count = Math.floor(Math.random() * 4) + 2;
          for (var g = 0; g < count; g++) {
            glitchBars.push({
              y: Math.random() * H,
              h: Math.random() * 3 + 1,
              offset: (Math.random() - 0.5) * 6,
              life: Math.random() * 0.1 + 0.05
            });
          }
        }
        if (glitchActive) {
          var allDead = true;
          for (var g = 0; g < glitchBars.length; g++) {
            var bar = glitchBars[g];
            bar.life -= 0.016;
            if (bar.life > 0) {
              allDead = false;
              ctx.fillStyle = 'rgba(230, 57, 70, 0.06)';
              ctx.fillRect(0, bar.y, W, bar.h);
              // Red offset slice
              ctx.fillStyle = 'rgba(230, 57, 70, 0.04)';
              ctx.fillRect(bar.offset, bar.y - 1, W, 1);
              // Cyan offset
              ctx.fillStyle = 'rgba(92, 138, 173, 0.03)';
              ctx.fillRect(-bar.offset, bar.y + bar.h, W, 1);
            }
          }
          if (allDead) glitchActive = false;
        }

        // ── Edge data ticks (left side, near panel) ──
        for (var ti = 0; ti < 8; ti++) {
          var ty = 120 + ti * 60;
          var tw = 4 + Math.sin(t * 1.5 + ti) * 3;
          ctx.fillStyle = 'rgba(230, 57, 70, 0.05)';
          ctx.fillRect(8, ty, tw, 1);
        }

        // ── Right edge subtle data ticks ──
        for (var ti = 0; ti < 6; ti++) {
          var ty = 340 + ti * 55;
          var tw = 3 + Math.sin(t * 1.8 + ti * 0.7) * 2;
          ctx.fillStyle = 'rgba(92, 138, 173, 0.04)';
          ctx.fillRect(W - 8 - tw, ty, tw, 1);
        }

        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>
</body>
</html>
