<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    canvas { position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <canvas id="amb" width="1920" height="1080"></canvas>
  <script>
    (function () {
      var c = document.getElementById('amb');
      var ctx = c.getContext('2d');
      var W = 1920, H = 1080;

      // Safe zone
      var sx1 = 282, sx2 = 1608, sy1 = 108, sy2 = 1028;
      function inSafe(x, y) { return x > sx1 && x < sx2 && y > sy1 && y < sy2; }

      // Floating holographic grid particles
      var particles = [];
      for (var i = 0; i < 80; i++) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.12,
          vy: (Math.random() - 0.5) * 0.08,
          r: Math.random() * 1.2 + 0.3,
          a: Math.random() * 0.4 + 0.15,
          phase: Math.random() * Math.PI * 2,
          type: Math.random() > 0.7 ? 1 : 0  // 1 = diamond, 0 = circle
        });
      }

      // Radar sweep line (subtle)
      var radarAngle = 0;
      var radarX = 130; // center of panel area
      var radarY = 500;

      var t = 0;

      function draw() {
        ctx.clearRect(0, 0, W, H);
        t += 0.016;
        radarAngle += 0.004;

        // Draw particles
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < -10) p.x = W + 10;
          if (p.x > W + 10) p.x = -10;
          if (p.y < -10) p.y = H + 10;
          if (p.y > H + 10) p.y = -10;

          var flicker = Math.sin(t * 1.5 + p.phase) * 0.25 + 0.75;
          var alpha = p.a * flicker;
          if (inSafe(p.x, p.y)) alpha *= 0.2;

          if (p.type === 1) {
            // Diamond
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = 'rgba(230, 57, 70, ' + alpha + ')';
            ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
            ctx.restore();
          } else {
            // Circle
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(92, 138, 173, ' + alpha + ')';
            ctx.fill();
          }
        }

        // Subtle radar sweep in panel area (only outside safe zone)
        var sweepLen = 80;
        var ex = radarX + Math.cos(radarAngle) * sweepLen;
        var ey = radarY + Math.sin(radarAngle) * sweepLen;
        var grad = ctx.createLinearGradient(radarX, radarY, ex, ey);
        grad.addColorStop(0, 'rgba(230, 57, 70, 0.06)');
        grad.addColorStop(1, 'rgba(230, 57, 70, 0)');
        ctx.beginPath();
        ctx.moveTo(radarX, radarY);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.stroke();

        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>
</body>
</html>
