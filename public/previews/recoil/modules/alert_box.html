<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .alert-wrap {
      position: absolute;
      top: 140px;
      left: 50%; transform: translateX(-50%);
      width: 500px;
    }

    .alert-box {
      background: rgba(18, 8, 12, 0.95);
      border: 2px solid var(--red);
      box-shadow: var(--glow-red);
      padding: 18px 22px;
      text-align: center;
      position: relative;
      animation: rcAlertFlash 1.5s ease-in-out infinite;
      clip-path: polygon(
        0 0, calc(100% - 14px) 0,
        100% 14px, 100% 100%,
        14px 100%, 0 calc(100% - 14px)
      );
    }

    .alert-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: var(--red);
    }

    .alert-box::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(230,57,70,0.015) 3px, rgba(230,57,70,0.015) 4px
      );
      pointer-events: none;
    }

    .alert-icon {
      font-size: 18px;
      margin-bottom: 4px;
      animation: rcPulse 1s ease-in-out infinite;
    }
    .alert-title {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 5px;
      color: var(--red);
      margin-bottom: 4px;
    }
    .alert-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }
    .alert-sub {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="alert-wrap">
    <div class="alert-box">
      <div class="alert-icon">⚠</div>
      <div class="alert-title" data-config="alertTitle">⚠ INCOMING</div>
      <div class="alert-text" data-config="alertText">Nuevo refuerzo detectado en el sector</div>
      <div class="alert-sub" data-config="alertSub">recoil://alert_sys</div>
    </div>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
