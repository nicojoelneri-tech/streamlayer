<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .wrap{ position:absolute; left:0; right:0; bottom:0; height:90px; display:flex; align-items:flex-end; }

    .bar{
      position:relative; width:100%; height:52px;
      display:flex; align-items:center;
      background:var(--bg-panel);
      border-top:1px solid var(--border-dim);
      overflow:hidden;
    }
    /* dashed top line instead of gradient aurora */
    .bar::before{
      content:""; position:absolute; left:0; right:0; top:0; height:1px;
      border-top:1px dashed rgba(0,212,255,0.30);
    }

    .tag{
      flex:0 0 auto; height:100%;
      display:flex; align-items:center; gap:6px;
      padding:0 16px;
      background:rgba(0,212,255,0.04);
      border-right:1px solid var(--border-dim);
      font-size:13px; letter-spacing:2px; color:var(--green);
      text-transform:uppercase;
    }

    .window{ flex:1; overflow:hidden; display:flex; align-items:center; padding-left:12px; }
    .flow{
      display:flex; gap:80px; white-space:nowrap;
      animation: dlTicker 90s linear infinite;
    }
    .flow span{
      font-size:16px; letter-spacing:.5px; color:var(--text-mid);
    }
    .flow .hl{
      color:var(--cyan); font-weight:400;
      text-shadow: 0 0 8px rgba(192,160,255,0.3);
    }

    /* blinking cursor at right edge */
    .ticker-cursor{
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      width:8px; height:14px; background:var(--green);
      animation: dlBlink 1s step-end infinite;
      z-index:3;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div class="tag">
        <span data-config="tickerTag">> SYS</span>
      </div>
      <div class="window">
        <div class="flow" data-config-list="tickerItems"></div>
      </div>
      <div class="ticker-cursor"></div>
    </div>
  </div>
  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
</body>
</html>
