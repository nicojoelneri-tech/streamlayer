<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      animation: vgFadeLoop 8s ease-in-out infinite;
    }

    .card {
      width: 560px;
      padding: 44px 40px;
      background: var(--bg-void);
      border: 1px solid rgba(64,224,255,0.35);
      box-shadow: var(--glow-magenta);
      text-align: center;
      position: relative;
      clip-path: polygon(
        18px 0, calc(100% - 18px) 0,
        100% 18px, 100% calc(100% - 18px),
        calc(100% - 18px) 100%, 18px 100%,
        0 calc(100% - 18px), 0 18px
      );
    }

    .card::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(64,224,255,0.015) 2px, rgba(64,224,255,0.015) 4px
      );
      pointer-events: none;
    }

    .tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    .heading {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 36px;
      letter-spacing: 4px;
      color: var(--text);
      margin-bottom: 4px;
    }

    .accent {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 36px;
      letter-spacing: 4px;
      color: var(--magenta);
      text-shadow: 0 0 20px rgba(64,224,255,0.4);
      margin-bottom: 20px;
    }

    .sub {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-mid);
      margin-bottom: 20px;
    }

    .chips {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .chip {
      padding: 4px 14px;
      background: rgba(64,224,255,0.08);
      border: 1px solid rgba(64,224,255,0.25);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--magenta);
      clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%);
    }

    .note {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .sc { position: absolute; pointer-events: none; z-index: 2; }
    .sc::before, .sc::after {
      content: ''; position: absolute;
      background: var(--magenta);
      box-shadow: 0 0 4px var(--magenta);
    }
    .sc--tl { top: 4px; left: 16px; }
    .sc--tl::before { width: 18px; height: 2px; }
    .sc--tl::after  { width: 2px; height: 18px; }

    .sc--br { bottom: 4px; right: 16px; }
    .sc--br::before { width: 18px; height: 2px; bottom: 0; right: 0; }
    .sc--br::after  { width: 2px; height: 18px; bottom: 0; right: 0; }

    canvas { position: fixed; top: 0; left: 0; z-index: -1; }
  </style>
</head>
<body>
  <canvas id="bg" width="1920" height="1080"></canvas>

  <div class="card">
    <div class="tag" data-config="endingTag">// shutdown</div>
    <div class="heading" data-config="endingTitle">Desconectando</div>
    <div class="accent" data-config="endingAccent">Del Grid</div>
    <div class="sub" data-config="endingSub">Gracias por estar. Nos vemos en la próxima sesión.</div>
    <div class="chips">
      <span class="chip" data-config="endingChip1">SESIÓN OK</span>
      <span class="chip" data-config="endingChip2">GRACIAS</span>
      <span class="chip" data-config="endingChip3">EXIT</span>
    </div>
    <div class="note" data-config="endingNote">VOIDGRID PHANTOM v1.0 // end</div>

    <span class="sc sc--tl"></span>
    <span class="sc sc--br"></span>
  </div>

  <script src="../config/config.js"></script>
  <script src="../shared.js"></script>
  <script>
    (function () {
      var c = document.getElementById('bg');
      var ctx = c.getContext('2d');
      var W = 1920, H = 1080;
      var particles = [];
      for (var i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * W, y: Math.random() * H,
          r: Math.random() * 1 + 0.3,
          a: Math.random() * 0.25 + 0.08,
          vy: -(Math.random() * 0.15 + 0.05),
          vx: (Math.random() - 0.5) * 0.1
        });
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(64, 224, 255, ' + p.a + ')';
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
