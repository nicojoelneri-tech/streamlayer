<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <title>VOIDGRID PHANTOM — Preview</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px;
      overflow: hidden;
      background: #0c0420;
    }

    /* Simulated space background */
    .bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(60, 10, 100, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 30%, rgba(80, 20, 80, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(40, 10, 80, 0.25) 0%, transparent 50%),
        linear-gradient(180deg, #08021a 0%, #0e0428 40%, #140832 100%);
    }

    /* Simulated game area placeholder */
    .game-placeholder {
      position: absolute;
      left: 302px; top: 80px;
      width: 1346px; height: 940px;
      background:
        linear-gradient(135deg, rgba(25,10,45,0.7) 0%, rgba(15,10,40,0.7) 50%, rgba(25,8,40,0.7) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
    }
    .game-placeholder-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 6px;
      color: rgba(255,255,255,0.08);
      text-transform: uppercase;
    }

    /* Simulated webcam placeholder */
    .cam-placeholder {
      position: absolute;
      left: 14px; top: 80px;
      width: 280px; height: 200px;
      background: linear-gradient(135deg, rgba(35,15,55,0.8), rgba(20,10,45,0.8));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .cam-placeholder-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.1);
    }

    /* Simulated chat placeholder */
    .chat-placeholder {
      position: absolute;
      left: 14px; top: 288px;
      width: 280px; height: 700px;
      z-index: 5;
    }
    .chat-msg {
      padding: 6px 12px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.15);
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .chat-msg b {
      color: rgba(176,64,255,0.2);
      font-weight: 600;
    }

    /* Overlay iframes */
    iframe {
      position: absolute; top: 0; left: 0;
      width: 1920px; height: 1080px;
      border: none; background: transparent;
    }

    /* Zoom controls */
    .controls {
      position: fixed;
      bottom: 10px; right: 10px;
      z-index: 9999;
      display: flex;
      gap: 6px;
      font-family: 'Segoe UI', sans-serif;
    }
    .controls button {
      padding: 6px 14px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(176,64,255,0.3);
      color: #b040ff;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
    }
    .controls button:hover {
      background: rgba(176,64,255,0.15);
    }

    /* Scene tabs */
    .tabs {
      position: fixed;
      top: 10px; right: 10px;
      z-index: 9999;
      display: flex;
      gap: 6px;
      font-family: 'Segoe UI', sans-serif;
    }
    .tabs button {
      padding: 6px 16px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(176,64,255,0.3);
      color: #aaa;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .tabs button.active {
      color: #b040ff;
      border-color: #b040ff;
      background: rgba(176,64,255,0.1);
    }
    .tabs button:hover { color: #b040ff; }

    /* Scene containers */
    .scene { display: none; }
    .scene.active { display: block; }
  </style>
</head>
<body>

  <!-- ── SCENE: GAMEPLAY ── -->
  <div class="scene active" id="scene-gameplay">
    <div class="bg"></div>
    <div class="game-placeholder">
      <span class="game-placeholder-text">Game Capture</span>
    </div>
    <div class="cam-placeholder">
      <span class="cam-placeholder-text">Webcam</span>
    </div>
    <div class="chat-placeholder">
      <div class="chat-msg"><b>User1:</b> hola a todos!</div>
      <div class="chat-msg"><b>Mod_Bot:</b> bienvenidos al stream</div>
      <div class="chat-msg"><b>Viewer42:</b> que juegas hoy?</div>
      <div class="chat-msg"><b>Sub_Fan:</b> vamos!</div>
      <div class="chat-msg"><b>User99:</b> buena partida</div>
    </div>
    <iframe src="modules/ambient.html"></iframe>
    <iframe src="modules/top_hud.html"></iframe>
    <iframe src="modules/game_frame.html"></iframe>
    <iframe src="modules/chat_frame.html"></iframe>
    <iframe src="modules/focus_panel.html"></iframe>
    <iframe src="modules/camera_frame.html"></iframe>
    <iframe src="modules/ticker.html"></iframe>
  </div>

  <!-- ── SCENE: JUST CHATTING ── -->
  <div class="scene" id="scene-jc">
    <div class="bg"></div>
    <div class="cam-placeholder" style="left:302px;top:80px;width:1604px;height:940px;">
      <span class="cam-placeholder-text">Webcam (Full)</span>
    </div>
    <div class="chat-placeholder">
      <div class="chat-msg"><b>User1:</b> hola!</div>
      <div class="chat-msg"><b>Mod_Bot:</b> bienvenidos</div>
      <div class="chat-msg"><b>Viewer42:</b> de que hablamos?</div>
    </div>
    <iframe src="modules/top_hud.html"></iframe>
    <iframe src="modules/just_chatting_camera.html"></iframe>
    <iframe src="modules/chat_frame.html"></iframe>
    <iframe src="modules/ticker.html"></iframe>
  </div>

  <!-- ── SCENE: STARTING ── -->
  <div class="scene" id="scene-starting">
    <div class="bg"></div>
    <iframe src="presets/starting.html" style="background:transparent;"></iframe>
  </div>

  <!-- ── SCENE: BRB ── -->
  <div class="scene" id="scene-brb">
    <div class="bg"></div>
    <iframe src="presets/brb.html" style="background:transparent;"></iframe>
  </div>

  <!-- ── SCENE: ENDING ── -->
  <div class="scene" id="scene-ending">
    <div class="bg"></div>
    <iframe src="presets/ending.html" style="background:transparent;"></iframe>
  </div>

  <!-- ── UI Controls ── -->
  <div class="tabs">
    <button class="active" onclick="showScene('gameplay', this)">GAMEPLAY</button>
    <button onclick="showScene('jc', this)">JUST CHATTING</button>
    <button onclick="showScene('starting', this)">STARTING</button>
    <button onclick="showScene('brb', this)">BRB</button>
    <button onclick="showScene('ending', this)">ENDING</button>
  </div>

  <div class="controls">
    <button onclick="setZoom(0.5)">50%</button>
    <button onclick="setZoom(0.65)">65%</button>
    <button onclick="setZoom(0.8)">80%</button>
    <button onclick="setZoom(1)">100%</button>
  </div>

  <script>
    function showScene(id, btn) {
      document.querySelectorAll('.scene').forEach(function(s) { s.classList.remove('active'); });
      document.getElementById('scene-' + id).classList.add('active');
      document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('active'); });
      if(btn) btn.classList.add('active');
    }

    function setZoom(z) {
      document.body.style.transform = 'scale(' + z + ')';
      document.body.style.transformOrigin = 'top left';
    }

    // Auto-fit to window on load
    //(function() {
      //var z = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      //setZoom(z);
      //window.addEventListener('resize', function() {
        //var z = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        //setZoom(z);
      //});
    //})();
  </script>
</body>
</html>
