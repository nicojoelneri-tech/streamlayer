<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Chat — Enchanted Scroll</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #c8a24e;
    --accent2: #7b4dbf;
    --bg: rgba(18, 10, 6, 0.88);
    --text: #e8dcc8;
    --font: 'Cinzel', serif;
    --font-body: 'Crimson Text', serif;
    --font-size: 17px;
    --username-size: 14px;
    --chat-width: 500px;
  }

  body {
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: var(--font);
  }

  /* ── Contenedor ── */
  #chat-container {
    position: absolute;
    bottom: 60px;
    left: 60px;
    width: var(--chat-width);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 12px;
  }

  #chat-container.align-right { left: auto; right: 60px; }
  #chat-container.align-center { left: 50%; transform: translateX(-50%); }

  /* ══════════════════════════════════════════════════════════
     MENSAJE — Pergamino de fantasía con bordes ornamentales
     ══════════════════════════════════════════════════════════ */
  .chat-message {
    position: relative;
    width: 100%;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }

  /* ── Forma del pergamino (SVG border-image) ── */
  .msg-scroll {
    position: relative;
    padding: 16px 22px 18px 22px;
    background: var(--bg);
    border: 2px solid var(--accent);
    border-radius: 4px 4px 4px 4px;
  }

  /* ── Ornamento esquina superior izquierda ── */
  .msg-scroll::before {
    content: '⚜';
    position: absolute;
    top: -11px;
    left: 14px;
    font-size: 18px;
    color: var(--accent);
    text-shadow: 0 0 10px rgba(200, 162, 78, 0.6);
    background: var(--bg);
    padding: 0 5px;
    line-height: 1;
  }

  /* ── Ornamento esquina inferior derecha ── */
  .msg-scroll::after {
    content: '✦';
    position: absolute;
    bottom: -9px;
    right: 16px;
    font-size: 13px;
    color: var(--accent);
    text-shadow: 0 0 8px rgba(200, 162, 78, 0.5);
    background: var(--bg);
    padding: 0 5px;
    line-height: 1;
  }

  /* ── Línea dorada decorativa superior ── */
  .msg-gold-line {
    position: absolute;
    top: 8px;
    left: 50px;
    right: 20px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
    opacity: 0.4;
  }

  /* ── Barra lateral púrpura mágica ── */
  .msg-magic-bar {
    position: absolute;
    left: 0;
    top: 20%;
    bottom: 20%;
    width: 3px;
    background: linear-gradient(180deg, transparent, var(--accent2), transparent);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--accent2), 0 0 16px rgba(123, 77, 191, 0.3);
  }

  /* ── Partículas de brillo (pseudo sparkle) ── */
  .msg-sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--accent);
    animation: sparkle 2s ease-in-out infinite;
  }

  .msg-sparkle:nth-child(1) { top: 5px; right: 40px; animation-delay: 0s; }
  .msg-sparkle:nth-child(2) { bottom: 8px; left: 50px; animation-delay: 0.7s; }
  .msg-sparkle:nth-child(3) { top: 50%; right: 10px; animation-delay: 1.3s; }

  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.8; transform: scale(1.2); }
  }

  /* ── Header: badge + username ── */
  .msg-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 5px;
  }

  .msg-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
    border: 1.5px solid var(--accent);
  }

  .badge-broadcaster { background: rgba(200,162,78,0.3); color: var(--accent); }
  .badge-moderator { background: rgba(46,139,87,0.3); color: #5dbe8a; border-color: #5dbe8a; }
  .badge-vip { background: rgba(123,77,191,0.3); color: #b48eff; border-color: #b48eff; }
  .badge-subscriber { background: rgba(200,162,78,0.2); color: var(--accent); }

  .msg-username {
    font-family: var(--font);
    font-weight: 700;
    font-size: var(--username-size);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .msg-divider {
    flex-grow: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0.3;
    margin-left: 4px;
  }

  /* ── Texto ── */
  .msg-text {
    font-family: var(--font-body);
    font-size: var(--font-size);
    font-weight: 400;
    color: var(--text);
    line-height: 1.45;
    word-wrap: break-word;
    overflow-wrap: break-word;
    font-style: italic;
  }

  /* ── Textura de pergamino sutil ── */
  .msg-scroll .msg-texture {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(200,162,78,0.04) 0%, transparent 70%),
      radial-gradient(ellipse at 80% 50%, rgba(123,77,191,0.03) 0%, transparent 70%);
    pointer-events: none;
    border-radius: 4px;
  }

  /* ══════════════════════════════════════════════════════════
     ANIMACIONES
     ══════════════════════════════════════════════════════════ */

  .chat-message {
    animation: scrollAppear 0.5s ease forwards;
  }

  @keyframes scrollAppear {
    0% {
      opacity: 0;
      transform: translateY(25px) scale(0.95) rotateX(15deg);
      filter: brightness(1.5) saturate(0.5);
    }
    50% {
      opacity: 1;
      transform: translateY(-3px) scale(1.01) rotateX(0deg);
      filter: brightness(1.1) saturate(0.9);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1) rotateX(0deg);
      filter: brightness(1) saturate(1);
    }
  }

  .chat-message.removing {
    animation: scrollVanish 0.4s ease forwards;
  }

  @keyframes scrollVanish {
    0% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: brightness(1);
    }
    100% {
      opacity: 0;
      transform: translateY(-20px) scale(0.9);
      filter: brightness(1.5) saturate(0);
    }
  }

  /* ── Glow pulsante del borde ── */
  .msg-scroll {
    animation: borderGlow 4s ease-in-out infinite alternate;
  }

  @keyframes borderGlow {
    0% { box-shadow: 0 0 5px rgba(200,162,78,0.1), inset 0 0 10px rgba(200,162,78,0.03); }
    100% { box-shadow: 0 0 12px rgba(200,162,78,0.25), inset 0 0 15px rgba(200,162,78,0.06); }
  }

  /* ── Status ── */
  #status-indicator {
    position: fixed;
    top: 10px;
    left: 10px;
    font-family: var(--font);
    font-size: 10px;
    color: var(--accent);
    opacity: 0.4;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
  }

  #status-indicator .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8b0000;
  }

  #status-indicator.connected .dot {
    background: #5dbe8a;
    box-shadow: 0 0 6px #5dbe8a;
  }
</style>
</head>
<body>

<div id="status-indicator">
  <span class="dot"></span>
  <span id="status-text">OFFLINE</span>
</div>

<div id="chat-container"></div>

<script src="../_shared/twitch-chat.js"></script>
<script src="../_shared/chat-engine.js"></script>
<script src="config.js"></script>
<script>
(function() {
  const C = window.CHAT_CONFIG;

  const root = document.documentElement;
  root.style.setProperty('--accent', C.accentColor);
  root.style.setProperty('--accent2', C.accentSecondary);
  root.style.setProperty('--bg', C.bgColor);
  root.style.setProperty('--text', C.textColor);
  root.style.setProperty('--font', C.fontFamily);
  root.style.setProperty('--font-size', C.fontSize);
  root.style.setProperty('--username-size', C.usernameFontSize);
  root.style.setProperty('--chat-width', C.chatWidth + 'px');

  const container = document.getElementById('chat-container');
  if (C.alignment === 'right') container.classList.add('align-right');
  if (C.alignment === 'center') container.classList.add('align-center');

  function renderBadges(badges) {
    if (!C.showBadges || !badges) return '';
    let html = '';
    if (badges.broadcaster) html += '<span class="msg-badge badge-broadcaster">♛</span>';
    if (badges.moderator) html += '<span class="msg-badge badge-moderator">⚔</span>';
    if (badges.vip) html += '<span class="msg-badge badge-vip">★</span>';
    if (badges.subscriber) html += '<span class="msg-badge badge-subscriber">◆</span>';
    return html;
  }

  function sanitize(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function messageTemplate(msg) {
    const badgesHtml = renderBadges(msg.badges);

    return `
      <span class="msg-sparkle"></span>
      <span class="msg-sparkle"></span>
      <span class="msg-sparkle"></span>
      <div class="msg-scroll">
        <div class="msg-texture"></div>
        <div class="msg-magic-bar"></div>
        <div class="msg-gold-line"></div>
        <div class="msg-header">
          ${badgesHtml}
          <span class="msg-username" style="color: ${msg.color}">${sanitize(msg.displayName)}</span>
          <span class="msg-divider"></span>
        </div>
        <div class="msg-text">${sanitize(msg.message)}</div>
      </div>
    `;
  }

  const engine = new ChatEngine({
    container: container,
    maxVisible: C.maxMessages,
    animationDuration: C.animationSpeed,
    messageTemplate: messageTemplate
  });

  engine.animateOut = async function(el) {
    el.classList.add('removing');
    await this.wait(400);
    if (el.parentNode) el.parentNode.removeChild(el);
  };

  engine.displayMessage = async function(msgData) {
    if (this.visibleMessages.length >= this.maxVisible) {
      await this.removeOldest();
    }
    const el = document.createElement('div');
    el.className = 'chat-message';
    el.innerHTML = this.messageTemplate(msgData);
    this.container.appendChild(el);
    this.visibleMessages.push(el);
    if (this.messageDuration) {
      setTimeout(() => this.removeMessage(el), this.messageDuration);
    }
  };

  const statusEl = document.getElementById('status-indicator');
  const statusText = document.getElementById('status-text');

  if (C.demoMode) {
    statusText.textContent = 'DEMO';
    statusEl.classList.add('connected');
    startDemo();
  } else {
    const chat = new TwitchChat(C.channel);
    chat.on('connected', () => {
      statusEl.classList.add('connected');
      statusText.textContent = 'LIVE :: #' + C.channel;
    });
    chat.on('disconnected', () => {
      statusEl.classList.remove('connected');
      statusText.textContent = 'RECONNECTING...';
    });
    chat.on('message', (msg) => engine.addMessage(msg));
    chat.connect();
  }

  function startDemo() {
    const demoMessages = [
      { displayName: 'Eldrin', color: '#c8a24e', message: 'Saludos aventureros! Alguien vio al dragón del norte?', badges: { broadcaster: '1' } },
      { displayName: 'LunaFae', color: '#b48eff', message: 'Hola a todos! mi primer stream por acá ✨', badges: {} },
      { displayName: 'IronGuard', color: '#5dbe8a', message: 'Ese boss no tenía chance, bien jugado', badges: { moderator: '1' } },
      { displayName: 'MysticRune', color: '#ff8c69', message: 'Me encanta la estética del overlay, se siente como estar en una taberna medieval jaja', badges: { subscriber: '1' } },
      { displayName: 'ShadowElf', color: '#79c0ff', message: 'alguien quiere hacer party para la dungeon?', badges: {} },
      { displayName: 'CrystalMage', color: '#ff6ec7', message: 'Ese loot estuvo legendario, no puedo creerlo! La espada tiene stats increíbles y encima viene con un encantamiento de fuego que no vi nunca en el juego', badges: { vip: '1' } },
      { displayName: 'ThornKnight', color: '#ffd700', message: 'GG! nos vemos mañana', badges: { subscriber: '1' } },
      { displayName: 'PixieDust', color: '#dda0dd', message: 'cuánto falta para el evento?', badges: {} },
    ];

    let index = 0;
    function sendNext() {
      engine.addMessage(demoMessages[index % demoMessages.length]);
      index++;
      setTimeout(sendNext, 2200 + Math.random() * 2500);
    }
    setTimeout(() => sendNext(), 500);
  }

})();
</script>
</body>
</html>
